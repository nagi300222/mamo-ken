  const s=Math.min(innerWidth/W,innerHeight/H);vScale=s;
  const d=window.devicePixelRatio||1;
  cv.width=Math.round(W*s*d);cv.height=Math.round(H*s*d);
  cv.style.width=Math.round(W*s)+'px';cv.style.height=Math.round(H*s)+'px';
  ctx.setTransform(s*d,0,0,s*d,0,0);
}
addEventListener('resize',fit);fit();

 * 描画にフォールバックする。立ち絵は白背景のままの場合に備えしきい値白抜きを行う。
 */
const ASSETS={};
function loadImg(key,src,preserveWhite){
  const img=new Image();
  const e={img:img,ready:false,failed:false,canvas:null};
  ASSETS[key]=e;
  img.onload=function(){if(!preserveWhite)whitenAsset(e);else{e.canvas=null;e.bboxH=e.img.naturalHeight;}e.ready=true;};
  img.onerror=function(){e.failed=true;};
  img.src=src;
  return e;
}
function whitenAsset(e){ // 近似白(しきい値)を透過化。既に透過済みのPNGなら実質no-op。ついでにalpha bboxの高さも実測する
  try{
    const oc=document.createElement('canvas');
    oc.width=e.img.naturalWidth;oc.height=e.img.naturalHeight;
    const octx=oc.getContext('2d');
    octx.drawImage(e.img,0,0);
    const id=octx.getImageData(0,0,oc.width,oc.height);
    const d=id.data,TH=238;
    let minY=oc.height,maxY=-1;
    for(let y=0;y<oc.height;y++){
      for(let x=0;x<oc.width;x++){
        const i=(y*oc.width+x)*4;
        if(d[i]>=TH&&d[i+1]>=TH&&d[i+2]>=TH)d[i+3]=0;
        if(d[i+3]>10){if(y<minY)minY=y;if(y>maxY)maxY=y;}
      }
    }
    octx.putImageData(id,0,0);
    e.canvas=oc;
    if(maxY>=minY)e.bboxH=maxY-minY+1; // 実測キャラ高(alpha bboxの高さ)。表示倍率の動的算出に使う
  }catch(err){ /* file://等でcanvasが汚染される環境では無処理の原画のまま使う(bboxH未設定→呼び出し側でフォールバック) */ }
}

let AC=null;
function audioInit(){try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();

}catch(e){}}
function tone(f0,dur,type,vol,f1){if(!AC)return;try{
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.linearRampToValueAtTime(f1==null?f0:f1,t+dur);
  g.gain.setValueAtTime((vol||0.15)*SE_VOLUME,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+dur+0.02);
}catch(e){}}
function noiseS(dur,vol){if(!AC)return;try{
  const t=AC.currentTime,n=(AC.sampleRate*dur)|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;
  const g=AC.createGain();g.gain.setValueAtTime(vol*SE_VOLUME,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(g);g.connect(AC.destination);s.start(t);
}catch(e){}}

/* ================= BGM管理(R1/R2/BGM-R1.2) =================
   BGM-R1.2: 全BGM(タイトル/選択/闘技場)をAudioBufferSourceNode+GainNodeで再生する
   単一のWeb Audio経路に統一する(旧R1/R2はタイトル/選択をHTMLAudioElementで再生していたが、
   iOSでOSのメディアコントロール[通知センター/ロック画面]に再生ボタン・曲名が表示されて
   しまう問題があり、これを解消するため撤去した。SEは既存のWebAudio合成のまま変更しない)。

   file://直開き(prototype)ではfetch()/XMLHttpRequestがCORSで失敗するため、bgm mp3の
   バイト列(ArrayBuffer)は<script src>読み込み(通常のリソース読み込みでCORS制限を受けない)
   経由のwindow.__BGM_B64__(runtime/bgm-b64.js、tools/build_bgm_b64.mjsが生成)から取得する。
   dist埋め込み時は__ASSET_MAP__のdata URLをそのまま使う(画像のloadImg()と同じ仕組み)。
   イントロ+ループが必要な曲(闘技場(昼))はAudioBufferSourceNode.loopStart/loopEndを使う
   (HTMLAudioElement.currentTimeの監視はMP3のシーク精度が不十分なため使わない)。
   音量はBGM_VOLUME1箇所→単一のGainNodeに適用され、全曲で共通に効く。

   ▼BGM追加手順(新しい曲を1曲追加する場合)
   1. 配置先: assets/bgm/ 直下にmp3を置く
   2. ASCII命名: bgm_<用途>.mp3のような英数字のみのファイル名にする
      (日本語ファイル名はfile://直開き環境やビルド処理で問題になりうるため使わない)
   3. MAP追記: 下のBGM_SOURCESに「キー: '../assets/bgm/ファイル名'」を1行追加し、
      BGM_SCREEN_MAPの対応するnullエントリをそのキー名に差し替える(既存キーの
      対応先を変える場合もこの2箇所を直すだけでよい)。イントロ+ループが必要な曲は
      BGM_LOOP_STARTに「キー: 秒数」を追加する(無指定キーは曲全体をloopする)
   4. b64再生成: tools/build_bgm_b64.mjsのBGM_SOURCESにも同じキー:ファイル名を追記し、
      node tools/build_bgm_b64.mjs を実行してruntime/bgm-b64.jsを再生成する
      (prototypeのfile://直開き用。distはbuild_mobile.mjsが別途__ASSET_MAP__へ埋め込む
      ため、拡張子が.mp3のままなら追加作業は不要)
   5. dist再生成: node tools/build_mobile.mjs を実行し、dist/mamoken_mobile.htmlを
      再生成してコミットする */

const BGM_LOOP_START={arena:11.584}; // イントロ+ループ構成の曲のみ指定(0.000〜loopStart=イントロ・初回のみ)。無指定キーは曲全体をloop
const bgmBuffers={},bgmBufferLoading={};
function base64ToArrayBuffer(b64OrDataUri){
  const i=b64OrDataUri.indexOf(',');
  const b64=(b64OrDataUri.indexOf('data:')===0&&i>=0)?b64OrDataUri.slice(i+1):b64OrDataUri;
  const bin=atob(b64);
  const out=new Uint8Array(bin.length);
  for(let j=0;j<bin.length;j++)out[j]=bin.charCodeAt(j);
  return out.buffer;
}
function bgmLoadStart(key){ // 一度だけ非同期デコードを開始(ネットワークアクセスなし)
  if(bgmBuffers[key]||bgmBufferLoading[key])return;
  const relPath=BGM_SOURCES[key];
  const dataSrc=(typeof __ASSET_MAP__!=='undefined'&&Object.prototype.hasOwnProperty.call(__ASSET_MAP__,relPath))?__ASSET_MAP__[relPath]:(typeof window.__BGM_B64__!=='undefined'?window.__BGM_B64__[key]:null);
  if(!dataSrc)return; // 読み込み元が未準備: 次回呼び出しで再試行
  bgmBufferLoading[key]=true;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)(); // decodeAudioData自体はsuspended状態でも実行できる
    const ab=base64ToArrayBuffer(dataSrc);
    AC.decodeAudioData(ab).then(
      (decoded)=>{bgmBuffers[key]=decoded;bgmBufferLoading[key]=false;},
      ()=>{bgmBufferLoading[key]=false;} // 失敗時は無音のまま(次回呼び出しで再試行)。無理な回避処理は入れない
    );
  }catch(e){bgmBufferLoading[key]=false;}
}
let bgmGainNode=null,bgmSrcNode=null,bgmCurrentKey=null,bgmPlaying=false;
function bgmEnsureGain(){
  if(!AC)return null;
  if(!bgmGainNode){bgmGainNode=AC.createGain();bgmGainNode.connect(AC.destination);}
  bgmGainNode.gain.value=BGM_VOLUME; // 全BGM共通の音量を都度反映(デバッグスライダーでの変更もここで効く)
  return bgmGainNode;
}
function bgmStop(){ // 画面遷移時の後始末: 現在の曲を止める(次回同じ曲に戻った際は先頭から)。AudioBufferSourceNodeは再利用不可のため次回開始時に新規作成する
  if(bgmSrcNode){try{bgmSrcNode.onended=null;bgmSrcNode.stop();bgmSrcNode.disconnect();}catch(e){}bgmSrcNode=null;}
  bgmPlaying=false;bgmCurrentKey=null;
}
function bgmPlay(key){
  if(!BGM_SOURCES[key])return;
  if(bgmCurrentKey===key){if(bgmPlaying)return;} // 同一曲・再生中なら無駄な再スタートをしない
  else{bgmStop();bgmCurrentKey=key;} // 曲の切り替え: 二重再生防止のため先に前の曲を確実に止める
  if(!bgmBuffers[key]){bgmLoadStart(key);return;} // デコード未完了/自動再生解禁待ちの間は次フレームで自動的に再試行される(frame()内のbgmSyncToScreen()より)
  if(!AC)return;
  if(AC.state==='suspended')AC.resume();
  const g=bgmEnsureGain();
  if(!g)return;
  const src=AC.createBufferSource();
  src.buffer=bgmBuffers[key];
  const loopStart=BGM_LOOP_START[key];
  src.loop=true;
  if(loopStart!=null){src.loopStart=loopStart;src.loopEnd=bgmBuffers[key].duration;} // イントロ+ループ(闘技場(昼)等)
  src.connect(g);
  src.start(0); // offset省略=0.000から再生。loopStart指定曲は0.000〜loopStartがこの1回のみ、以降loopStart〜loopEndをループ
  bgmSrcNode=src;
  bgmPlaying=true;
}
for(const k in BGM_SOURCES)bgmLoadStart(k); // 起動直後から全曲のデコードを先行させ、再生開始時点では待たされないようにする
// バックグラウンド遷移→復帰時のsuspend/resume対策(BGM-R1.2 (3)): AudioContextがサスペンド/
// (稀なケースとして)破棄された状態で復帰した場合に無音固着が起きないよう、復帰直後に必ず
// 一旦bgmStop()してからbgmSyncToScreen()で再評価させる(同一曲でも「再生中」フラグが崩れて
// いる可能性があるため、常に明示的に停止→再開示させることで二重再生も防ぐ)
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(AC&&AC.state==='closed'){AC=null;bgmGainNode=null;} // 長時間バックグラウンドでcontextが破棄される稀なケースの保険
  if(AC&&AC.state==='suspended')AC.resume();
  bgmStop();
  bgmSyncToScreen();
});
// 画面→BGMバケットの対応。characterDetail/pause/movelist/onlineInterruptedは
// 元の画面(選択/戦闘)の続きとして扱い、resultは対戦終了に伴い明示的に無音へ戻す。
// オンライン系画面(ロビー/ルーム待機はどちらもonlineLobby一つの画面・オンライン
// キャラ選択)は専用曲が無いため値をnullにしてある(=このMapに載っている=「今回勝手に
// 割り当てない」対象であることが明示され、曲が用意でき次第キーを差すだけで良い)。
// なお「オンライン対戦」はオフラインと同じgame.screen==='battle'を共有しており、
// 既に闘技場(昼)BGMが対応済みのためここに別キーは無い(唯一の背景と紐付いているため)。
// spriteCheck(?debug=sprites専用のデバッグ画面)はオンライン系ではないため対象外
// (このMapに載っていない画面は前の曲を止めも切り替えもしない=現状維持)。
const BGM_SCREEN_MAP={
  title:'title',
  menuBattle:'title',menuMinigame:'title',menuOptions:'title',miniPractice:'title', // MENU-R1(#111): タイトル系メニュー内は一貫してtitle BGMを継続
  select:'select',characterDetail:'select',
  battle:'arena',pause:'arena',movelist:'arena',onlineInterrupted:'arena',
  result:null,
  onlineLobby:null, // ロビー/ルーム待機(online.stateのconnecting/waiting/ready/errorは全てこの画面のまま)
  onlineSelect:null // オンライン対戦のキャラクター選択
};
function bgmSyncToScreen(){
  if(!Object.prototype.hasOwnProperty.call(BGM_SCREEN_MAP,game.screen))return;
  const target=BGM_SCREEN_MAP[game.screen];
  if(target===null)bgmStop();else bgmPlay(target);
}

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return 'rgb('+r+','+g+','+b+')';
}
function L(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
function bz(a,c,b,t){const u=1-t;return[u*u*a[0]+2*u*t*c[0]+t*t*b[0],u*u*a[1]+2*u*t*c[1]+t*t*b[1]];}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
let inMirrorZone=false; // オンライン2P側のビュー反転(§6.8 v2.5.1(7))が有効な描画区間中か。rBattle()の反転save/restore内でのみtrue
function txt(t,x,y,size,color,align){
  ctx.font='900 '+size+'px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  const al=align||'center';
  ctx.lineWidth=Math.max(3,size*0.16);ctx.strokeStyle='rgba(0,0,0,0.85)';ctx.lineJoin='round';
  if(inMirrorZone){ // 座標はミラーされた空間のまま・文字だけ正向きに描く(鏡文字にしない)ため局所的に打ち消す
    ctx.save();
    ctx.translate(x,y);ctx.scale(-1,1);
    ctx.textAlign=(al==='left')?'right':(al==='right')?'left':'center';ctx.textBaseline='middle';
    ctx.strokeText(t,0,0);
    ctx.fillStyle=color;ctx.fillText(t,0,0);
    ctx.restore();
    return;
  }
  ctx.textAlign=al;ctx.textBaseline='middle';
  ctx.strokeText(t,x,y);
  ctx.fillStyle=color;ctx.fillText(t,x,y);
}
function inRect(p,x,y,w,h){return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;}
function star(x,y,r,col){
  ctx.save();ctx.translate(x,y);ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4,r2=(i%2===0)?r:r*0.45;
    if(i===0)ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2);else ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);}
  ctx.closePath();ctx.fill();ctx.restore();
}

/* ================= オンライン対戦（v0.9） =================
 * サーバーはWebSocketリレー専用(ゲームロジックを持たない)。ロビーで両者が揃うと
 * 共有rngシードを受け取り、以後は入力コマンド(タグ:frame番号)を交換するロックステップ方式で
 * 両クライアントが同一のB状態を独立に計算する(§03データ設計 準拠、Math.randomは対戦本体で不使用)。
 * ギュイーン(競り合いミニゲーム)は実際のタップを相互送信しない(スコープ外・PR3)。
 * オンライン中は両サイドとも共有rng駆動のシミュレーション結果で決着させ、決定性を優先する
 * (ローカルのタップはSE/演出のみに反映し、勝敗には影響しない)。
 */
const CONFIG={WS_URL:'wss://mamoken-relay.n-kyosuke1121.workers.dev'}; // デプロイ済み本番Workers URL
// ONLINE-9 (2): ビルド識別子。ルーム確立時に両者で交換し、不一致ならデシンク事故を未然に防ぐため
// 対戦を開始しない。手動で採番する版数タグ(オンラインの同期仕様や9キャラ化のような互換性を破る
// 変更を配布するたびに更新すること)。サーバー(server/)はメッセージ種別を解釈せず中継するだけ
// なので、このチェックはサーバー変更なしにクライアント同士だけで実装できる
const BUILD_ID='mamoken-roar-r2-2026-08-10'; // ROAR-R2(#98): Roarのstartup/armor窓/hitstop timingがsimulation-relevantに変更されたためbump(Codexレビュー指摘 PR#115)
const ONLINE_BACK_RECT={x:70,y:864,w:400,h:60};
const online={
  state:'menu', // 'menu'|'connecting'|'waiting'|'ready'|'error'
  mode:null,    // 'create'|'join'
  code:null,ws:null,slot:null,seed:null,errorMsg:'',
  myPick:null,peerPick:null, // オンラインキャラ選択(CHARSのindex)
  keepaliveIv:null, // WSキープアライブping用interval(v0.9.2: 無通信での切断誤検知を減らす)
  lastPingSentAt:null,myDelayF:null,delayFBySlot:{}, // v0.10 (9): 開始時RTT適応delayF。両者確定するまでmaybeStartOnlineBattleは待つ
  peerBuildId:null // ONLINE-9 (2): 相手から届いたBUILD_ID。既知になるまでmaybeStartOnlineBattleは待つ
};
function computeDelayFromRTT(rttMs){ // delayF=clamp(3,ceil(RTT/2/16.7ms)+1,8) (§6.8 v2.5(9))
  const oneWayFrames=Math.ceil((rttMs/2)/BAL.NET.frameMs)+1;
  return Math.min(BAL.NET.delayFMax,Math.max(BAL.NET.delayFMin,oneWayFrames));
}
const KEEPALIVE_MS=10000; // 10秒間隔でpingを送る(無通信タイムアウトによる誤切断対策)
const NET={ // ロックステップ状態(startOnlineBattleで対戦ごとに初期化)
  active:false,       // true=オンライン対戦本体が進行中(この間はCPU AI/オフラインrng消費経路を一切使わない)
  delayF:BAL.NET.delayFMax, // 入力遅延バッファ(F)。RTT実測に基づき部屋確立時に両者の大きい方へ確定(v0.10 (9))。未確定時は安全側の上限
  capTick:0,           // ローカル入力の採取カウンタ(毎ロジックF必ず+1。採取と送信は待機中でも止めない=二重送信防止)
  simF:0,              // 次に確定させるシミュレーションフレーム番号
  localQ:{},peerQ:{},  // frame番号 -> {cmds,hold}
  waiting:false,       // true="同期中…"(両者のF入力が揃うまでこのFのロジックは進めない)
  waitingF:0,          // 待機が連続何F続いているか。表示のちらつき防止にBAL.NET.waitingShowFで閾値判定
  matchSeq:0,          // 対戦(startOnlineBattle)ごとに+1する通し番号。勝ち残り交代等で対戦が
                        // 連続する際、前の対戦の終盤に届いた遅延cmdが次の対戦のsimF(0番から
                        // 再カウント)と衝突してpeerQを汚染しないよう、cmdメッセージに載せて
                        // 世代を区別する(絶対にリセットしない・増加のみ)
  pendCmds0:[],pendCmds1:[],pendHold0:null,pendHold1:null // vNext PR3レビュー指摘(PR#76・§9 Hitstop中方向仕込み可):
  // Command hitstopでこのFのnetFightStep呼び出し自体をskipする間も、そのFに届いたcmds/holdを捨てずここへ
  // 積んでおき、hitstopが明けた最初のFでまとめて渡す(netLogicTick参照。オフラインのevqがhitstop中も
  // 貯まり続けるのと同じ挙動をオンラインでも再現する)
};
let netPendingPeerCmds=[]; // 自分がstartOnlineBattle前に受信したcmd(相手が先に対戦開始した場合の取りこぼし防止。matchSeq付き)
function onlineActive(){return NET.active;}
function netSend(msg){if(online.ws&&online.ws.readyState===1){try{online.ws.send(JSON.stringify(msg));}catch(e){}}}
function onlineReset(){
  if(online.ws){try{online.ws.close();}catch(e){}}
  if(online.keepaliveIv){clearInterval(online.keepaliveIv);online.keepaliveIv=null;}
  online.state='menu';online.mode=null;online.code=null;online.ws=null;online.slot=null;online.seed=null;online.errorMsg='';
  online.myPick=null;online.peerPick=null;
  online.lastPingSentAt=null;online.myDelayF=null;online.delayFBySlot={};
  online.peerBuildId=null; // ONLINE-9 (2)
  NET.active=false;netPendingPeerCmds=[];
}
function onlineHandleDisconnect(reason){
  online.state='error';online.errorMsg=reason;
  NET.active=false;
  if(game.screen==='onlineSelect'||game.screen==='battle'||game.screen==='result')game.screen='onlineInterrupted';
}
function onlineVersionMismatch(){ // ONLINE-9 (2): ビルド識別子不一致。どの画面にいても即座に対戦へ進ませない
  online.errorMsg='バージョンが違います。ページを更新してください';
  online.state='error';
  NET.active=false;
  if(online.keepaliveIv){clearInterval(online.keepaliveIv);online.keepaliveIv=null;}
  if(online.ws){try{online.ws.close();}catch(e){}}
  game.screen='onlineInterrupted';
}
function onlineConnect(code,mode){
  online.mode=mode;online.code=code;online.state='connecting';
  let ws;
  try{ws=new WebSocket(CONFIG.WS_URL+'/ws/'+code);}
  catch(e){online.state='error';online.errorMsg='接続に失敗しました';return;}
  online.ws=ws;
  ws.addEventListener('open',function(){
    online.state='waiting';
    if(online.keepaliveIv)clearInterval(online.keepaliveIv);
    // キープアライブ(無通信での切断誤検知対策)を兼ねて、pingのたびにlastPingSentAtを更新する。
    // 最初のpongでmyDelayFが未確定なら都度RTTを計測できるため、初回のpingロスにも自己修復する(v0.10 (9))
    online.keepaliveIv=setInterval(function(){online.lastPingSentAt=performance.now();netSend({t:'ping'});},KEEPALIVE_MS);
  });
  ws.addEventListener('message',function(ev){
    let msg;try{msg=JSON.parse(ev.data);}catch(e){return;}
    if(msg.t==='welcome'){
      online.slot=msg.slot;
      online.lastPingSentAt=performance.now();netSend({t:'ping'}); // 部屋確立時にRTT計測を即時開始(v0.10 (9)、キープアライブの初回を待たない)
      netSend({t:'hello',buildId:BUILD_ID}); // ONLINE-9 (2): 部屋確立時にビルド識別子を送る(サーバーは意味を解釈せずそのまま相手へ中継する)
    }
    else if(msg.t==='pong'){
      if(online.lastPingSentAt!=null&&online.myDelayF==null){
        const rtt=performance.now()-online.lastPingSentAt;
        online.myDelayF=computeDelayFromRTT(rtt);
        if(online.slot===0||online.slot===1)online.delayFBySlot[online.slot]=online.myDelayF;
        netSend({t:'delayFReport',slot:online.slot,value:online.myDelayF});
        if(game.screen==='onlineSelect')maybeStartOnlineBattle();
      }
    }
    else if(msg.t==='delayFReport'){ // 相手クライアントが計測したdelayF算出値(v0.10 (9)。大きい方を両者で採用)
      if((msg.slot===0||msg.slot===1)&&typeof msg.value==='number')online.delayFBySlot[msg.slot]=msg.value;
      if(game.screen==='onlineSelect')maybeStartOnlineBattle();
    }
    else if(msg.t==='hello'){ // ONLINE-9 (2): 相手のビルド識別子。不一致ならその場で対戦を止める
      if(typeof msg.buildId==='string')online.peerBuildId=msg.buildId;
      if(online.peerBuildId!=null&&online.peerBuildId!==BUILD_ID){onlineVersionMismatch();return;}
      if(game.screen==='onlineSelect')maybeStartOnlineBattle();
    }
    else if(msg.t==='peerJoined'){ // 新規接続(観戦者含む)通知。自分の計測済みdelayF・ビルド識別子を再送し、後から入室した相手にも届くようにする(v0.10 (9)/ONLINE-9 (2))
      if(online.myDelayF!=null)netSend({t:'delayFReport',slot:online.slot,value:online.myDelayF});
      netSend({t:'hello',buildId:BUILD_ID});
    }
    else if(msg.t==='ready'){
      online.seed=msg.seed;online.state='ready';
      if(online.slot===0||online.slot===1){online.myPick=null;online.peerPick=null;game.screen='onlineSelect';}
    }else if(msg.t==='yourSlot'){ // 勝ち残り交代(v0.9 PR4): 観戦者⇔対戦者の入れ替え通知
      online.slot=msg.slot;
      if(msg.slot>=2){ // 敗者→観戦者に降格。直後に新シードの'ready'は届かないのでここでロビーへ戻す
        online.myPick=null;online.peerPick=null;
        game.screen='onlineLobby';
      }else if(online.myDelayF!=null){ // 観戦者→対戦者に昇格: 既に計測済みのmyDelayFを新slotで再送(v0.10 (9))
        online.delayFBySlot[online.slot]=online.myDelayF;
        netSend({t:'delayFReport',slot:online.slot,value:online.myDelayF});
      } // この直後に届く'ready'がonlineSelectへ遷移させる
    }else if(msg.t==='peerLeft'){
      if(online.state==='ready'&&(msg.slot===0||msg.slot===1))onlineHandleDisconnect('相手が退出しました'); // 観戦者の退出では対戦を中断しない
    }else if(msg.t==='pick'){
      online.peerPick=msg.charIdx;
      if(game.screen==='onlineSelect')maybeStartOnlineBattle();
    }else if(msg.t==='cmd'){
      // matchSeqで対戦の世代を区別する: 今の対戦(NET.matchSeq)宛てのみ即適用。
      // 未来の対戦(相手が先に開始した分)は保留し、過去の対戦の残骸(前の対戦の終盤に
      // 遅れて届いた分)は破棄する(simFは対戦ごとに0から数え直すため、破棄しないと
      // 次の対戦のpeerQを誤って汚染しデシンクの原因になる)
      if(NET.active&&msg.matchSeq===NET.matchSeq)NET.peerQ[msg.f]={cmds:msg.cmds,hold:msg.hold};
      else if(msg.matchSeq>NET.matchSeq)netPendingPeerCmds.push(msg);
    }
  });
  ws.addEventListener('close',function(){
    if(online.keepaliveIv){clearInterval(online.keepaliveIv);online.keepaliveIv=null;}
    // ONLINE-9 (2): 既にerror状態(自分でonlineVersionMismatch()等がws.close()した場合を含む)なら、
    // このclose通知で汎用の「通信が切断されました」に上書きしない(バージョン不一致メッセージ等を残す)
    if(online.state!=='menu'&&online.state!=='error')onlineHandleDisconnect('通信が切断されました');
  });
  ws.addEventListener('error',function(){
    if(online.keepaliveIv){clearInterval(online.keepaliveIv);online.keepaliveIv=null;}
    onlineHandleDisconnect('接続エラーが発生しました');
  });
}

function specForLv(f,lv){ // BAL-R1: 通常技(crouch/mid/high/low)はBAL_R1_CHARSのper-charデータ駆動。

  const b=r1Char(f.c)[lv];

  // (Damage x1.08はGuts同様darkBodyOutgoing()でhitApply側の最終damageへ適用=A.dへ二重適用しない)
  const s=f.darkBodyActive?Math.max(1,b.s-1):b.s;

  // action開始時にf.pisukeSpecialRecoveryActiveへsnapshot済み(Codex #103レビュー対応: 生のf.specialActiveFを
  // 毎フレーム見ると、action中にSPECIALが切れた瞬間にrecoveryが急に伸びてしまうため)
  const r=f.pisukeSpecialRecoveryActive?Math.max(1,Math.round(b.r*0.70)):b.r;
  return{s:s,a:b.a,r:r,d:b.d,y:BAL.ATK[lv].y,down:b.down||false,gd:b.gd,hitstun:b.hitstun||22,blockstun:b.blockstun};
}
function specForCmd(f,m){ // コマンド技(v0.10): 数値はBAL.CMDの技定義そのもの(キャラのsOfsは適用しない=技ごとに調整済みの値)。
  // 旧9技(P1以前からの既存技、枠1〜3の一部)はキャラのdMul+共通BAL.HITSTUN/BLOCKSTUN/GDMG_Aを
  // 引き続き適用する(既存動作を維持)。CMD-R1で追加/置換した技(m.exactDmg:true)は既にキャラ別の
  // 確定値(damage/hitAdv/blockAdv由来のhitstun・blockstun)のため、二重適用しないよう素通しする
  // CMD-R1: m.downが文字列ならBAL.DOWNWAKEのキーとして直接使う(hardDown/throwDown流用等)。true=lightDown。
  // vNext PR3: 旧来の「m.down未指定でもtrigger==='low'ならlightDownを既定付与」フォールバックは撤廃
  // (§13本文がdownを明示しない下段Command技は無down。§4のNormal LOW共通lightDown撤廃と同じ方針)
  const downType=(typeof m.down==='string')?m.down:(m.down===true?'lightDown':false);
  const dmgBase=m.exactDmg?m.d:m.d*f.c.dMul;
  // vNext PR4 (Yomikage RETURN/JUST): Just成立で発動したReturn(天/地/芯のみ。腕返しは対象外)は
  // 「Return startup -2F / dmg x1.10 / GD unchanged」を適用する
  const yomiJustFire=f.cmdMove===m&&f.c.id==='yomikage'&&f.yomiFiredJust&&YOMI_JUST_MOVES.has(m.name);
  // vNext PR4 (Dark Moguzo BODY): 「Command startup -2」。f.darkBodyActiveはaction開始時点のsnapshot
  // (Damage x1.08はGuts同様darkBodyOutgoing()でhitApply側の最終damageへ適用=A.dへ二重適用しない)
  const darkBodyFire=f.cmdMove===m&&f.c.id==='dark_moguzo'&&f.darkBodyActive;
  const s=Math.max(1,m.s-(yomiJustFire?2:0)-(darkBodyFire?2:0));

  const rBase=m.r||BAL.ATK[m.lv].r;

  // darkBodyFireと同じくaction開始時snapshot(f.pisukeSpecialRecoveryActive)を見る(Codex #103レビュー対応)
  const r=f.pisukeSpecialRecoveryActive?Math.max(1,Math.round(rBase*0.70)):rBase;
  const dmg=yomiJustFire?Math.round(dmgBase*1.10):dmgBase;
  return{s:s,a:a,r:r,d:dmg,y:BAL.ATK[m.lv].y,down:downType,
    gd:(m.guardDmg!=null)?m.guardDmg:BAL.GDMG_A,
    hitstun:m.hitstun!=null?m.hitstun:(BAL.HITSTUN[m.lv]||22),
    blockstun:m.blockstun!=null?m.blockstun:BAL.BLOCKSTUN[m.lv]};
}

const DODGE_DIR={sway:'left',crouch:'down',lunge:'right'}; // 方向ボタンの押下履歴を入力バッファへ積む際の矢印表記

function detectCommandMove(f){ // 直近nF方向がキャラのコマンド技のいずれかと一致すれば{move,idx}を返す。
  // CMD-R1: seqは2〜4方向の可変長に対応し、longest-command-first(最長一致優先)で判定する
  // (例: 2方向technicalの末尾一致が3〜4方向technicalの末尾とも一致する場合、後者を優先する)
  const moves=commandMovesFor(f.c);
  if(!moves)return null;
  const win=f.dirBuf.filter(function(e){return B.f-e.f<=BAL.CMD.bufF;});
  if(win.length<2)return null;
  let best=null,bestLen=0;
  for(let i=0;i<moves.length;i++){
    const m=moves[i],len=m.seq.length;
    if(len<=bestLen||win.length<len)continue;
    let ok=true;
    for(let k=0;k<len;k++){if(win[win.length-len+k].dir!==m.seq[k]){ok=false;break;}}
    if(ok){best={move:m,idx:i};bestLen=len;}
  }
  return best;
}
// vNext PR4 (共通 "spendはmove start、refundなし" / Godan ARMOR STOCK・Bullet CHARGE "resource不足→Command unavailable/normal fallback"):

function hasResourceFor(f,m){return!m.cost||(f[m.cost.res]||0)>=m.cost.amt;}

// 実際にresource消費して開始した(=戻り値true)瞬間だけ書き込む。Modern入力が不成立でNormalへfallbackした
// 場合はこれらの関数自体が呼ばれないため、自然に「Modern失敗時は表示しない」を満たす。

// (B.fで管理すると新ラウンド開始直後にB.fが巻き戻り、前ラウンド末の表示が長時間居座るバグになる)。
const CMD_FEEDBACK_DUR_F=60; // 約1秒(60fps基準)

function startCmdAtk(f,m,idx,preserveCombo,viaModern){ // vNext PR3 (§9 Classic Cancel): preserveCombo=trueはcancel経由の発動(combo/scaling維持。§9「combo/scaling resetなし」)

function striking(f){

}
function roarStriking(f){return f.phase==='roar'&&f.pf===BAL.ROAR.s+1;}

function resolveHits(){

    hitApply(a,b,a.counterReadyF>0,aLv,aCm);if(B.flow!=='fight')return;

  if(ar&&br){ // 咆哮相打ち: 双方クリーンヒット扱いで奥義ストック+1(v2.3)
    const d=BAL.ROAR.d;
    let dToB=gutsOutgoing(a,d),dToA=gutsOutgoing(b,d); // vNext PR4 (Moguzo GUTS): Roar対象。相打ちは互いが相手への攻撃側
    dToB=darkBodyOutgoing(a,dToB);dToA=darkBodyOutgoing(b,dToA); // vNext PR4 (Dark Moguzo BODY): 同上
    dToB=moguzoSpecialOutgoing(a,dToB);dToA=moguzoSpecialOutgoing(b,dToA); // ABILITY-R2-A (Moguzo SPECIAL): 同上
    dToB=moguzoSpecialIncoming(b,dToB);dToA=moguzoSpecialIncoming(a,dToA);
    dealDamage(b,dToB);dealDamage(a,dToA);gainFocus(a,dToA*BAL.FOCUS.gainDmgMul);gainFocus(b,dToB*BAL.FOCUS.gainDmgMul);
    gainUltStock(a);gainUltStock(b);
    for(const f of B.p){f.phase='hitstun';f.pf=0;f.stunDur=BAL.ROAR.stun;f.kb=30;f.atkLv=null;f.cmdBufMove=null;f.cmdBufIdx=null;}

  if(ar){roarResolve(a,b);if(B.flow!=='fight')return;}
  if(br){roarResolve(b,a);if(B.flow!=='fight')return;}

    // (旧: gainS(att,'aBlk')で被ガード時も咆哮側がS獲得していた)
    fxSpark(def,'mid',1);
    B.shake=Math.max(B.shake,8*shakeScale());B.hitstop=Math.max(B.hitstop,BAL.HITSTOP.roarGuard); // ROAR-R2(#98): 被ガード14F。armor-successより明確に弱い
    triggerRoarImpact('guard',def);
    if(def.guard<=0)doBreak(def);
  }else{ // ROAR-R2(#98): 「Grab/Roar/Ult penetrate armor」につき、旧「def.phase==='roar'かつdefの自armor窓中はx0.5減衰」分岐(BAL-R1)を撤去。
    // 相手のRoar自armorはStrike(Normal/Command)専用でRoar自体には常に無力=以下は常にclean resolution
    const armorSuccess=att.roarArmorAbsorbed>=1; // ROAR-R2(#98): このRoar(att側)がF11-F20で>=1 Strikeを吸収済みなら「armor-success着地」= hitstop24F+より強い演出
    def.hp-=R.d;gainFocus(def,R.d*BAL.FOCUS.gainDmgMul);
    def.phase='hitstun';def.pf=0;def.stunDur=R.stun;def.cmdBufMove=null;def.cmdBufIdx=null;
    def.atkLv=null;def.guardLv=null;def.buf=null;def.combo=0;def.normalChainCount=0;def.kb=34;
    resetModernHist(def); // vNext PR3 (§8 Modern R4 reset trigger: 被弾)
    // vNext PR2 (§12): Roar自身S gain0につきgainS(att,'aHit')を撤廃(defenderの'got'/gainUltStockは維持)
    gainS(def,'got');gainUltStock(att);
    fxDmg(def,R.d,'#ff8040');fxSpark(def,'mid',0,true); // 咆哮ヒット=大スパーク
    B.shake=Math.max(B.shake,(armorSuccess?20:14)*shakeScale());
    B.hitstop=Math.max(B.hitstop,armorSuccess?BAL.HITSTOP.roarArmor:BAL.HITSTOP.roar);
    sfx('roarImpactHeavy');if(armorSuccess)sfx('roarArmorBoom'); // ROAR-R2(#98): 既存'roar'(冒頭で再生済み)に重ねる追加の低音レイヤー
    triggerRoarImpact(armorSuccess?'armor':'clean',def);
  }
  if(def.hp<=0){def.hp=0;startKO(def.side);}
}
function grabStartup(f){return f.grabS;} // 発生F値はつかみ開始時点でスナップショット済み(密着中は12→10)
function grabStriking(f){return f.phase==='grab'&&f.pf===grabStartup(f)+1;}
function grabResolve(att,def){
  if(handleIfDowned(att,def,att.cmdMove?att.cmdMove.d:BAL.GRAB.d))return; // コマンド投げ(v0.10)はdmgをcmdMoveから取る
  if(def.phase==='grab'){startClash('grab');return;} // つかみ同士→ギュイーン
  const ok=throwEligible(def); // 回避はつかみを防げない(throwEligible()に単一口化。vNext PR3 Takimaru Modern Grabと共有)
  if(ok){ // つかみ成立（ガードくずし）
    att.phase='grabHit';att.pf=0;
    def.phase='grabbed';def.pf=0;def.atkLv=null;def.guardLv=null;def.buf=null;def.combo=0;def.normalChainCount=0;def.kb=0;

}
function doBreak(def){

  def.dizzyHits=0;def.dizzyDamage=0;def.postBreakActive=true; // BAL-R1新設: 追撃キャップ(最大breakMaxFollowupHits発/累計breakMaxDamage)の集計対象。
  // dizzyフェーズ自体は1発被弾すると即hitstunへ遷移してしまうため、postBreakActiveでhitstun/downへ

  announce('ガードブレイク!!',60,42,'#ff9500');sfx('break');

/* ================= 競り合い ================= */
function startClash(kind){
  B.flow='clash';B.flowF=0;
  for(const f of B.p){
    f.phase='clash';f.pf=0;f.atkLv=null;f.guardLv=null;f.buf=null;
    f.lunge=0;f.kb=0;f.combo=0;f.normalChainCount=0;
  }
  B.clash={phase:'in',f:0,mg:pickMinigame(),pick:[null,null],cpuAt:25+((rng()*45)|0), // cpuAtはオフライン時のみ使用
    kind:kind,winner:-2,
    rendaP:0,rendaC:0,p0hits:0,p1hits:0,p0target:null,p1target:null,cpuNextAt:0};
  if(DEBUG_NET&&onlineActive())console.log('[gyuiin]', {event:'start', slot:online.slot, mg:B.clash.mg, kind:kind, startTick:B.f, delayF:NET.delayF, simF:NET.simF});
  B.hitstop=0;
  sfx('guiin');
  announce(kind==='mikiri'?'見切った!!':(kind==='grab'?'つかみ合い!!':'競り合い!!'),46,44,'#ffe14d');
}
function pickMinigame(){ // BAL.MINIGAME.weightsに従って抽選
  const w=BAL.MINIGAME.weights;let acc=0,r=rng();
  for(const k of MINIGAME_ORDER){acc+=w[k];if(r<acc)return k;}
  return MINIGAME_ORDER[MINIGAME_ORDER.length-1];
}
function clashRouletteText(c){ // 突入26F中、高速切替→最後の6Fで確定表示
  const lockAt=BAL.CLASH.inF-6;
  if(c.f>=lockAt)return MINIGAME_NAME[c.mg];
  return MINIGAME_NAME[MINIGAME_ORDER[Math.floor(c.f/3)%MINIGAME_ORDER.length]];
}
function clashBtns(){return[ // 三角配置は現行のまま。中身をジャンケンに置き換え
  {c:'guu',x:W/2,y:PT+150,col:'#ffd23f',label:'グー'},
  {c:'choki',x:W-118,y:PT+352,col:'#ff5a5a',label:'チョキ'},
  {c:'paa',x:118,y:PT+352,col:'#5ab2ff',label:'パー'}];}
function clashHit(p){
  const bs=clashBtns();
  for(const b of bs)if(Math.hypot(p.x-b.x,p.y-b.y)<=96)return b.c;
  return null;
}
function clashStep(cmds0,cmds1){ // cmds0/cmds1: オンライン時のみ(ロックステップ入力バッファ経由のミニゲームコマンド)。オフラインはundefinedのまま無視される
  const c=B.clash;c.f++;
  if(c.phase==='in'){
    if(c.f>=BAL.CLASH.inF){
      c.phase='select';c.f=0;
      if(c.mg==='hayauchi'){
        c.p0target=randHayauchiTarget();
        if(onlineActive()){
          c.p1target=randHayauchiTarget(); // オンライン: 両者とも実タップで狙う的を個別に持つ(位置は共有rng生成で決定論)
        }else{
          const hf=BAL.AILV[curAiLv()].hayauchiF; // CPU-R2 PR5(#106 §10): Gyuiin専用Lv別テーブル
          c.cpuNextAt=hf[0]+((rng()*(hf[1]-hf[0]+1))|0);
        }
      }
    }
  }else if(c.phase==='select'){
    if(c.mg==='renda')stepRenda(c,cmds0,cmds1);
    else if(c.mg==='hayauchi')stepHayauchi(c,cmds0,cmds1);
    else stepJyanken(c,cmds0,cmds1);
  }else if(c.phase==='reveal'){
    if(c.f===BAL.CLASH.revealHitF){
      if(c.mg==='jyanken')resolveJyankenPicks(c);
      applyClashResult(c);
    }
    if(c.f>=BAL.CLASH.revealHitF+BAL.CLASH.revealF)endClash();
  }
}
function stepJyanken(c,cmds0,cmds1){
  if(onlineActive()){ // オンライン: 両者ともロックステップ入力バッファ経由の実タップ(mgPick)で決める
    if(c.pick[0]===null&&cmds0)for(const cm of cmds0)if(cm.t==='mgPick'){c.pick[0]=cm.choice;break;}
    if(c.pick[1]===null&&cmds1)for(const cm of cmds1)if(cm.t==='mgPick'){c.pick[1]=cm.choice;break;}
    if(c.f>=BAL.CLASH.sel){ // 〆切までに未選択ならランダム確定(両クライアントで同一)
      if(c.pick[0]===null)c.pick[0]=CHOICES[(rng()*3)|0];
      if(c.pick[1]===null)c.pick[1]=CHOICES[(rng()*3)|0];
    }
    if(c.pick[0]!==null&&c.pick[1]!==null){c.phase='reveal';c.f=0;}
    return;
  }
  if(c.pick[1]===null&&c.f>=c.cpuAt)c.pick[1]=CHOICES[(rng()*3)|0];
  if(c.f>=BAL.CLASH.sel){
    if(c.pick[0]===null)c.pick[0]=CHOICES[(rng()*3)|0];
    if(c.pick[1]===null)c.pick[1]=CHOICES[(rng()*3)|0];
  }
  if(c.pick[0]!==null&&c.pick[1]!==null){c.phase='reveal';c.f=0;}
}
function resolveJyankenPicks(c){ // 手の組み合わせ→勝者(あいこ=-1)を判定するだけ
  const x=c.pick[0],y=c.pick[1];
  c.winner=(x===y)?-1:(BEATS[x]===y?0:1);
}
function stepRenda(c,cmds0,cmds1){ // 120Fのタップ連打綱引き。オンラインは実タップ(ロックステップ入力)集計/オフラインはCPU自動加算(CPU Lv別)
  const R=BAL.MINIGAME.RENDA;
  if(onlineActive()){ // 両者とも同期された入力列から同一計算(タップ自体の演出はpressRoute側で即時反映済み)
    if(cmds0)for(const cm of cmds0)if(cm.t==='mgTap')c.rendaP+=R.tapGain;
    if(cmds1)for(const cm of cmds1)if(cm.t==='mgTap')c.rendaC+=R.tapGain;
  }else{
    const row=BAL.AILV[curAiLv()]; // CPU-R2 PR5(#106 §10): Gyuiin専用Lv別テーブル
    c.rendaC+=row.rendaCpuMin+rng()*row.rendaCpuRng;
  }
  if(c.f>=R.durationF){
    c.winner=(c.rendaP===c.rendaC)?-1:(c.rendaP>c.rendaC?0:1);
    c.phase='reveal';c.f=0;
  }
}
function randHayauchiTarget(){ // パッド内のランダム位置(端は避ける)
  return{x:70+rng()*(W-140),y:PT+110+rng()*(H-PT-160)};
}
function stepHayauchi(c,cmds0,cmds1){ // 的あて連続タップ。オンラインは実タップ(ロックステップ入力)判定/オフラインはCPU自動撃破(難易度別)
  const H2=BAL.MINIGAME.HAYAUCHI;
  if(onlineActive()){ // 「何Fに何個目を撃ったか」はmgHitコマンドの到着タイミング自体が表す。的の出現位置は共有rngで生成し両者一致
    if(cmds0)for(const cm of cmds0)if(cm.t==='mgHit'&&c.p0hits<H2.targets){c.p0hits++;c.p0target=(c.p0hits<H2.targets)?randHayauchiTarget():null;}
    if(cmds1)for(const cm of cmds1)if(cm.t==='mgHit'&&c.p1hits<H2.targets){c.p1hits++;c.p1target=(c.p1hits<H2.targets)?randHayauchiTarget():null;}
  }else{
    const hf=BAL.AILV[curAiLv()].hayauchiF; // CPU-R2 PR5(#106 §10): Gyuiin専用Lv別テーブル
    if(c.p1hits<H2.targets&&c.f>=c.cpuNextAt){
      c.p1hits++;
      c.cpuNextAt=c.f+hf[0]+((rng()*(hf[1]-hf[0]+1))|0);
    }
  }
  if(c.p0hits>=H2.targets||c.p1hits>=H2.targets||c.f>=H2.capF){
    c.winner=(c.p0hits===c.p1hits)?-1:(c.p0hits>c.p1hits?0:1);
    c.p0target=null;c.p1target=null;c.phase='reveal';c.f=0;
  }
}
function applyClashResult(c){ // 3ミニゲーム共通のリワード適用(旧resolveClashの後半を流用)

  announce(iWonClash?'せりかち!!':'まけた…',44,42,iWonClash?'#7CFC00':'#ff6b6b');

function endClash(){

    if(onlineActive()?(c.winner===online.slot):(c.winner===0))announce('追撃チャンス!!',40,30,'#7CFC00'); // 表示のみローカルプレイヤー視点(online.slot)へ変換(applyClashResultのiWonClashと同じ理由)
  }
  B.flow='fight';
  if(B.pendKO>=0){const s2=B.pendKO;B.pendKO=-1;startKO(s2);}

/* ================= 奥義 ================= */
function fireUlt(side){
  B.flow='ultCine';B.flowF=0;B.ultUser=side;
  const att=B.p[side];
  att.phase='ultAtk';att.pf=0;att.lunge=0;att.normalChainCount=0; // NORMAL-CHAIN-R1: 奥義へ移行した通常chainは打ち切る
  att.darkBodyActive=(att.c.id==='dark_moguzo'&&att.specialActiveF>0); // ABILITY-R2-C (Dark Moguzo BODY): Damage x1.08をaction開始時点でsnapshot
  resetModernHist(att); // vNext PR3 (§8 Modern R4 reset trigger: Ult)
  sfx('ult');
}
function ultStep(){
  B.flowF++;
  const att=B.p[B.ultUser],def=B.p[1-B.ultUser];
  if(B.flowF===BAL.ULT.impact){
    att.ult=0;
    if(inStanceCounterWindow(def))return; // vNext PR4 (Godan 巌の構え): counterActive窓中はUlt不可
    const guarded=def.phase==='guard'||(def.phase==='blockstun'&&def.held); // BAL-R1新設: 奥義にガード分岐を追加(旧は無条件でヒット扱い・被ガード不可だった)
    if(guarded){
      def.guard-=BAL.ULT.guardDamage;dealDamage(def,BAL.ULT.chipDamage); // vNext PR4: chipはGuts対象外
      gainFocus(def,BAL.ULT.chipDamage*BAL.FOCUS.gainDmgMul+BAL.FOCUS.gainGuard);
      def.guardRegenCooldownF=BAL.GUARD.regenDelayF;
      def.phase='blockstun';def.pf=0;def.stunDur=16;def.kb=20;
      fxSpark(def,'mid',1);sfx('guard');B.shake=Math.max(B.shake,10);
      if(def.guard<=0)doBreak(def);
      if(def.hp<=0){def.hp=0;B.pendKO=def.side;}
    }else{
      const dmg=Math.round(BAL.ULT.d*att.c.dMul);
      def.hp-=dmg;gainFocus(def,dmg*BAL.FOCUS.gainDmgMul);
      def.phase='down';def.pf=0;def.downType=BAL.ULT.downType;def.downHitUsed=false;def.kb=46;def.cmdBufMove=null;def.cmdBufIdx=null; // BAL-R1: hitstun固定→ultimateDown化
      def.atkLv=null;def.guardLv=null;def.buf=null;def.combo=0;def.normalChainCount=0;
      resetModernHist(def); // vNext PR3 (§8 Modern R4 reset trigger: 被弾)
      fxDmg(def,dmg,'#ff2d78');fxBurst(def.baseX,330);
      sfx('ultHit');B.shake=18;
      if(def.hp<=0){def.hp=0;B.pendKO=def.side;}
    }
  }
  if(B.flowF>=BAL.ULT.total){
    att.phase='idle';att.pf=0;B.flow='fight';
    if(B.pendKO>=0){const s2=B.pendKO;B.pendKO=-1;startKO(s2);}
  }
}

/* ================= KO / タイムアップ ================= */
function startKO(side){
  B.flow='ko';B.flowF=0;B.koSide=side;B.clash=null;B.pendKO=-1;
  B.p[side].phase='ko';B.p[side].pf=0;
  B.p[1-side].phase='win';B.p[1-side].pf=0;
  announce('K.O.',96,84,'#ff3b30');sfx('ko');B.shake=14;
}
function finishRound(){
  const w=1-B.koSide;B.wins[w]++;
  if(B.wins[w]>=BAL.WINS){B.flow='matchEnd';B.flowF=0;B.result=(w===0)?'WIN':'LOSE';}
  else{B.flow='roundEnd';B.flowF=0;}
}
function timeUp(){
  announce('TIME UP',70,48,'#ffffff');sfx('ko');
  const a=B.p[0].hp,b=B.p[1].hp;
  if(a===b){
    B.wins[0]++;B.wins[1]++;
    if(B.wins[0]>=BAL.WINS&&B.wins[1]>=BAL.WINS){B.flow='matchEnd';B.flowF=0;B.result='DRAW';return;}
    if(B.wins[0]>=BAL.WINS){B.flow='matchEnd';B.flowF=0;B.result='WIN';return;}
    if(B.wins[1]>=BAL.WINS){B.flow='matchEnd';B.flowF=0;B.result='LOSE';return;}
    B.flow='roundEnd';B.flowF=0;return;
  }
  const w=(a>b)?0:1;
  B.wins[w]++;
  B.p[w].phase='win';B.p[w].pf=0;
  B.p[1-w].phase='ko';B.p[1-w].pf=0;
  if(B.wins[w]>=BAL.WINS){B.flow='matchEnd';B.flowF=0;B.result=(w===0)?'WIN':'LOSE';}
  else{B.flow='roundEnd';B.flowF=0;}
}

/* ================= OPTIONS(#111 MENU-R1の最小限scaffold) ================= */
// ROAR-R2(#98)がscreen shake/flashの強度を要求するため、実際のOPTIONS画面(#111。BGM/SE/vibration/
// default Modern-Classic/reset settings等を含む完全な形)より先行して、このPRで必要な2項目だけを
// 最小限の値付きオブジェクトとして用意する。#111はこのOPTIONSオブジェクトへUIを結線するだけでよい
// (=truth tableの重複を作らない)。shake/flashはpresentation-onlyであり、B.hitstop/simulation timingは
// 常に一定でこれらの値に影響されない(disable/reduceしてもgameplay/hashは変化しない)
let OPTIONS={shake:'normal',flash:'normal',vibration:'on',controlScheme:'modern'}; // MENU-R1(#111): shake: 'strong'|'normal'|'off'。flash: 'normal'|'reduced'。
// vibration: 'on'|'off'(presentation-only)。controlScheme: 'modern'|'classic'(既定のコマンド解決方式。オンライン中はcurControlScheme()が常に'modern'を返し決定性を維持する)
function shakeScale(){return OPTIONS.shake==='off'?0:(OPTIONS.shake==='strong'?1.35:1);}
function flashScale(){return OPTIONS.flash==='reduced'?0.4:1;}
function curControlScheme(){return onlineActive()?'modern':OPTIONS.controlScheme;} // curAiLv()と同じ理由(§12): オンライン中は両クライアントのsimulation分岐を一致させるため常時'modern'固定
function vibrate(ms){if(OPTIONS.vibration==='on'&&typeof navigator!=='undefined'&&navigator.vibrate)navigator.vibrate(ms);} // presentation-only。未対応環境はnavigator.vibrate自体が無くno-op
function resetOptions(){OPTIONS.shake='normal';OPTIONS.flash='normal';OPTIONS.vibration='on';OPTIONS.controlScheme='modern';BGM_VOLUME=0.35;SE_VOLUME=1.0;if(bgmGainNode)bgmGainNode.gain.value=BGM_VOLUME;}
/* ================= CPU AI ================= */
const cpuEv=[];
let cpuLv=3; // CPU-R2 PR5(#106 §2/§12): 旧aiDifficulty(EASY/NORMAL/HARD)を廃し、数値CPU Lv1-9を直接の session state とする。
// デフォルト3=旧NORMALのデフォルトと同値(互換)。キャラ選択画面で変更・セッション中保持(明示的にリセットしない)
function curAiLv(){return onlineActive()?3:cpuLv;} // オンライン中はローカルのcpuLv設定に関わらずLv3固定(両クライアントのrng消費を一致させ決定性を維持)
function curAilvRow(){return BAL.AILV[curAiLv()];}
const LEVEL_TO_DODGE={high:'crouch',mid:'sway',low:'lunge'}; // その段を避ける回避(DODGE_TABLE.beatsの逆引き)
const DIR_TO_DODGE_KIND={left:'sway',down:'crouch',right:'lunge'}; // BAL.CMD.seqの方向文字列→dodgeコマンドのkind(DODGE_DIRの逆引き、v0.10 (3))
const ai={think:0,guardT:0,guardOn:false,react:null,ultT:0,hist:[],mash:0,pHoldF:0,mikiriAt:null,dodgeAt:null,dodgeKind:null,cmdQueue:[],
  habitHist:[],oppGuardStartF:null,oppBlockEndF:null, // CPU-R2 PR3(#106 §8): habitHistは直近の相手の意味ある行動(atkLv/dodge/guardHold/grab/mashAfterBlock)を最大16件保持
  pisukeChaseRolledFor:null,darkChainRolledFor:null}; // CPU-R2 PR4(#106 §9): 窓(chaseReadyUntilF/darkWindowUntilF)ごとに1回だけ判定するための既判定マーカー(Codexレビュー対応、PR#119)
function aiReset(){
  ai.think=30;ai.guardT=0;ai.guardOn=false;ai.react=null;ai.ultT=0;
  ai.hist=[];ai.mash=0;ai.pHoldF=0;ai.mikiriAt=null;ai.dodgeAt=null;ai.dodgeKind=null;ai.cmdQueue=[];
  ai.habitHist=[];ai.oppGuardStartF=null;ai.oppBlockEndF=null;
  ai.pisukeChaseRolledFor=null;ai.darkChainRolledFor=null;
}
function aiPushHabit(t,v){ai.habitHist.push({t:t,v:v,f:B.f});if(ai.habitHist.length>16)ai.habitHist.shift();} // CPU-R2 PR3(#106 §8): 直近12-16件の指示に沿い16件キャップ
function habitFreq(t,pred){ // CPU-R2 PR3(#106 §8): habitHist内でtype===tのエントリのうちpred(v)を満たす割合(0-1)。
  // データが無ければ0(=中立、shiftしない)。「type=tの中でどのサブ種別が多いか」の判定に使う
  // (例: dodgeエントリの中でlunge/sway/crouchどれが多いか)。predが常にtrueだと「type=t内の割合」が自明に1になり、
  // 「そもそもtype=tをどれだけ行っているか」の指標にはならない(Codexレビュー対応、PR#119)。その用途にはhabitOccurRate()を使う
  const entries=ai.habitHist.filter(function(h){return h.t===t;});
  if(!entries.length)return 0;
  return entries.filter(function(h){return pred(h.v);}).length/entries.length;
}
function habitOccurRate(t){ // CPU-R2 PR4(#106 §9) Codexレビュー対応(PR#119): 「type=tがhabitHist全体に対してどれだけの
  // 頻度で記録されているか」(dodge-heavy/frequent Guard等、行動そのものの頻度を測る指標。habitFreq()と違い
  // 全体を分母にする)。データが無ければ0
  if(!ai.habitHist.length)return 0;
  return ai.habitHist.filter(function(h){return h.t===t;}).length/ai.habitHist.length;
}
function aiCmdMoveWeight(me,mv){ // CPU-R2 PR4(#106 §9): キャラ別アーキタイプに応じたコマンド技選択の重み(既定1.0=無変更)。
  // 違法選択は生成しない(発生不可な技はhasResourceFor側で最終的に弾かれるため、ここでのweight=0は選好上の無駄を避けるだけの最適化)
  let w=1;
  // Hakuma/Defense: 「Iron Wall/Reflect integration」。ironWallReadyがある時はironWallAlt持ちの技を優先して起動・消費する
  if(me.c.id==='hakuma'&&me.ironWallReady&&mv.ironWallAlt)w*=3;
  // Chirka/Trick: 「FEINT/DELAY/POISON choice should respond to observed defense habits」。frequent Guard->POISON
  // (削りが効く)/frequent Dodge->DELAY(タイミング外しが効く)をai.habitHist由来の頻度で優先
  if(me.c.id==='chirka'){
    if(mv.poison)w*=1+habitOccurRate('guardHold')*2; // Codexレビュー対応(PR#119): habitHist全体に対するGuard頻度で判定
    if(mv.delay)w*=1+habitOccurRate('dodge')*2; // Codexレビュー対応(PR#119): habitHist全体に対するDodge頻度で判定
  }
  // Bullet/Charge: 「high levels...avoid accidental OVERHEAT」。現在charge不足で発生し得ない技は選好から外す
  if(me.c.id==='bullet'&&mv.cost&&mv.cost.res==='charge'&&me.charge<mv.cost.amt)w=0;
  return w;
}
function aiQueueCommandMove(me){ // コマンド技(v0.10 (3)): 方向2つ+トリガーを予約し、人間の連続タップと同じ入力経路(cpuEv)で発火させる
  // 1つ目の方向入力は実際の回避(BAL.DODGE.totalF=22F)を伴うため、idleに復帰する直後(dir1から23F後、
  // 24Fバッファに収まる最終タイミング)でトリガーを送る。2つ目の方向は回避演技中でもdirBufには積まれる。
  const moves=commandMovesFor(me.c);
  if(!moves||!moves.length)return;
  // CPU-R2 PR4(#106 §9): 旧来の完全均等ランダム選択を、キャラ別アーキタイプ重み付き抽選へ変更
  const weights=moves.map(function(mv){return aiCmdMoveWeight(me,mv);});
  const wSum=weights.reduce(function(a,b){return a+b;},0);
  let idx=(rng()*moves.length)|0;
  if(wSum>0){
    let r=rng()*wSum,acc=0;
    for(let i=0;i<weights.length;i++){acc+=weights[i];if(r<acc){idx=i;break;}}
  }
  const mv=moves[idx],dir1At=B.f+1;
  ai.cmdQueue.push({at:dir1At,cmd:{t:'dodge',kind:DIR_TO_DODGE_KIND[mv.seq[0]]}});
  ai.cmdQueue.push({at:dir1At+1,cmd:{t:'dodge',kind:DIR_TO_DODGE_KIND[mv.seq[1]]}});
  ai.cmdQueue.push({at:dir1At+BAL.DODGE.totalF+1,cmd:(mv.type==='grab')?{t:'grab'}:{t:'atk',lv:mv.trigger}});
}
function specialAiThreshold(me,you){ // ABILITY-R2-C (Issue #97 §13 CPU): キャラ別初期バイアス。canStartSpecial()呼び出し側が既に
  // CONDITION LOCK(Bullet Charge0/Dark HP>30%)をgate済みのため、このboost値は「使える状況の中でどれだけ優先するか」のみを表す。
  // プレイヤーの現在入力は一切参照しない(既存ai.think cadenceのみ使用)。数値は初期sane値であり最終チューニング対象外(§18)
  const base=0.015;
  switch(me.c.id){
    // CPU-R2 PR4(#106 §9 Moguzo/Standard): 「strongest bias when GUTS active」に対応(GUTS=HP<=30%でdealDamage側が
    // 自動セットする既存gutsActiveフラグ。HP<=60%の従来biasはそのまま残し、GUTS成立時はさらに強く優先する)
    case 'moguzo':return me.gutsActive?base*5:(me.hp<=maxHpFor(me.c)*0.60?base*3:base);
    case 'pisuke':return me.chaseActive?base:base*2; // neutral before offense: CHASEループ開始前を優先(解釈判断)
    // CPU-R2 PR4(#106 §9 Godan/Power): armorStock(コマンド技armorの原資)が尽きている時ほど、無制限armorの
    // Hyper Armor SPECIALを代替手段として優先する(既存のyou攻撃中バイアスに追加で乗算)
    case 'godan':return((you.phase==='attack'||you.phase==='cmdAtk')?base*3:base)*(me.armorStock<=1?1.5:1);
    // CPU-R2 PR4(#106 §9 Hakuma/Defense): 「Iron Wall/Reflect integration」。Reflect(SPECIAL中のガード反射)は
    // ガード姿勢でなければ意味が無いため、現在ガード中/ガード予定(ai.guardOn)の時に優先度を上げる
    case 'hakuma':return base*1.5*((me.phase==='guard'||ai.guardOn)?2:1);
    case 'chirka':return base*2; // treat special as an attack candidate: 通常attack候補相当の頻度まで上げる
    // CPU-R2 PR4(#106 §9 Takimaru/Grappler): 「BIND Special vs Dodge-heavy opponents」。ai.habitHist(#106 §8、
    // 既に成立した相手の行動の履歴のみ)由来のdodge頻度が高いほど優先度を上げる
    case 'takimaru':return(me.pressureState==='ready'?base*4:base*1.5)*(1+habitOccurRate('dodge')); // Codexレビュー対応(PR#119): habitHist全体に対するDodge頻度で判定
    // CPU-R2 PR4(#106 §9 Yomikage/Counter): 「Auto Counter Special used predictively」。ai.mash(ai.hist=既に観測した
    // 過去の相手の攻撃頻度由来。現在/未来の入力は一切見ない、§1準拠)が高いほど予測的にSPECIALを構える優先度を上げる
    case 'yomikage':return base*(1+Math.min(1,ai.mash/4)*3);
    case 'bullet':return me.overheat?base*6:(me.charge>=2?base*3:base); // C2/C3 release choice + OVERHEAT high priority
    case 'dark_moguzo':return base*8; // HP<=30% high priority(canStartSpecial側のCONDITION LOCKで既にHP<=30%の時のみ到達)
    default:return base;
  }
}
function specialUseThreshold(me,you){ // CPU-R2 PR3(#106 §7 SPECIAL): 「Lower levels may mistime/waste Specials.
  // Higher levels should preserve them for relevant conditions」。既存のキャラ別条件付きthreshold(specialAiThreshold、
  // 「良い」条件下の値)と条件無視のflatベース(=0.015。汎用の初期sane値)をresourceQualityで線形補間する。
  // Lv1(quality低)ほどflatに近づく=条件を無視しがちで浪費/ミスタイミング。Lv9はconditionedそのもの=好条件を厳密に待つ
  const conditioned=specialAiThreshold(me,you),generic=0.015,q=curAilvRow().resourceQuality;
  return generic+(conditioned-generic)*q;
}
// CPU-R2 PR4(#106 §9): 中立思考(aggr/grabW/gsel)・コマンド技使用率・punishUse・見切り選好への
// キャラ別アーキタイプ乗算バイアス(既定1.0=無変更)。違法アクション/ステータス付与は一切行わない(既存の合法な
// 汎用ノブへの僅かな重み付けのみ)。mikiriShareは反応行動でのMikiri対Dodge分岐(既定0.5)への乗数
const ARCHETYPE_BIAS={
  pisuke:{gsel:0.6}, // Rush: 「lower passive Guard weight」
  godan:{cmdMoveRate:1.6,mikiriShare:1.4}, // Power: 「more...Command usage」+「lower frivolous Dodge frequency」
  hakuma:{gsel:1.4,punishUse:1.2}, // Defense: 「higher Guard weight」+「punish-oriented offense」
  yomikage:{aggr:0.6,gsel:1.3} // Counter: 「lower raw offense, higher wait/counter」
};
function archetypeMul(id,key){const b=ARCHETYPE_BIAS[id];return(b&&b[key]!=null)?b[key]:1;}
function cpuFindGuaranteedPunish(me,you,delayF){ // CPU-R2 PR2(#106 §5): 相手の攻撃action残り(startup+active+recovery-pf)にCPU側Normalの
  // startupが収まるかを判定する。you.phase/pf/atkLv(=既に開始済みの現在action)のみを参照し、未来の入力は一切見ない(§1準拠)
  // delayF: 判定時点からCPU側の技が実際にstartupを開始できるまでの遅延(既定0。被ガード確反はme自身の残りblockstunを渡す)
  // Codexレビュー対応(PR#117): (1)stunRemaining()を使い空振り追加recovery(whiffExtraFor)を含めて判定
  // (2)striking()はpf>A.sで成立するため、命中には発生+1F要る(s+1<=remainFで判定。s===remainFは実際は間に合わない)
  // (3)呼び出し側の実行遅延(delayF)も加算しないと、その間に相手がidleへ復帰し得る
  if(!(you.phase==='attack'||you.phase==='cmdAtk'))return null;
  const remainF=stunRemaining(you);
  if(remainF==null||remainF<=0)return null;
  const d=delayF||0;
  const candidates=LEVELS.filter(function(lv){return specForLv(me,lv).s+1+d<=remainF;}); // 発生+1F(striking成立)+delayFが相手のidle復帰前に収まる技のみ(違法選択なし)
  if(!candidates.length)return null;
  candidates.sort(function(a,b){return specForLv(me,b).d-specForLv(me,a).d;}); // 最大ダメージの技を優先
  return{lv:candidates[0],remainF:remainF};
}
function aiStep(){
  const me=B.p[1],you=B.p[0];
  const row=curAilvRow(); // CPU-R2 PR5(#106 §12): 旧D=curDiff()(EASY/NORMAL/HARD)を廃し、Lv別rowを直接使う
  // CPU-R2 PR3(#106 §7 ULT): 「stock満タン後、待って生打ち」を廃し、相手の脆弱window(hitstun/dizzy/
  // whiff-recovery帯=もう反撃されない安全な確定チャンス)を優先する。resourceQuality低=すぐ諦めて生打ち(Lv1-3相当)、
  // 高=脆弱windowを長く待てる(Lv8-9は"rarely raw unless...reasonable"に対応し、待機上限が長くなる)
  if(me.ult>=BAL.ULT.stock){
    ai.guardOn=false;ai.ultT++;
    if(actionable(me)){
      const row=curAilvRow();
      const yA=(you.phase==='attack'||you.phase==='cmdAtk')?spec(you):null;
      const vulnerable=you.phase==='hitstun'||you.phase==='dizzy'||(yA!=null&&you.pf>=yA.s+yA.a);
      const patienceF=10+Math.round(row.resourceQuality*100);
      if(vulnerable||ai.ultT>=patienceF)cpuEv.push({t:'ult'});
    }
    return;
  }
  ai.ultT=0; // Codexレビュー対応(PR#118): stockが満タンでない間は待機タイマーをリセットする。
  // 消費後(ultStep()がme.ultをクリア)にリセットしないと、Roar等で再度満タンになった際、既にpatienceF超過で即生打ちになってしまう
  // habitHist(#106 §8)の掃除: 古いoppBlockEndFは長時間経過したら破棄(無関係な後発攻撃をmashAfterBlockと誤検知しない)
  if(ai.oppBlockEndF!=null&&B.f-ai.oppBlockEndF>8)ai.oppBlockEndF=null;
  if(you.phase==='blockstun'&&you.pf>=you.stunDur-1)ai.oppBlockEndF=B.f+1;
  // ガード継続時間の観測(#106 §8): frequent/long Guardの検出に使う
  if(you.phase==='guard'){if(ai.oppGuardStartF==null)ai.oppGuardStartF=B.f;}
  else if(ai.oppGuardStartF!=null){aiPushHabit('guardHold',B.f-ai.oppGuardStartF);ai.oppGuardStartF=null;}
  // 観測: プレイヤーの攻撃を記録し、反応(防御)をスケジュールする。CPU-R2 PR2(#106 §4):
  // reaction delayはCPU Lv依存(row.reactDelayMinF-MaxF)。実際の防御選択(既定Guard/advDefShareでDodge・Mikiri)
  // はai.react消費時点(下記)でLv依存に決める。旧来のここでの即時差し込み(cw)判定は撤去(§4の公式アルゴリズムに
  // Guard/Dodge/Mikiriの3択のみが定義されているため。挙動再設計はIssue #106の意図的な仕様変更)
  if(you.phase==='attack'&&you.pf===1){
    ai.hist.push({lv:you.atkLv,f:B.f});
    if(ai.hist.length>14)ai.hist.shift();
    aiPushHabit('atkLv',you.atkLv); // #106 §8
    if(ai.oppBlockEndF!=null){if(B.f-ai.oppBlockEndF<=8)aiPushHabit('mashAfterBlock',true);ai.oppBlockEndF=null;} // #106 §8
    const row=curAilvRow();
    ai.react={at:B.f+row.reactDelayMinF+((rng()*(row.reactDelayMaxF-row.reactDelayMinF+1))|0),lv:you.atkLv,seenAt:B.f,atkStartupF:spec(you).s};
  }
  // 回避種別の観測(#106 §8): frequent CROUCH/SWAY/LUNGEの検出に使う(相手が実際にDodgeを開始した瞬間)
  if(you.phase==='dodge'&&you.pf===1)aiPushHabit('dodge',you.dodgeType);
  if(ai.mikiriAt!=null&&B.f>=ai.mikiriAt){cpuEv.push({t:'mikiri'});ai.mikiriAt=null;}
  if(ai.dodgeAt!=null&&B.f>=ai.dodgeAt){cpuEv.push({t:'dodge',kind:ai.dodgeKind});ai.dodgeAt=null;}
  while(ai.cmdQueue.length&&B.f>=ai.cmdQueue[0].at)cpuEv.push(ai.cmdQueue.shift().cmd); // 予約済みコマンド技入力の発火(v0.10 (3))
  // ダウン連追撃: CPU Lv別のdownFollowupで1発叩き込む(Lv1-2=しない/Lv3-4=たまに/Lv5+=常に)
  if(you.phase==='down'&&!you.downHitUsed&&me.phase==='idle'&&rng()<row.downFollowup){
    cpuEv.push({t:'atk',lv:'mid'});
  }
  // つかみ試行の観測(#106 §8): repeated Grab attemptsの検出に使う(現時点では収集のみ。消費はPR4の
  // キャラ別アーキタイプ層で検討する。生の入力は見ず、既に開始済みのyou.phase==='grab'のみ観測=§1準拠)
  if(you.phase==='grab'&&you.pf===1)aiPushHabit('grab',null);
  // つかみ返し: 相手のつかみを見たらつかみ合いへ
  if(you.phase==='grab'&&you.pf===1&&me.phase==='guard'&&rng()<0.3){
    ai.guardOn=false;ai.guardT=0;cpuEv.push({t:'grab'});
  }
  ai.mash=0;
  for(const h of ai.hist)if(B.f-h.f<100)ai.mash++;
  ai.pHoldF=(you.phase==='guard')?ai.pHoldF+1:0;
  // 被ガード確反。CPU-R2 PR2(#106 §5): punishUseロールに成功した場合のみcpuFindGuaranteedPunish()で
  // 発生Fが間に合う技を選ぶ(見つからない/ロール失敗時は旧来の汎用報復=mid70%/ランダム30%へフォールバック)
  if(me.phase==='blockstun'&&me.pf===Math.max(1,me.stunDur-4)&&rng()<0.9){
    ai.guardOn=false;ai.guardT=0;
    const row=curAilvRow();
    // Codexレビュー対応(PR#117): この時点でme(自分)はまだblockstun残りがあり、この技はtryBuf()で
    // 先行入力として保持され実際の発生はme自身のblockstun終了後になる。その遅延(me.stunDur-me.pf)を
    // delayFとして渡さないと、実際に発生する頃には相手の残り復帰F(remainF)を超えて「保証されない」選択になる
    const gp=rng()<row.punishUse*archetypeMul(me.c.id,'punishUse')?cpuFindGuaranteedPunish(me,you,me.stunDur-me.pf):null; // #106 §9 Hakuma: punish-oriented offense
    cpuEv.push(gp?{t:'atk',lv:gp.lv}:{t:'atk',lv:rng()<0.7?'mid':LEVELS[(rng()*3)|0]});
  }
  // ガードブレイク追撃（打撃 or 投げ）: dizzyは既に確定ヒット状態のためguaranteed punish計算は不要
  if(you.phase==='dizzy'&&me.phase==='idle'&&you.pf<BAL.GUARD.breakStunF-30){
    cpuEv.push(rng()<0.35?{t:'grab'}:{t:'atk',lv:'mid'});
  }
  // 咆哮escape-use(#106 §7 ROAR): 「prefer Roar when pressured, in hit/block stun」。hitstun中のコンボ被弾または
  // blockstun中(固められている)を「legitimate pressure condition」として扱い、Lv別のroarEscapeUse確率表を適用。
  // ROAR-R2(#98)のvulnerable startup/armor timingは通常のRoar発動経路と同一のため自動的に respect される
  if(me.s>=BAL.SMAX&&((me.phase==='hitstun'&&you.combo>=2)||me.phase==='blockstun')&&rng()<curAilvRow().roarEscapeUse)cpuEv.push({t:'roar'});
  // 汎用punish機会(#106 §5): 相手が攻撃のrecovery帯(startup+active終了後=もう当たらない安全な状態)にいて
  // me.phase==='idle'の時、punishUseに応じてcpuFindGuaranteedPunish()を毎F低確率で試みる(recovery帯が長いほど、
  // また高Lvほど捕捉しやすい。低LvはpunishUseが低くほぼ発火しない)。ブロック直後(上記)以外の全punish機会をここで拾う
  if(me.phase==='idle'&&(you.phase==='attack'||you.phase==='cmdAtk')){
    const yA=spec(you);
    if(you.pf>=yA.s+yA.a){
      const row=curAilvRow();
      if(rng()<row.punishUse*archetypeMul(me.c.id,'punishUse')*0.25){ // #106 §9 Hakuma: punish-oriented offense
        const gp=cpuFindGuaranteedPunish(me,you);
        if(gp)cpuEv.push({t:'atk',lv:gp.lv});
      }
    }
  }
  // 反応行動(#106 §4): reactRateで意図的な防御を試みるか判定→既定はGuard、advDefShareで正解Dodge/Mikiriへ切替。
  // ロール失敗時(reactRate)は「反応できず」何もしない(低Lvで頻発する想定通り)
  if(ai.react&&B.f>=ai.react.at){
    const r=ai.react,row=curAilvRow();ai.react=null;
    if(me.phase==='idle'&&rng()<row.reactRate){
      if(rng()<row.advDefShare){
        const jitter=Math.round((rng()*2-1)*row.jitterF),contact=r.seenAt+r.atkStartupF;
        if(rng()<0.5*archetypeMul(me.c.id,'mikiriShare')&&ai.mikiriAt==null){ // #106 §9 Godan: lower frivolous Dodge frequency(Mikiri優先度を上げる分だけDodgeが減る)
          const win=(me.hp<=BAL.PINCH_HP)?BAL.MIKIRI.windowPinch:BAL.MIKIRI.window;
          ai.mikiriAt=contact+jitter+Math.round((rng()*2-1)*win);
        }else if(ai.dodgeAt==null){
          ai.dodgeAt=contact-5+jitter;ai.dodgeKind=LEVEL_TO_DODGE[r.lv];
        }
      }else{
        ai.guardOn=true;ai.guardT=24+((rng()*20)|0);
      }
    }
  }
  if(ai.guardT>0){ai.guardT--;if(ai.guardT<=0)ai.guardOn=false;}
  // ガードから崩し返し（たまに投げに切替）
  if(me.phase==='guard'&&rng()<0.006){ai.guardOn=false;ai.guardT=0;cpuEv.push({t:'grab'});}
  // チェーン継続。NORMAL-CHAIN-R1: 判定をキャラ別normalChainLimitへ追従させる。
  // vNext PR2 (§4): H/M/L自由順+同Normal連続可へ追従(chainableTo()が実際のcanChain()と同じ判定)
  // CPU-R2 PR2(#106 §6): 継続確率を旧固定0.75からcomboContinue(Lv依存)へ変更
  if(me.phase==='attack'&&me.hasHit&&me.normalChainCount<normalChainLimitFor(me.c)&&me.atkLv){
    const A=spec(me);
    if(me.pf===A.s+A.a+2&&rng()<curAilvRow().comboContinue){
      const nxt=LEVELS.filter(function(l){return chainableTo(l,me.atkLv);});
      if(nxt.length)cpuEv.push({t:'atk',lv:nxt[(rng()*nxt.length)|0]});
    }
  }
  // CPU-R2 PR4(#106 §9 Pisuke/Rush): 「higher offense/CHASE continuation」。既存の合法トリガー入力
  // (chaseReadyUntilF窓中、me.phase==='attack'時のsway/lunge Dodge入力)をcmdUse(Lv依存)で撃つ。
  // Codexレビュー対応(PR#119): この窓は複数F開き続けるため毎F判定するとcmdUseが「機会あたりの確率」ではなくなり
  // (12F窓ならcmdUse=0.20でも累積約93%まで跳ね上がる)、Lv別の意味が実質消える。窓ごとに1回だけ判定するよう、
  // 同じchaseReadyUntilFの値に対しては既に判定済みならスキップする(ai.pisukeChaseRolledForで記憶)
  if(me.c.id==='pisuke'&&me.phase==='attack'&&me.chaseReadyUntilF>0&&B.f<=me.chaseReadyUntilF&&ai.pisukeChaseRolledFor!==me.chaseReadyUntilF){
    ai.pisukeChaseRolledFor=me.chaseReadyUntilF;
    if(rng()<curAilvRow().cmdUse)cpuEv.push({t:'dodge',kind:rng()<0.5?'sway':'lunge'});
  }
  // CPU-R2 PR4(#106 §9 Dark Moguzo/Dark Chain): 「maximize legal Dark Chain routes」。既存の合法トリガー入力
  // (darkWindowUntilF窓中、me.phase==='cmdAtk'時のNormal atk入力)をcmdUse(Lv依存)で撃ち、Dark Chainを繋ぐ。
  // Codexレビュー対応(PR#119): 上記Pisukeと同じ理由で、同じdarkWindowUntilFの値に対しては窓ごとに1回だけ判定する
  if(me.c.id==='dark_moguzo'&&me.phase==='cmdAtk'&&me.darkWindowUntilF>0&&B.f<=me.darkWindowUntilF&&ai.darkChainRolledFor!==me.darkWindowUntilF){
    ai.darkChainRolledFor=me.darkWindowUntilF;
    if(rng()<curAilvRow().cmdUse)cpuEv.push({t:'atk',lv:LEVELS[(rng()*3)|0]});
  }
  // ガード硬め対策: つかみ本命 / S咆哮
  if(ai.pHoldF>30&&me.phase==='idle'){
    if(rng()<0.5){cpuEv.push({t:'grab'});ai.pHoldF=0;}
    else if(me.s>=BAL.SMAX&&rng()<0.5){cpuEv.push({t:'roar'});ai.pHoldF=0;}
  }
  // 通常思考
  if(me.phase==='idle'&&!ai.guardOn){
    ai.think--;
    if(ai.think<=0){
      ai.think=14+((rng()*12)|0);
      const roll=rng();
      // vNext PR2 (§10 Focus): 「外す: CPU logic」につきfocusThreat分岐(旧: 相手の集中が満タン→攻めを控える)を撤廃。
      // CPU判断はfocus/BAL.FOCUSを一切参照しない
      // #106 §9: CPU Lv別の攻撃頻度(atkFreqMul)にキャラ別アーキタイプ乗算バイアスを乗せる(Yomikage=lower raw offense)
      const aggr=Math.max(0.1,0.36-ai.mash*0.03)*row.atkFreqMul*archetypeMul(me.c.id,'aggr');
      // habit adaptation(#106 §8): 直近のhabitHistに応じて重みを僅かにシフトする。row.habitAdaptが
      // 最大シフト量(Lv1-3は0%=無効)。「frequent Guard→Grab/Guard-break pressure重み上げ」の例に対応
      const guardHoldFreq=habitOccurRate('guardHold'); // Codexレビュー対応(PR#119): 「20F以上の長押しの割合」ではなく
      // habitHist全体に対するGuard頻度そのもの(=frequent Guard)で判定する。PR3で導入した同種の測定ミスも本PRで併せて修正
      // #106 §9 Takimaru/Grappler: 「higher Grab weight under Pressure」。pressureState==='ready'時は追加でつかみ重みを上げる
      const grabW=0.1*(1+guardHoldFreq*row.habitAdapt*3)*(me.c.id==='takimaru'&&me.pressureState==='ready'?2.5:1); // つかみの基礎重み(旧focusThreat加算は撤廃)+habit shift
      // #106 §9: Hakuma=higher Guard weight/Pisuke=lower passive Guard weight/Yomikage=higher wait&counter
      const gsel=(0.24+Math.min(0.3,ai.mash*0.04))*archetypeMul(me.c.id,'gsel');
      if(roll<aggr){
        // #106 §9 Godan/Power: more Command usage(cmdUseへの乗算バイアス)。cmdUseは§3の定義上
        // 「offensive intentがCommand routeを使う確率」そのものなので、旧cmdMoveRate専用列は持たず直接読む
        if(ai.cmdQueue.length===0&&rng()<row.cmdUse*archetypeMul(me.c.id,'cmdMoveRate')){
          aiQueueCommandMove(me);
        }else{
          // habit adaptation(#106 §8): 「frequent SWAY→MID重み上げ/frequent CROUCH→LOW重み上げ/frequent LUNGE→
          // HIGH重み上げ」の例に対応。相手のDodge種別履歴(habitHist 'dodge')から各段の重みを僅かにシフトする
          const shift=row.habitAdapt;
          const wH=0.34+habitFreq('dodge',function(v){return v==='lunge';})*shift;
          const wM=0.38+habitFreq('dodge',function(v){return v==='sway';})*shift;
          const wL=0.28+habitFreq('dodge',function(v){return v==='crouch';})*shift;
          const wSum=wH+wM+wL,rw=rng();
          cpuEv.push({t:'atk',lv:rw<wH/wSum?'high':(rw<(wH+wM)/wSum?'mid':'low')});
        }
      }else if(roll<aggr+grabW){
        cpuEv.push({t:'grab'});
      }else if(roll<aggr+grabW+gsel){
        ai.guardOn=true;ai.guardT=24+((rng()*24)|0);
      }
      // 咆哮neutral-waste(#106 §7 ROAR): 「neutral-waste probability should decrease as level rises」。
      // resourceQualityが高いほど(高Lv)この無条件消費を控える
      if(me.s>=BAL.SMAX&&rng()<0.3*(1-row.resourceQuality))cpuEv.push({t:'roar'});
      // ABILITY-R2-C (Issue #97 §13): 汎用の中立確率トリガー(プレイヤーの現在入力を一切見ない・既存のai.think
      // 思考サイクルに従うだけ)にキャラ別バイアスを乗せる。CPU-R2 PR3(#106 §7 SPECIAL): specialUseThreshold()で
      // resourceQuality(Lv依存)によりconditioned/genericを補間する
      if(canStartSpecial(me)&&rng()<specialUseThreshold(me,you))cpuEv.push({t:'special'});
    }
  }
}

/* ================= ロジック ================= */
function logic(){
  if(onlineActive()){netLogicTick();return;}
  B.f++;stepFx();
  if(B.hitstop>0){B.hitstop--;return;}
  if(B.flow==='vs'){ // VS-SCREEN-R1(#110): マッチ開始時のみ'intro'の前に挿入される演出専用flow。rng()は読まない
    evq.length=0;B.flowF++;
    if(B.flowF>=vsDurationF()){B.flow='intro';B.flowF=0;announce('ROUND '+B.round,66,50,'#ffd23f');}
  }else if(B.flow==='intro'){
    evq.length=0;B.flowF++;
    if(B.flowF===58){announce('FIGHT!',44,64,'#ff5a3c');sfx('fight');}
    if(B.flowF>=70){B.flow='fight';B.fightStartF=B.f;} // ラウンド開始時刻(YOUマーカーの強調2秒判定用、v0.10 (8))
  }else if(B.flow==='fight'){
    fightStep();
  }else if(B.flow==='clash'){
    evq.length=0;clashStep();
  }else if(B.flow==='ultCine'){
    evq.length=0;ultStep();
  }else if(B.flow==='ko'){
    evq.length=0;B.flowF++;
    if(B.flowF>=120)finishRound();
  }else if(B.flow==='roundEnd'){
    evq.length=0;B.flowF++;
    if(B.flowF>=80){B.round++;roundInit(false);}
  }else if(B.flow==='matchEnd'){
    evq.length=0;B.flowF++;
    if(B.flowF>=80){B.ann.length=0;game.screen='result';}
  }
}
/* ---- オンライン専用ロジック(ロックステップ) ----
 * B.flow全体(fight/clash/ultCine/ko/roundEnd/matchEnd)を、両者の入力コマンドが
 * 揃ったFのみ1F進める。揃わない間は"同期中…"としてB状態を一切変更しない
 * (競り合いミニゲームの内部乱数消費もこの1Fに紐づくため、両クライアントで完全に一致する)。
 */
function netCaptureAndSend(){ // 毎ロジック呼び出しで必ず1回だけ採取・送信する(待機中の再試行による二重送信を防ぐ)
  const cmds=evq.slice();evq.length=0;
  const held=currentP1Hold();
  const f=NET.capTick+NET.delayF;
  NET.localQ[f]={cmds:cmds,hold:held};
  netSend({t:'cmd',f:f,cmds:cmds,hold:held,matchSeq:NET.matchSeq});
  NET.capTick++;
}
function netLogicTick(){
  netCaptureAndSend();
  const f=NET.simF;
  const haveLocal=Object.prototype.hasOwnProperty.call(NET.localQ,f);
  const havePeer=Object.prototype.hasOwnProperty.call(NET.peerQ,f);
  if(!(haveLocal&&havePeer)){NET.waiting=true;NET.waitingF++;return;} // 相手の入力がまだ届いていない→このFは進めない(タイマーも減らさない)
  NET.waiting=false;NET.waitingF=0;
  const local=NET.localQ[f],peer=NET.peerQ[f];
  delete NET.localQ[f];delete NET.peerQ[f];
  let cmds0=online.slot===0?local.cmds:peer.cmds,hold0=online.slot===0?local.hold:peer.hold;
  let cmds1=online.slot===1?local.cmds:peer.cmds,hold1=online.slot===1?local.hold:peer.hold;
  NET.simF++;
  B.f++;stepFx();
  // vNext PR3レビュー指摘(PR#76・§9 Hitstop中方向仕込み可): このF全体をhitstopでskipするなら、
  // cmds/holdを捨てずpendCmds/pendHoldへ積み、hitstopが明けた最初のFでまとめて渡す
  // (両クライアントは同一の決定的B.hitstopを計算するため、stash/mergeの発生Fも両者で一致し決定性は保たれる)
  cmds0=NET.pendCmds0.length?NET.pendCmds0.concat(cmds0):cmds0;
  cmds1=NET.pendCmds1.length?NET.pendCmds1.concat(cmds1):cmds1;
  hold0=hold0!=null?hold0:NET.pendHold0;
  hold1=hold1!=null?hold1:NET.pendHold1;
  if(B.hitstop>0){
    NET.pendCmds0=cmds0;NET.pendCmds1=cmds1;NET.pendHold0=hold0;NET.pendHold1=hold1;
    B.hitstop--;return;
  }
  NET.pendCmds0=[];NET.pendCmds1=[];NET.pendHold0=null;NET.pendHold1=null;
  if(B.flow==='vs'){ // VS-SCREEN-R1(#110): 両クライアントとも同じNET.simF/haveLocal&&havePeerゲートの下で1F進むため、
    // rng()を読まないB.flowF駆動の演出はそのまま両者で一致する('intro'と同じロックステップ安全性)
    B.flowF++;
    if(B.flowF>=vsDurationF()){B.flow='intro';B.flowF=0;announce('ROUND '+B.round,66,50,'#ffd23f');}
  }else if(B.flow==='intro'){
    B.flowF++;
    if(B.flowF===58){announce('FIGHT!',44,64,'#ff5a3c');sfx('fight');}
    if(B.flowF>=70){B.flow='fight';B.fightStartF=B.f;} // ラウンド開始時刻(YOUマーカーの強調2秒判定用、v0.10 (8))
  }else if(B.flow==='fight'){
    netFightStep(cmds0,hold0,cmds1,hold1);
  }else if(B.flow==='clash'){
    clashStep(cmds0,cmds1);
  }else if(B.flow==='ultCine'){
    ultStep();
  }else if(B.flow==='ko'){
    B.flowF++;
    if(B.flowF>=120)finishRound();
  }else if(B.flow==='roundEnd'){
    B.flowF++;
    if(B.flowF>=80){B.round++;roundInit(false);}
  }else if(B.flow==='matchEnd'){
    B.flowF++;
    if(B.flowF>=80){
      B.ann.length=0;game.screen='result';NET.active=false;
      resultShownAt=performance.now();resultAdvanced=false; // v0.9.2: 勝敗表示を最低180F(3秒)保持してから次戦へ進める
    }
  }
}
function netFightStep(cmds0,hold0,cmds1,hold1){ // fightStep()のオンライン版(CPU AI/evq/cpuEvは使わない)
  B.timer--;
  const p1=B.p[0],p2=B.p[1];
  applyInputs(p1,p2,cmds0,hold0);
  if(B.flow!=='fight')return;
  applyInputs(p2,p1,cmds1,hold1);
  if(B.flow!=='fight')return;
  advance(p1);advance(p2);
  if(B.flow!=='fight')return;
  checkFocusTrigger(p1,p2);checkFocusTrigger(p2,p1);
  tryBuf(p1,p2);tryBuf(p2,p1);tryDodgeBuf(p1);tryDodgeBuf(p2);
  resolveHits();
  if(B.flow!=='fight')return;
  for(const f of B.p){
    guardRegenTick(f);
    tickPendingModernGrab(f,B.p[1-f.side]); // vNext PR3 (§8 Takimaru Modern Grab pending)
    tickPressureQueue(f,B.p[1-f.side]); // vNext PR4 (Takimaru PRESSURE queued throw)
    tickYomiReady(f); // vNext PR4 (Yomikage RETURN/JUST Ready timeout)
    tickSpecial(f); // ABILITY-R2 SPECIAL-CORE: cooldown/activeF共通の1F減算
    tickBulletReleaseInterrupt(f); // ABILITY-R2-C (Codexレビュー指摘 PR#109): Full Release中断時のoverheat/cmdMove固着防止
    tickPoison(f);tickBind(f);tickFeintFollowup(f); // ABILITY-R2-B: POISON tick/BIND減算/Chirka FEINT follow-up発火
    f.kb*=0.86;if(f.kb<0.5)f.kb=0;
    if(f.sNo>0)f.sNo--;
    if(f.phase!=='dodge'){
      if(f.counterReadyF>0)f.counterReadyF--;
      if(f.clinchF>0)f.clinchF--;
    }
  }
  if(B.timer<=0)timeUp();
}
function fightStep(){
  B.timer--;
  aiStep();
  const p1=B.p[0],p2=B.p[1];
  p1Hold=currentP1Hold();
  applyInputs(p1,p2,evq,p1Hold);
  if(B.flow!=='fight'){evq.length=0;cpuEv.length=0;return;}
  applyInputs(p2,p1,cpuEv,ai.guardOn?'mid':null);
  evq.length=0;cpuEv.length=0;
  if(B.flow!=='fight')return;
  advance(p1);advance(p2);
  if(B.flow!=='fight')return;
  checkFocusTrigger(p1,p2);checkFocusTrigger(p2,p1);
  tryBuf(p1,p2);tryBuf(p2,p1);tryDodgeBuf(p1);tryDodgeBuf(p2);
  resolveHits();
  if(B.flow!=='fight')return;
  for(const f of B.p){
    guardRegenTick(f);
    tickPendingModernGrab(f,B.p[1-f.side]); // vNext PR3 (§8 Takimaru Modern Grab pending)
    tickPressureQueue(f,B.p[1-f.side]); // vNext PR4 (Takimaru PRESSURE queued throw)
    tickYomiReady(f); // vNext PR4 (Yomikage RETURN/JUST Ready timeout)
    tickSpecial(f); // ABILITY-R2 SPECIAL-CORE: cooldown/activeF共通の1F減算
    tickBulletReleaseInterrupt(f); // ABILITY-R2-C (Codexレビュー指摘 PR#109): Full Release中断時のoverheat/cmdMove固着防止
    tickPoison(f);tickBind(f);tickFeintFollowup(f); // ABILITY-R2-B: POISON tick/BIND減算/Chirka FEINT follow-up発火
    f.kb*=0.86;if(f.kb<0.5)f.kb=0;
    if(f.sNo>0)f.sNo--;
    if(f.phase!=='dodge'){ // counterReady/密着は回避の戻りモーション中は消費せず、動けるようになってから起算
      if(f.counterReadyF>0)f.counterReadyF--;
      if(f.clinchF>0)f.clinchF--;
    }
  }
  if(B.timer<=0)timeUp();
}

const evq=[];
let p1Hold=null,padPress=null,tstate=null;
let dragRow=1,lastThrownRow=1; // 右ゾーン: 現在ドラッグ中の段 / 直前に投げた段（残像ガイド用）

let specialBtnFlashAt=0; // ABILITY-R2 SPECIAL-CORE: SPECIALボタン押下の一時ハイライト用タイムスタンプ
let dirBtnFlashAt=0,dirBtnFlashKind=null; // 方向ボタン押下の一時ハイライト用(§6.8 v2.5)
function toL(cx2,cy2){
  const r=cv.getBoundingClientRect();
  return{x:(cx2-r.left)/vScale,y:(cy2-r.top)/vScale};

// ABILITY-R2 SPECIAL-CORE(Issue #97 §1): 攻撃側操作UIをSPECIAL/GRABの上段2分割+HIGH/MID/LOWの3段へ変更。
// 右ゾーンをrh=(H-PT)/4の4等分にし、最上段だけ左右2つのボタン(SPECIAL|GRAB)に分割する。
// 旧GRAB_BTNは左寄り円形(cx:70)だったが、新レイアウトでは右ゾーン最上段の右半分の矩形ボタンへ統一する。
function attackTopRowH(){return(H-PT)/4;}
function specialBtnRect(){const rh=attackTopRowH();return{x:W/2,y:PT,w:W/4,h:rh};}
function grabBtnRect(){const rh=attackTopRowH();return{x:W/2+W/4,y:PT,w:W/4,h:rh};}
function inGrabBtn(p){const r=grabBtnRect();return inRect(p,r.x,r.y,r.w,r.h);}
function inSpecialBtn(p){const r=specialBtnRect();return inRect(p,r.x,r.y,r.w,r.h);}
const DIR_BTN_ARROW={sway:'←',crouch:'↓',lunge:'→'}; // 画像未読込時の図形フォールバック用
const DIR_BTN_ASSET={sway:'dirbtn_left',crouch:'dirbtn_down',lunge:'dirbtn_right'}; // 回避モーションの影絵アイコン(v0.11 §6.9)
function leftLowerRect(){ // 左ゾーン下半分(方向ボタン用の矩形)
  const y0=PT+(H-PT)/2;
  return{x:10,y:y0+8,w:W/2-20,h:(H-PT)/2-16};
}
function dirBtnRects(){ // ←↓→の3方向ボタン(上なし十字キー、§6.8 v2.5)
  const r=leftLowerRect(),bw=r.w/3;
  return[
    {dir:'sway',x:r.x,y:r.y,w:bw,h:r.h},
    {dir:'crouch',x:r.x+bw,y:r.y,w:bw,h:r.h},

function inDirBtn(p){
  for(const b of dirBtnRects())if(inRect(p,b.x,b.y,b.w,b.h))return b;
  return null;
}
function rowAt(py,prevRow){ // 段境界±20pxスナップ（誤爆防止）。ABILITY-R2: 最上段はSPECIAL/GRABなので
  // HIGH/MID/LOWの3段はそれを除いた残りの範囲(top以降)をrh刻みで分割する
  const rh=attackTopRowH(),top=PT+rh;
  let r=Math.min(2,Math.max(0,Math.floor((py-top)/rh)));
  if(prevRow!=null&&r!==prevRow){
    const b=top+Math.max(r,prevRow)*rh;
    if(Math.abs(py-b)<20)r=prevRow;
  }
  return r;
}
function pressRoute(p){

  if(game.screen==='characterDetail'){characterDetailPress(p);return null;}
  if(game.screen==='result'){resultPress(p);return null;}
  if(game.screen==='onlineLobby'){onlineLobbyPress(p);return null;}
  if(game.screen==='onlineSelect'){onlineSelectPress(p);return null;}
  if(game.screen==='onlineInterrupted'){onlineInterruptedPress(p);return null;}
  if(game.screen==='pause'){pausePress(p);return null;}
  if(game.screen==='movelist'){movelistPress(p);return null;}
  if(game.screen==='spriteCheck'){spriteCheckPress(p);return null;}
  if(game.screen!=='battle'||!B)return null;
  if(inRect(p,PAUSE_BTN.x,PAUSE_BTN.y,PAUSE_BTN.w,PAUSE_BTN.h)){ // 右上「II」: 高さ別攻撃等より先に判定(§6.8 v2.5)
    sfx('tap');pauseConfirmingQuit=false;game.screen='pause';return null;
  }
  if(B.flow==='clash'&&B.clash&&B.clash.phase==='select'){
    // オンライン中は実際のタップをロックステップ入力バッファ(evq)経由のコマンドとして送信し、
    // 両クライアントが同一の同期入力列から決定論的に勝敗を計算する(v0.9.1)。
    // ローカル演出(sfx/fx)はここで即時反映してよいが、勝敗判定に使うカウント/選択自体は
    // netLogicTick→clashStep→stepRenda/stepHayauchi/stepJyankenが同期Fで両者同一に確定させる。
    const cl=B.clash,netOn=onlineActive(),myIdx=netOn?online.slot:0;
    if(cl.mg==='renda'){
      if(netOn)evq.push({t:'mgTap'});else cl.rendaP+=BAL.MINIGAME.RENDA.tapGain; // 連打はタップ位置を問わない
      B.fx.push({k:'burst',x:p.x,y:p.y,f:0,dur:14}); // タップごとの火花演出
      sfx('tap');
    }else if(cl.mg==='hayauchi'){
      const tgt=netOn?(myIdx===0?cl.p0target:cl.p1target):cl.p0target,H2=BAL.MINIGAME.HAYAUCHI;
      if(tgt&&Math.hypot(p.x-tgt.x,p.y-tgt.y)<=H2.radius){
        sfx('tap');
        B.fx.push({k:'burst',x:tgt.x,y:tgt.y,f:0,dur:16});
        if(netOn){evq.push({t:'mgHit'});}
        else if(cl.p0hits<H2.targets){
          cl.p0hits++;
          cl.p0target=(cl.p0hits<H2.targets)?randHayauchiTarget():null;
        }
      }
    }else{
      const c=clashHit(p);
      if(c){
        sfx('tap');
        if(netOn){if(cl.pick[myIdx]===null)evq.push({t:'mgPick',choice:c});}
        else if(cl.pick[0]===null)cl.pick[0]=c;
      }
    }
    return null;
  }
  if(p.y<PT)return null;
  const myF=onlineActive()?B.p[online.slot]:B.p[0]; // オンライン中は自分のスロット側の奥義ストックを見る
  if(myF.ult>=BAL.ULT.stock){
    if(B.flow==='fight'){evq.push({t:'ult'});sfx('tap');}
    return null;
  }
  if(B.flow!=='fight'&&B.flow!=='intro')return null;
  if(inSpecialBtn(p)){ // ABILITY-R2 SPECIAL-CORE(Issue #97 §1): 右ゾーン最上段左半分。不成立でもcooldownは消費しない
    evq.push({t:'special'});sfx('tap');specialBtnFlashAt=performance.now();
    return null;
  }
  if(inGrabBtn(p)){ // つかみボタン: 右ゾーン最上段右半分(旧・左上circleから移設、§6.8 v2.5→ABILITY-R2で再配置)
    evq.push({t:'grab'});sfx('tap');grabBtnFlashAt=performance.now();
    return null;
  }
  if(p.x<W/2){ // 左ゾーン上半分: ホールド=ガード / ジャストタップ=見切り。下半分: ←↓→方向ボタン
    const db=inDirBtn(p);
    if(db){ // 方向ボタンは即時発火・24F入力バッファに積む(回避フリックは廃止、§6.8 v2.5)
      evq.push({t:'dodge',kind:db.dir});sfx('tap');dirBtnFlashAt=performance.now();dirBtnFlashKind=db.dir;
      return null;
    }
    padPress={zone:'L'};
    return 'L';
  }
  dragRow=rowAt(p.y,dragRow); // 右ゾーン: 高さ=段。発火はリリース時
  padPress={zone:'R',row:dragRow};
  return 'R';
}
function onDown(id,x,y){
  if(tstate)return;
  const p=toL(x,y);
  const zone=pressRoute(p);
  tstate=(zone==='L'||zone==='R')?{id:id,x0:p.x,y0:p.y,yNow:p.y,t0:performance.now(),zone:zone,resolved:false}:null;
}
function flickDir(dx,dy,ms){ // 有効なフリックの方向を1つ返す('left'/'right'/'up'/'down'/null)
  if(ms>BAL.FLICK_MS)return null;
  if(Math.abs(dx)>=BAL.FLICK_DX&&Math.abs(dx)>Math.abs(dy)*1.2)return dx>0?'right':'left';
  if(Math.abs(dy)>=BAL.FLICK_DX&&Math.abs(dy)>Math.abs(dx)*1.2)return dy>0?'down':'up';
  return null;
}
function onMove(id,x,y){
  if(!tstate||tstate.id!==id||tstate.resolved)return;
  const p=toL(x,y);
  tstate.yNow=p.y;
  const dx=p.x-tstate.x0,dy=p.y-tstate.y0;
  const ms=performance.now()-tstate.t0;
  const dir=flickDir(dx,dy,ms);
  if(tstate.zone==='R'){ // 右ゾーン: →フリック=咆哮（つかみ・方向は専用ボタンへ移動、§6.8 v2.5）
    dragRow=rowAt(p.y,dragRow);padPress={zone:'R',row:dragRow};
    if(dir==='right'){evq.push({t:'roar'});tstate.resolved=true;padPress=null;}
  }
}
function onUp(id){
  if(!tstate||tstate.id!==id){tstate=null;padPress=null;p1Hold=null;return;}
  if(!tstate.resolved){
    if(tstate.zone==='R'){
      const row=rowAt(tstate.yNow,dragRow);
      evq.push({t:'atk',lv:LEVELS[row]});
      lastThrownRow=row;
    }else if(tstate.zone==='L'){
      if(performance.now()-tstate.t0<=BAL.JUST_TAP_MS)evq.push({t:'mikiri'});
    }
  }
  p1Hold=null;tstate=null;padPress=null;
}
function currentP1Hold(){ // 左ゾーンを100ms超ホールド中＝ガード（未満はジャストタップ=見切り判定に回す）
  if(tstate&&tstate.zone==='L'&&!tstate.resolved&&performance.now()-tstate.t0>=BAL.JUST_TAP_MS)return 'guard';
  return null;
}

function fpos(f){
  const face=f.side===0?1:-1;
  if(B&&B.flow==='clash'&&B.clash){
    const c=B.clash,tgt=f.side===0?W/2-48:W/2+48;
    if(c.phase==='in'){const t=Math.min(1,c.f/BAL.CLASH.inF);return f.baseX+(tgt-f.baseX)*t;}
    if(c.phase==='select')return tgt+Math.sin(game.frame*0.9+f.side*3)*3;
    if(c.f<BAL.CLASH.revealHitF)return tgt+Math.sin(game.frame*1.3+f.side*3)*4;
    const t2=Math.min(1,(c.f-BAL.CLASH.revealHitF)/30);
    let x=tgt+(f.baseX-tgt)*t2;
    if(c.winner===f.side)x+=22*(1-t2)*face;
    else if(c.winner>=0)x-=f.kb*face*t2;
    return x;
  }
  return f.baseX+f.lunge*face-f.kb*face;
}

function fighterXY(f){
  if(f.phase==='grabbed'){
    const g=B.p[1-f.side],face=g.side===0?1:-1;
    const gx0=fpos(g)+46*face,t=g.pf;
    let xx=f.baseX,yy=f.y;
    if(t<=8){const k=t/8;xx=f.baseX+(gx0-f.baseX)*k;}
    else if(t<=18){xx=gx0;yy=f.y-74*Math.min(1,(t-8)/10);}
    else{xx=gx0;yy=f.y-74+74*Math.min(1,(t-18)/2);}
    return[xx,yy];
  }
  return[fpos(f),f.y];
}
function drawCoverBg(key){ // 背景画像: 下端を地面ライン(PT)に合わせたcover配置。描けたらtrueを返す
  if(!assetReady(key))return false;
  const e=ASSETS[key],img=e.canvas||e.img;
  const iw=e.img.naturalWidth,ih=e.img.naturalHeight;
  const scale=Math.max(W/iw,PT/ih);
  const dw=iw*scale,dh=ih*scale;
  ctx.drawImage(img,(W-dw)/2,PT-dh,dw,dh);
  return true;
}

/* ================= ポーズ算出/描画の分離 =================
 * poseId(f)で現在ポーズを一意なIDに算出し、SPRITES[charId][poseId]（アセット
 * 読み込みセクションで登録）に画像があればdrawImage、無ければ現行の図形描画
 * (drawFighterShape)にフォールバックする。ギュイーン(競り合い)演出は専用の
 * スプライトを持たないため、意図的に図形描画のまま(変更しない)。
 */
function poseId(f){ // POSE_IDS(20種)の正準名を返す。該当スプライトが無い状態は
  const P=f.phase,t=f.pf;      // 意図的にPOSE_IDS外の文字列を返し図形描画へフォールバックさせる
  if(P==='attack'&&f.atkLv==='crouch')return 'crouch_atk'; // しゃがみ突き(§6.6)。crouchポーズが構え(テレグラフ)を兼ねる
  if((P==='attack'||P==='cmdAtk')&&f.atkLv){
    const tg=BAL.TELEGRAPH[f.atkLv];
    if(t<=tg)return 'tele_'+f.atkLv; // テレグラフ=tele_*(コマンド技も通常段のtele_*を流用、§6.8)
    // CMD-R1: 旧cmd1〜3専用ポーズは廃止(タッチ統一優先)。既存24ポーズからの流用のみとし、

  if(P==='grabHit')return'grab_lift'; // CMD-R1: 旧cmd1〜3は廃止し常にgrab_liftへ統一
  if(P==='grabbed')return 'grabbed';

  if(P==='mikiriRec')return 'mikiri';      // 見切り=mikiri（成功時はclashへ即遷移するため空振りのみ表示対象）
  if(P==='down')return 'down';             // ダウン=down（追撃消化後の無敵も同一ポーズ）

  if(P==='dizzy')return 'hurt';            // ふらつき→hurtを流用
  if(P==='ko')return 'ko';
  if(P==='win')return 'win';
  if(P==='guard'||P==='blockstun')return 'guard';
  if(P==='hitstun')return 'hurt';

}

function currentArtRequest(f){

  if(P==='dodge')return pose(f.dodgeType);

  if(P==='clash'&&B&&B.clash&&B.clash.mg==='renda')return{kind:'frame',characterId:charId,actionId:'grab',frameIndex:1};

}

function dodgeSpriteOffset(f){ // 回避スプライト用: 11-22Fの戻り区間だけ同画像を構え位置へ向けて位置補間する

// GAME-UX-R1: HUD要素(HP/Guard/S/Ult/per-character ability gauge/P1-P2ラベル/ラウンドタイマー/

function abilityGaugeDescriptor(f){ // 常設ゲージ/ストック(y+22行): 数値化できるresourceのみ
  const id=f.c.id;
  if(id==='godan')return{kind:'segments',charId:'godan',group:'armor_stock',total:3,filled:f.armorStock};
  if(id==='hakuma')return{kind:'segments',charId:'hakuma',group:'iron_wall',total:1,filled:f.ironWallReady?1:0};

    // 次に埋まる予定のsegment(index=f.charge、cap3未満のみ)をf.chargeSub/3の比率で部分塗りする(新規アセットなし)
    filledFrac:(f.charge<3)?f.chargeSub/3:0,overheat:f.overheat};
  if(id==='dark_moguzo'){
    // ABILITY-R2-C (Issue #97 §11 Moon UI): 旧DARK 0-100の多段phase切替を撤去。既存new-moon/base asset(phase0)
    // のみを使い、locked/ready/body/cooldownは呼び出し側(drawAbilityGauge)がbrightness/glow/timer ringで表現する
    // (「do not delete old phase assets, just stop using obsolete phases at runtime」=マニフェスト自体は無変更)
    const map=ABILITY_UI_MANIFEST&&ABILITY_UI_MANIFEST.characters.dark_moguzo.dark_gauge.presentationMap;
    if(!map)return null;
    const locked=f.hp>maxHpFor(f.c)*0.30;
    const state=locked?'locked':(f.specialActiveF>0?'body':(f.specialCooldownF>0?'cooldown':'ready'));
    const frac=state==='cooldown'?Math.max(0,1-f.specialCooldownF/SPECIAL_COOLDOWN_F):(state==='body'?f.specialActiveF/specialDurationFor(f.c):1);
    return{kind:'mapped',charId:'dark_moguzo',group:'dark_gauge',mapKey:map['0'],darkMoonState:state,darkMoonFrac:frac};
  }
  if(id==='moguzo'){
    const group=f.gutsActive?'guts_active':(f.gritAvailable?'grit_available':null);
    return group?{kind:'icon',charId:'moguzo',group:group,sub:'icon'}:null;
  }
  return null;
}

    ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
    ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,'+(0.5*splitT)+')';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(midX+skew,0);ctx.lineTo(midX-skew,H);ctx.stroke();
  }
  // 2) 雷背景(常時・演出専用。Math.random/game.frameのみでrng()は不使用=オンライン同期に無関係)
  ctx.save();ctx.globalAlpha=Math.max(0,0.55+0.25*Math.sin(game.frame*0.4));
  ctx.strokeStyle=meta.darkFinal?'rgba(200,140,255,0.8)':'rgba(255,255,255,0.75)';ctx.lineWidth=2;
  for(let i=0;i<5;i++){
    const seedX=(i*137+Math.floor(game.frame/6)*53)%W;
    ctx.beginPath();ctx.moveTo(seedX,0);
    let cx=seedX;
    for(let s=0;s<6;s++){cx+=(((seedX*7+s*31+i*19)%17)-8)*4;ctx.lineTo(cx,(s+1)*H/6);}
    ctx.stroke();
  }
  ctx.restore();
  // 3) ポートレート(スライドイン。P2は「向き合う」向きに水平反転)
  const boxW=228,boxH=520,boxY=(H-boxH)/2-20;
  const slideT=Math.min(1,Math.max(0,f/slideEndF)),ease=1-Math.pow(1-slideT,3);
  const p1RestX=26,p2RestX=W-26-boxW;
  const p1X=p1RestX-(1-ease)*(boxW+80),p2X=p2RestX+(1-ease)*(boxW+80);
  if(slideT>0){
    // 背後グロー: Dark Moguzoのような暗色キャラでも輪郭が背景に沈まないよう、パネル背後へ必ず明るいハローを敷く
    const glow1=ctx.createRadialGradient(p1X+boxW/2,boxY+boxH/2,10,p1X+boxW/2,boxY+boxH/2,boxW*0.9);
    glow1.addColorStop(0,meta.darkFinal?'rgba(180,120,255,0.35)':'rgba(255,150,80,0.35)');glow1.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow1;ctx.fillRect(p1X-60,boxY-60,boxW+120,boxH+120);
    const glow2=ctx.createRadialGradient(p2X+boxW/2,boxY+boxH/2,10,p2X+boxW/2,boxY+boxH/2,boxW*0.9);
    glow2.addColorStop(0,meta.darkFinal?'rgba(140,90,255,0.35)':'rgba(90,160,255,0.35)');glow2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow2;ctx.fillRect(p2X-60,boxY-60,boxW+120,boxH+120);
    const r1=rosterEntryFor(p1.c.id),r2=rosterEntryFor(p2.c.id);
    ctx.save();rr(p1X,boxY,boxW,boxH,14);ctx.clip();ctx.fillStyle='#1a1420';ctx.fillRect(p1X,boxY,boxW,boxH);ctx.restore();
    ctx.save();rr(p2X,boxY,boxW,boxH,14);ctx.clip();ctx.fillStyle='#141a24';ctx.fillRect(p2X,boxY,boxW,boxH);ctx.restore();
    drawRosterCrop('roster_'+p1.c.id,p1X,boxY,boxW,boxH,r1&&r1.heroCrop,14);
    drawRosterCropFlipped('roster_'+p2.c.id,p2X,boxY,boxW,boxH,r2&&r2.heroCrop,14);
    ctx.save();ctx.globalAlpha=slideT;
    ctx.strokeStyle=meta.darkFinal?'#c07dff':'#ff9a4d';ctx.lineWidth=4;rr(p1X,boxY,boxW,boxH,14);ctx.stroke();
    ctx.strokeStyle=meta.darkFinal?'#8a4dff':'#5ab2ff';ctx.lineWidth=4;rr(p2X,boxY,boxW,boxH,14);ctx.stroke();
    ctx.restore();
  }
  // 4) VSスラム+名前・パレット表示(名前欄はSELECT_ART_BOXのPALETTE-R1表記と同じ「1P配色/2P配色」を使う)
  if(f>=slamF){
    const slamT=Math.min(1,(f-slamF)/10),pop=1+(1-slamT)*0.6;
    ctx.save();ctx.translate(W/2,H/2-40);ctx.scale(pop,pop);
    txt('VS',0,0,96,meta.darkFinal?'#e0c0ff':'#ffe14d');
    ctx.restore();
    const nameAlpha=Math.min(1,(f-slamF)/8);
    ctx.save();ctx.globalAlpha=nameAlpha;
    txt(p1.c.name,p1RestX+boxW/2,boxY+boxH+34,20,'#ffd8a8');
    txt(vsPaletteLabel(p1),p1RestX+boxW/2,boxY+boxH+58,13,vsPaletteColor(p1,meta)); // 同キャラ対戦でも文字色自体で1P/2Pを冗長に判別できるようにする
    txt(p2.c.name,p2RestX+boxW/2,boxY+boxH+34,20,'#a8d8ff');                        // (Issue本文「same-character match must visibly distinguish palette」)
    txt(vsPaletteLabel(p2),p2RestX+boxW/2,boxY+boxH+58,13,vsPaletteColor(p2,meta));
    ctx.restore();
    if(meta.darkFinal)txt('闇の力が高まっている……！',W/2,H-64,16,'#c9a2ff'); // ARCADE最終戦専用ナレーション(Issue本文§Mode rules)
    if(meta.survivalInfo)txt('SURVIVAL / BATTLE '+meta.survivalInfo.battleNum+' / CPU LV'+meta.survivalInfo.cpuLv,W/2,72,15,'#ffe6a3'); // SURVIVAL専用ラベル(同§)
    const flashF=slamF+4;
    if(f<flashF){ctx.save();ctx.globalAlpha=0.5*(1-(f-slamF)/4)*flashScale();ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.restore();} // 雷インパクトの白フラッシュ(短時間)。Codexレビュー対応(PR#121): 他の全画面フラッシュ(roarImpact)と同じくflashScale()でOPTIONS.flash==='reduced'を尊重する
  }
  // 5) 白フラッシュ→battle(intro遷移の直前)
  if(f>=holdEndF){
    const outT=Math.min(1,(f-holdEndF)/Math.max(1,dur-holdEndF));
    ctx.save();ctx.globalAlpha=outT*flashScale();ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.restore(); // Codexレビュー対応(PR#121): 同上
  }
}
function rBattle(){
  ctx.save();
  const mirror=onlineActive()&&online.slot===1; // 2P側クライアントのみ描画層で水平ミラー(§6.8 v2.5.1(7)。シミュレーション/入力/パッドUI/HUDは対象外)
  if(mirror){ctx.translate(W,0);ctx.scale(-1,1);inMirrorZone=true;}
  if(B.flow==='vs'){rVsScreen();inMirrorZone=false;ctx.restore();return;} // VS-SCREEN-R1(#110): ステージ/ファイター/HUD/パッドは描画せず専用画面に丸ごと差し替える
  if(B.shake>0)ctx.translate((Math.random()*2-1)*B.shake,(Math.random()*2-1)*B.shake);
  let zoom=1;
  if(B.flow==='clash'&&B.clash){
    const c=B.clash;

    const punchF=6,t=Math.min(1,B.roarImpact.f/punchF);

  }
  if(zoom!==1){ctx.translate(W/2,300);ctx.scale(zoom,zoom);ctx.translate(-W/2,-300);}
  // STAGE-FIX (Issue #107): ギュイーンは現在の試合内で発生する演出であり、対戦背景(rStage)を維持する。
