const ASSETS={};
function loadImg(key,src){
  const img=new Image();
  const e={img:img,ready:false,failed:false,canvas:null};
  ASSETS[key]=e;
  img.onload=function(){whitenAsset(e);e.ready=true;};
  img.onerror=function(){e.failed=true;};
  img.src=src;
  return e;
}
function whitenAsset(e){ // 近似白(しきい値)を透過化。既に透過済みのPNGなら実質no-op。ついでにalpha bboxの高さも実測する
  try{
    const oc=document.createElement('canvas');
    oc.width=e.img.naturalWidth;oc.height=e.img.naturalHeight;
    const octx=oc.getContext('2d');
    octx.drawImage(e.img,0,0);
    const id=octx.getImageData(0,0,oc.width,oc.height);
    const d=id.data,TH=238;
    let minY=oc.height,maxY=-1;
    for(let y=0;y<oc.height;y++){
      for(let x=0;x<oc.width;x++){
        const i=(y*oc.width+x)*4;
        if(d[i]>=TH&&d[i+1]>=TH&&d[i+2]>=TH)d[i+3]=0;
        if(d[i+3]>10){if(y<minY)minY=y;if(y>maxY)maxY=y;}
      }
    }
    octx.putImageData(id,0,0);
    e.canvas=oc;
    if(maxY>=minY)e.bboxH=maxY-minY+1; // 実測キャラ高(alpha bboxの高さ)。表示倍率の動的算出に使う
  }catch(err){ /* file://等でcanvasが汚染される環境では無処理の原画のまま使う(bboxH未設定→呼び出し側でフォールバック) */ }
}

function assetReady(key){const e=ASSETS[key];return!!(e&&e.ready&&!e.failed);}
function drawStanding(key,cx,bottomY,targetH){ // 足元アンカー・高さ基準でフィット
  if(!assetReady(key))return false;
  const e=ASSETS[key],src=e.canvas||e.img;
  const iw=e.img.naturalWidth,ih=e.img.naturalHeight;
  const w=targetH*iw/ih;
  ctx.drawImage(src,cx-w/2,bottomY-targetH,w,targetH);
  return true;
}
function drawUiIcon(key,cx,cy,targetW){ // アイコン系: 中心基準・幅targetWでアスペクト維持描画
  if(!assetReady(key))return false;
  const e=ASSETS[key],src=e.canvas||e.img;
  const iw=e.img.naturalWidth,ih=e.img.naturalHeight;
  const w=targetW,h=targetW*ih/iw;
  ctx.drawImage(src,cx-w/2,cy-h/2,w,h);
  return true;
}
// フレーム系UI画像(枠+透過窓)用。(ix0f..iy1f)=画像内の透過窓の位置比率(0-1)。
// 窓が目標矩形(tx,ty,tw,th)にちょうど重なるよう画像全体を拡縮して描画する。flip=true で左右反転(枠のみ)。
function drawUiFrame(key,tx,ty,tw,th,ix0f,iy0f,ix1f,iy1f,flip){
  if(!assetReady(key))return false;
  const e=ASSETS[key],src=e.canvas||e.img;
  const iw=e.img.naturalWidth,ih=e.img.naturalHeight;
  const ix0=ix0f*iw,iy0=iy0f*ih,ix1=ix1f*iw,iy1=iy1f*ih;
  const scale=tw/(ix1-ix0);
  const dw=iw*scale,dh=ih*scale;
  ctx.save();
  if(flip){ctx.translate(tx+tw,ty);ctx.scale(-1,1);}else{ctx.translate(tx,ty);}
  ctx.drawImage(src,-ix0*scale,-iy0*scale,dw,dh);
  ctx.restore();
  return true;
}

/* ================= 仮SE（WebAudio合成） ================= */
let AC=null;
function audioInit(){try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
}catch(e){}}
function tone(f0,dur,type,vol,f1){if(!AC)return;try{
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';
  o.frequency.setValueAtTime(f0,t);
  o.frequency.linearRampToValueAtTime(f1==null?f0:f1,t+dur);
  g.gain.setValueAtTime(vol||0.15,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+dur+0.02);
}catch(e){}}
function noiseS(dur,vol){if(!AC)return;try{
  const t=AC.currentTime,n=(AC.sampleRate*dur)|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  const s=AC.createBufferSource();s.buffer=b;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(g);g.connect(AC.destination);s.start(t);
}catch(e){}}
function sfx(n){
  if(n==='tap'){tone(640,0.05,'square',0.09);}
  else if(n==='swish'){tone(900,0.06,'sine',0.05,320);}
  else if(n==='hit'){noiseS(0.07,0.2);tone(170,0.09,'square',0.2,90);}
  else if(n==='hit2'){noiseS(0.1,0.26);tone(120,0.14,'square',0.24,60);}
  else if(n==='guard'){tone(760,0.05,'square',0.1,640);}
  else if(n==='guiin'){tone(480,0.55,'sawtooth',0.15,1500);tone(486,0.55,'sawtooth',0.09,1540);}
  else if(n==='roarStart'){tone(330,0.16,'sine',0.1,150);}
  else if(n==='roar'){tone(110,0.5,'sawtooth',0.2,190);noiseS(0.35,0.16);}

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return 'rgb('+r+','+g+','+b+')';
}
function L(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
function bz(a,c,b,t){const u=1-t;return[u*u*a[0]+2*u*t*c[0]+t*t*b[0],u*u*a[1]+2*u*t*c[1]+t*t*b[1]];}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
let inMirrorZone=false; // オンライン2P側のビュー反転(§6.8 v2.5.1(7))が有効な描画区間中か。rBattle()の反転save/restore内でのみtrue
function txt(t,x,y,size,color,align){
  ctx.font='900 '+size+'px "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif';
  const al=align||'center';
  ctx.lineWidth=Math.max(3,size*0.16);ctx.strokeStyle='rgba(0,0,0,0.85)';ctx.lineJoin='round';
  if(inMirrorZone){ // 座標はミラーされた空間のまま・文字だけ正向きに描く(鏡文字にしない)ため局所的に打ち消す
    ctx.save();
    ctx.translate(x,y);ctx.scale(-1,1);
    ctx.textAlign=(al==='left')?'right':(al==='right')?'left':'center';ctx.textBaseline='middle';
    ctx.strokeText(t,0,0);
    ctx.fillStyle=color;ctx.fillText(t,0,0);
    ctx.restore();
    return;
  }
  ctx.textAlign=al;ctx.textBaseline='middle';
  ctx.strokeText(t,x,y);
  ctx.fillStyle=color;ctx.fillText(t,x,y);
}
function inRect(p,x,y,w,h){return p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;}
function star(x,y,r,col){
  ctx.save();ctx.translate(x,y);ctx.fillStyle=col;ctx.beginPath();
  for(let i=0;i<8;i++){const a=i*Math.PI/4,r2=(i%2===0)?r:r*0.45;
    if(i===0)ctx.moveTo(Math.cos(a)*r2,Math.sin(a)*r2);else ctx.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);}
  ctx.closePath();ctx.fill();ctx.restore();
}

/* ================= オンライン対戦（v0.9） =================
 * サーバーはWebSocketリレー専用(ゲームロジックを持たない)。ロビーで両者が揃うと
 * 共有rngシードを受け取り、以後は入力コマンド(タグ:frame番号)を交換するロックステップ方式で
 * 両クライアントが同一のB状態を独立に計算する(§03データ設計 準拠、Math.randomは対戦本体で不使用)。
 * ギュイーン(競り合いミニゲーム)は実際のタップを相互送信しない(スコープ外・PR3)。
 * オンライン中は両サイドとも共有rng駆動のシミュレーション結果で決着させ、決定性を優先する
 * (ローカルのタップはSE/演出のみに反映し、勝敗には影響しない)。
 */
const CONFIG={WS_URL:'wss://mamoken-relay.n-kyosuke1121.workers.dev'}; // デプロイ済み本番Workers URL
const ONLINE_BTN={x:0,y:0,w:0,h:0}; // rTitle()で毎フレーム位置を確定(pressRouteと共有)
const ONLINE_BACK_RECT={x:70,y:864,w:400,h:60};
const online={
  state:'menu', // 'menu'|'connecting'|'waiting'|'ready'|'error'
  mode:null,    // 'create'|'join'
  code:null,ws:null,slot:null,seed:null,errorMsg:'',
  myPick:null,peerPick:null, // オンラインキャラ選択(CHARSのindex)
  keepaliveIv:null, // WSキープアライブping用interval(v0.9.2: 無通信での切断誤検知を減らす)
  lastPingSentAt:null,myDelayF:null,delayFBySlot:{} // v0.10 (9): 開始時RTT適応delayF。両者確定するまでmaybeStartOnlineBattleは待つ
};
function computeDelayFromRTT(rttMs){ // delayF=clamp(3,ceil(RTT/2/16.7ms)+1,8) (§6.8 v2.5(9))
  const oneWayFrames=Math.ceil((rttMs/2)/BAL.NET.frameMs)+1;
  return Math.min(BAL.NET.delayFMax,Math.max(BAL.NET.delayFMin,oneWayFrames));
}
const KEEPALIVE_MS=10000; // 10秒間隔でpingを送る(無通信タイムアウトによる誤切断対策)
const NET={ // ロックステップ状態(startOnlineBattleで対戦ごとに初期化)
  active:false,       // true=オンライン対戦本体が進行中(この間はCPU AI/オフラインrng消費経路を一切使わない)
  delayF:BAL.NET.delayFMax, // 入力遅延バッファ(F)。RTT実測に基づき部屋確立時に両者の大きい方へ確定(v0.10 (9))。未確定時は安全側の上限
  capTick:0,           // ローカル入力の採取カウンタ(毎ロジックF必ず+1。採取と送信は待機中でも止めない=二重送信防止)
  simF:0,              // 次に確定させるシミュレーションフレーム番号
  localQ:{},peerQ:{},  // frame番号 -> {cmds,hold}
  waiting:false,       // true="同期中…"(両者のF入力が揃うまでこのFのロジックは進めない)
  waitingF:0,          // 待機が連続何F続いているか。表示のちらつき防止にBAL.NET.waitingShowFで閾値判定
  matchSeq:0           // 対戦(startOnlineBattle)ごとに+1する通し番号。勝ち残り交代等で対戦が
                        // 連続する際、前の対戦の終盤に届いた遅延cmdが次の対戦のsimF(0番から
                        // 再カウント)と衝突してpeerQを汚染しないよう、cmdメッセージに載せて
                        // 世代を区別する(絶対にリセットしない・増加のみ)
};
let netPendingPeerCmds=[]; // 自分がstartOnlineBattle前に受信したcmd(相手が先に対戦開始した場合の取りこぼし防止。matchSeq付き)
function onlineActive(){return NET.active;}
function netSend(msg){if(online.ws&&online.ws.readyState===1){try{online.ws.send(JSON.stringify(msg));}catch(e){}}}
function onlineReset(){
  if(online.ws){try{online.ws.close();}catch(e){}}
  if(online.keepaliveIv){clearInterval(online.keepaliveIv);online.keepaliveIv=null;}
  online.state='menu';online.mode=null;online.code=null;online.ws=null;online.slot=null;online.seed=null;online.errorMsg='';
  online.myPick=null;online.peerPick=null;
  online.lastPingSentAt=null;online.myDelayF=null;online.delayFBySlot={};
  NET.active=false;netPendingPeerCmds=[];
}
function onlineHandleDisconnect(reason){
  online.state='error';online.errorMsg=reason;
  NET.active=false;
  if(game.screen==='onlineSelect'||game.screen==='battle'||game.screen==='result')game.screen='onlineInterrupted';
}
function onlineConnect(code,mode){
  online.mode=mode;online.code=code;online.state='connecting';
  let ws;
  try{ws=new WebSocket(CONFIG.WS_URL+'/ws/'+code);}
  catch(e){online.state='error';online.errorMsg='接続に失敗しました';return;}
  online.ws=ws;
  ws.addEventListener('open',function(){
    online.state='waiting';
    if(online.keepaliveIv)clearInterval(online.keepaliveIv);
    // キープアライブ(無通信での切断誤検知対策)を兼ねて、pingのたびにlastPingSentAtを更新する。
    // 最初のpongでmyDelayFが未確定なら都度RTTを計測できるため、初回のpingロスにも自己修復する(v0.10 (9))
    online.keepaliveIv=setInterval(function(){online.lastPingSentAt=performance.now();netSend({t:'ping'});},KEEPALIVE_MS);
  });
  ws.addEventListener('message',function(ev){
    let msg;try{msg=JSON.parse(ev.data);}catch(e){return;}
    if(msg.t==='welcome'){
      online.slot=msg.slot;
      online.lastPingSentAt=performance.now();netSend({t:'ping'}); // 部屋確立時にRTT計測を即時開始(v0.10 (9)、キープアライブの初回を待たない)
    }
    else if(msg.t==='pong'){
      if(online.lastPingSentAt!=null&&online.myDelayF==null){
        const rtt=performance.now()-online.lastPingSentAt;
        online.myDelayF=computeDelayFromRTT(rtt);
        if(online.slot===0||online.slot===1)online.delayFBySlot[online.slot]=online.myDelayF;
        netSend({t:'delayFReport',slot:online.slot,value:online.myDelayF});
        if(game.screen==='onlineSelect')maybeStartOnlineBattle();
      }
    }
    else if(msg.t==='delayFReport'){ // 相手クライアントが計測したdelayF算出値(v0.10 (9)。大きい方を両者で採用)
      if((msg.slot===0||msg.slot===1)&&typeof msg.value==='number')online.delayFBySlot[msg.slot]=msg.value;
      if(game.screen==='onlineSelect')maybeStartOnlineBattle();
    }
    else if(msg.t==='peerJoined'){ // 新規接続(観戦者含む)通知。自分の計測済みdelayFを再送し、後から入室した相手にも届くようにする(v0.10 (9))
      if(online.myDelayF!=null)netSend({t:'delayFReport',slot:online.slot,value:online.myDelayF});
    }
    else if(msg.t==='ready'){
      online.seed=msg.seed;online.state='ready';
      if(online.slot===0||online.slot===1){online.myPick=null;online.peerPick=null;game.screen='onlineSelect';}
    }else if(msg.t==='yourSlot'){ // 勝ち残り交代(v0.9 PR4): 観戦者⇔対戦者の入れ替え通知
      online.slot=msg.slot;
      if(msg.slot>=2){ // 敗者→観戦者に降格。直後に新シードの'ready'は届かないのでここでロビーへ戻す
        online.myPick=null;online.peerPick=null;
        game.screen='onlineLobby';
      }else if(online.myDelayF!=null){ // 観戦者→対戦者に昇格: 既に計測済みのmyDelayFを新slotで再送(v0.10 (9))
        online.delayFBySlot[online.slot]=online.myDelayF;
        netSend({t:'delayFReport',slot:online.slot,value:online.myDelayF});
      } // この直後に届く'ready'がonlineSelectへ遷移させる
    }else if(msg.t==='peerLeft'){
      if(online.state==='ready'&&(msg.slot===0||msg.slot===1))onlineHandleDisconnect('相手が退出しました'); // 観戦者の退出では対戦を中断しない
    }else if(msg.t==='pick'){
      online.peerPick=msg.charIdx;
      if(game.screen==='onlineSelect')maybeStartOnlineBattle();
    }else if(msg.t==='cmd'){
      // matchSeqで対戦の世代を区別する: 今の対戦(NET.matchSeq)宛てのみ即適用。
      // 未来の対戦(相手が先に開始した分)は保留し、過去の対戦の残骸(前の対戦の終盤に
      // 遅れて届いた分)は破棄する(simFは対戦ごとに0から数え直すため、破棄しないと
      // 次の対戦のpeerQを誤って汚染しデシンクの原因になる)
      if(NET.active&&msg.matchSeq===NET.matchSeq)NET.peerQ[msg.f]={cmds:msg.cmds,hold:msg.hold};
      else if(msg.matchSeq>NET.matchSeq)netPendingPeerCmds.push(msg);
    }
  });
  ws.addEventListener('close',function(){
    if(online.keepaliveIv){clearInterval(online.keepaliveIv);online.keepaliveIv=null;}
    if(online.state!=='menu')onlineHandleDisconnect('通信が切断されました');
  });
  ws.addEventListener('error',function(){
    if(online.keepaliveIv){clearInterval(online.keepaliveIv);online.keepaliveIv=null;}
    onlineHandleDisconnect('接続エラーが発生しました');
  });
}
function wsUrlToHttpBase(wsUrl){return wsUrl.replace(/^ws:/,'http:').replace(/^wss:/,'https:');}

function startOnlineBattle(seed,charIdxBySlot,delayF){ // オンライン対戦開始: 共有シード+両者の選択キャラでBを構築、CPU AIは使わない
  lastMatchOnline=true;

  game.p1=charIdxBySlot[0];game.p2=charIdxBySlot[1];
  B={f:0,round:1,wins:[0,0],timer:BAL.TIME,fightStartF:0, // v0.10 (8): YOUマーカーの強調2秒判定に使う「fightに入ったF」
    p:[newFighter(game.p1,0),newFighter(game.p2,1)],
    flow:'intro',flowF:0,hitstop:0,shake:0,
    clash:null,ultUser:-1,ann:[],fx:[],koSide:-1,result:null,pendKO:-1,clashStreak:[0,0]};
  roundInit(true);
  NET.matchSeq++; // 対戦世代を進める(前の対戦の遅延cmd残骸を弾くため)
  // v0.10 (9): delayFは固定値ではなくRTT実測による開始時適応値(両者の算出値の大きい方)。
  // 未計測(delayF未指定)の場合は安全側の上限にフォールバックする
  NET.delayF=delayF||BAL.NET.delayFMax;
  NET.capTick=0;NET.simF=0;NET.waiting=false;NET.waitingF=0;
  NET.localQ={};NET.peerQ={};
  for(let i=0;i<NET.delayF;i++){NET.localQ[i]={cmds:[],hold:null};NET.peerQ[i]={cmds:[],hold:null};}
  for(const m of netPendingPeerCmds){if(m.matchSeq===NET.matchSeq)NET.peerQ[m.f]={cmds:m.cmds,hold:m.hold};} // 念のためこの世代宛て以外は捨てる

/* ================= FX ================= */
function stepFx(){
  for(const a of B.ann)a.f++;
  B.ann=B.ann.filter(function(a){return a.f<a.dur;});
  for(const p of B.fx)p.f++;
  B.fx=B.fx.filter(function(p){return p.f<p.dur;});
  for(const f of B.p){
    f.shownHp+=(f.hp-f.shownHp)*0.12;
    if(f.ultFlash>0)f.ultFlash--;
  }
  if(B.shake>0){B.shake*=0.88;if(B.shake<0.3)B.shake=0;}
}
function lvY(f,lv){return f.y+BAL.ATK[lv].y;}
function fxSpark(def,lv,guard,big){ // big: 呼び出し側で強制指定(咆哮ヒットなど、lvが位置算出専用でサイズと無関係な場合用)
  const isBig=!guard&&(big||lv==='high'||lv==='low'); // 大=上段/下段/咆哮ヒット、小=中段/しゃがみ突き/ガード
  const picks=[];
  for(let i=0;i<3;i++){
    picks.push({n:1+Math.floor(Math.random()*5),rot:Math.random()*TAU,scl:0.75+Math.random()*0.5,
      ox:(Math.random()*2-1)*(isBig?22:14),oy:(Math.random()*2-1)*(isBig?18:11)});
  }
  B.fx.push({k:guard?'gspark':'spark',x:def.baseX+(def.side===0?16:-16),y:lvY(def,lv||'mid'),f:0,dur:14,big:isBig,picks:picks});
}
function fxDmg(def,n,col){B.fx.push({k:'dmg',x:def.baseX,y:lvY(def,'high')-30,n:n,col:col,f:0,dur:44});}
function relY(f,ratio){return f.y-BAL.SPRITE_H[f.c.id]*ratio;} // キャラの表示身長(BAL.SPRITE_H)基準の頭上/身体オフセット(体格差に追従)
function fxWave(att){B.fx.push({k:'wave',x:att.baseX+(att.side===0?30:-30),y:relY(att,0.497),dir:att.side===0?1:-1,f:0,dur:26});}
function fxBurst(x,y){B.fx.push({k:'burst',x:x,y:y,f:0,dur:22});}
function fxStars(f){B.fx.push({k:'stars',x:f.baseX,y:relY(f,0.789),f:0,dur:BAL.DIZZY});}
function fxRoarImg(charId){ // 咆哮演出画(該当キャラの画像が無ければ何も足さず現行のfxWaveのみ)
  if(assetReady('roar_'+charId))B.fx.push({k:'roarImg',charId:charId,f:0,dur:24});
}

/* ================= コア戦闘 ================= */
function actionable(f){return f.phase==='idle'||f.phase==='guard';}
function specForLv(f,lv){
  const b=BAL.ATK[lv];
  return{s:Math.max(4,b.s+f.c.sOfs),a:b.a,r:b.r,d:b.d*f.c.dMul,y:b.y,down:!!b.down};
}
function specForCmd(f,m){ // コマンド技(v0.10): 数値はBAL.CMDの技定義そのもの(キャラのsOfsは適用しない=技ごとに調整済みの値)
  return{s:m.s,a:m.a||3,r:m.r||BAL.ATK[m.lv].r,d:m.d*f.c.dMul,y:BAL.ATK[m.lv].y,down:(m.down!=null)?m.down:(m.trigger==='low')};
}
function spec(f){
  if(f.cmdMove&&f.phase==='cmdAtk')return specForCmd(f,f.cmdMove);
  return specForLv(f,f.atkLv);
}
function gainS(f,k){f.s=Math.min(BAL.SMAX,f.s+BAL.SG[k]*f.c.sMul);}
function gainSAmt(f,amt){f.s=Math.min(BAL.SMAX,f.s+amt*f.c.sMul);}
function gainFocus(f,amt){f.focus=Math.min(BAL.FOCUS.max,f.focus+amt);}
function triggerFocus(){ // 満タン時に相手攻撃が発生した瞬間、自動で世界がスローに
  focusSlowMs=BAL.FOCUS.durationMs;
  announce('集中!!',40,40,'#7fe8ff');
}
function checkFocusTrigger(att,def){
  if(def.focus>=BAL.FOCUS.max&&(att.phase==='attack'||att.phase==='cmdAtk')&&att.atkLv&&att.pf===spec(att).s){
    def.focus=0;triggerFocus();
  }
}
function startAtk(f,lv,chain){
  f.phase='attack';f.pf=0;f.atkLv=lv;f.hasHit=false;f.guardLv=null;
  if(!chain){f.combo=0;f.comboCounter=false;} // 新規始動でカウンターコンボの補正緩和もリセット
  sfx('swish');
  sfx(lv==='high'?'teleHigh':(lv==='low'?'teleLow':'teleMid')); // テレグラフ固有SE
  if(!chain){ // 読まれ表示: ニュートラルからの選択が同系統3連続で「読まれ!」
    if(f.lastAtkLv===lv)f.atkStreak++;else f.atkStreak=1;
    f.lastAtkLv=lv;
    if(f.atkStreak>=3){f.yomare=true;fxYomare(f);}else f.yomare=false;
  }
}
function fxYomare(f){B.fx.push({k:'yomare',x:fpos(f),y:relY(f,1.027),f:0,dur:50});}
function startDodge(f,kind){ // kind: 'crouch'|'sway'|'lunge'
  f.phase='dodge';f.pf=0;f.dodgeType=kind;f.atkLv=null;f.guardLv=null;f.buf=null;f.combo=0;f.hasHit=false;
  sfx('swish');
}
function startCrouchAtk(f){ // しゃがみ中(1〜14F)の右ゾーンタップ＝しゃがみ突き。高さは問わない
  f.phase='attack';f.pf=0;f.atkLv='crouch';f.dodgeType=null;f.hasHit=false;f.guardLv=null;f.combo=0;f.comboCounter=false;
  sfx('swish');sfx('teleMid'); // 専用SEは無いため中段テレグラフSEを流用
}
/* ---- コマンド技(v0.10 §6.8) ---- */
const DODGE_DIR={sway:'left',crouch:'down',lunge:'right'}; // 方向ボタンの押下履歴を入力バッファへ積む際の矢印表記
function pushDirBuf(f,kind){
  f.dirBuf.push({dir:DODGE_DIR[kind],f:B.f});
  if(f.dirBuf.length>8)f.dirBuf.shift(); // 24F窓に対して十分な余裕を持たせつつメモリを節約
}
function detectCommandMove(f){ // 直近2方向がキャラのコマンド技のいずれかと一致すれば{move,idx}を返す
  const moves=BAL.CMD.moves[f.c.id];
  if(!moves)return null;
  const win=f.dirBuf.filter(function(e){return B.f-e.f<=BAL.CMD.bufF;});
  if(win.length<2)return null;
  const d0=win[win.length-2].dir,d1=win[win.length-1].dir;
  for(let i=0;i<moves.length;i++){
    const m=moves[i];
    if(m.seq[0]===d0&&m.seq[1]===d1)return{move:m,idx:i};
  }
  return null;
}
function startCmdAtk(f,m,idx){
  f.phase='cmdAtk';f.pf=0;f.atkLv=m.lv;f.cmdMove=m;f.cmdIdx=idx;f.hasHit=false;f.guardLv=null;f.buf=null;
  f.combo=0;f.comboCounter=false;f.dirBuf.length=0;
  sfx('swish');sfx(m.lv==='high'?'teleHigh':(m.lv==='low'?'teleLow':'teleMid'));
}
function startCmdGrab(f,m,idx){
  f.phase='grab';f.pf=0;f.guardLv=null;f.atkLv=null;f.buf=null;f.combo=0;f.hasHit=false;
  f.cmdMove=m;f.cmdIdx=idx;f.grabS=m.s;f.dirBuf.length=0;
  sfx('grabGo');
}
function startCmdStance(f,m,idx){
  f.phase='cmdStance';f.pf=0;f.cmdMove=m;f.cmdIdx=idx;f.atkLv=null;f.guardLv=null;f.buf=null;f.combo=0;f.hasHit=false;
  f.dirBuf.length=0;
  sfx(m.se||'guard');
}
function stunRemaining(f){ // コマンド先行入力(v0.11 §6.9): 現在の硬直/回収フェーズがidleに戻るまでの残りF。対象外のフェーズはnull
  switch(f.phase){
    case 'attack':case 'cmdAtk':{const A=spec(f);return A.s+A.a+A.r-f.pf;}
    case 'cmdStance':return(f.cmdMove?f.cmdMove.stanceF:0)-f.pf;
    case 'roar':return BAL.ROAR.s+BAL.ROAR.a+BAL.ROAR.r-f.pf;
    case 'grabrec':return BAL.GRAB.rec-f.pf;
    case 'grabHit':return BAL.GRAB.seq-f.pf;
    case 'hitstun':case 'blockstun':return f.stunDur-f.pf;
    case 'mikiriRec':return BAL.MIKIRI.whiff-f.pf;
    case 'dodge':return BAL.DODGE.totalF-f.pf;
    default:return null;
  }
}
function resolveToIdle(f){ // コマンド先行入力(v0.11 §6.9): idle復帰の瞬間、保持中のコマンド技があれば自動発動する
  if(f.cmdBufMove){
    const m=f.cmdBufMove,idx=f.cmdBufIdx;
    f.cmdBufMove=null;f.cmdBufIdx=null;
    if(m.type==='grab')startCmdGrab(f,m,idx);
    else if(m.type==='stance')startCmdStance(f,m,idx);
    else startCmdAtk(f,m,idx);
    return;
  }
  f.phase='idle';f.pf=0;
}
function canChain(f,lv){
  if(f.phase!=='attack'||!f.hasHit||f.combo>=BAL.CMAX)return false;
  if(BAL.ATK[lv].w<=BAL.ATK[f.atkLv].w)return false; // 軽→重ルートのみ（中→上→下）
  const A=spec(f);
  return f.pf>A.s+A.a&&f.pf<=A.s+A.a+BAL.CHAIN;
}
function applyInputs(f,opp,cmds,held){
  f.held=held;
  if(f.ult>=BAL.ULT.stock){ // 奥義スタンバイ: パッド強制変形（モードA）
    if(f.phase==='guard'){f.phase='idle';f.pf=0;f.guardLv=null;}
    f.buf=null;
    for(let i=0;i<cmds.length;i++){
      if(cmds[i].t==='ult'&&actionable(f)){fireUlt(f.side);return;}
    }
    return;
  }
  for(let i=0;i<cmds.length;i++){
    const c=cmds[i];
    if(c.t==='roar'){
      const okPhase=f.phase==='idle'||f.phase==='guard'||f.phase==='hitstun'||f.phase==='blockstun'
        ||(f.phase==='attack'&&f.pf<=spec(f).s); // A発生キャンセル可
      if(f.s>=BAL.SMAX&&okPhase){
        f.s=0;f.phase='roar';f.pf=0;f.atkLv=null;f.guardLv=null;f.hasHit=false;f.kb=0;f.buf=null;f.combo=0;
        sfx('roarStart');
      }else if(f.s<BAL.SMAX){f.sNo=14;} // ゲージ不足時のS枠点滅フィードバックは両サイドとも出す(オンラインは両者とも人間のため)
    }else if(c.t==='grab'){
      const cm=detectCommandMove(f); // コマンド技(v0.10): 直前2方向+つかみタップ=投げ系コマンド技
      if(cm&&cm.move.type==='grab'&&(f.phase==='idle'||f.phase==='guard')){
        startCmdGrab(f,cm.move,cm.idx);
      }else if(f.phase==='idle'||f.phase==='guard'){
        f.phase='grab';f.pf=0;f.guardLv=null;f.atkLv=null;f.buf=null;f.combo=0;f.hasHit=false;
        f.grabS=f.clinchF>0?BAL.DODGE.clinchGrabS:BAL.GRAB.s; // 発生F値は開始時点でスナップショット(密着F自体はその後も毎F減衰するため)
        sfx('grabGo');
      }else if(cm&&cm.move.type==='grab'){ // コマンド先行入力(v0.11 §6.9): 硬直残りBAL.CMD.buffer以内なら保持し、idle復帰時に自動発動
        const rem=stunRemaining(f);
        if(rem!=null&&rem<=BAL.CMD.buffer){f.cmdBufMove=cm.move;f.cmdBufIdx=cm.idx;}
      }
    }else if(c.t==='dodge'){ // 回避: idle/guardから発生。押下履歴は成否に関わらず常にバッファへ積む(コマンド技判定用)
      pushDirBuf(f,c.kind);
      if(f.phase==='idle'||f.phase==='guard'){
        startDodge(f,c.kind);
      }
    }else if(c.t==='mikiri'){ // 見切り: ジャストタップ。窓内なら能動的にギュイーンを起こす
      if(f.phase==='idle'||f.phase==='guard'){
        const win=(f.hp<=BAL.PINCH_HP)?BAL.MIKIRI.windowPinch:BAL.MIKIRI.window;
        const opAtk=(opp.phase==='attack'||opp.phase==='cmdAtk')&&opp.atkLv;
        const success=opAtk&&Math.abs(opp.pf-(spec(opp).s+1))<=win;
        if(success){gainFocus(f,BAL.FOCUS.gainMikiri);startClash('mikiri');return;}
        f.phase='mikiriRec';f.pf=0;f.guardLv=null;f.buf=null;sfx('whiffG');
      }
    }else if(c.t==='atk'){
      const cm=detectCommandMove(f); // コマンド技(v0.10): 直前2方向+同じ高さの攻撃タップ=コマンド技
      if(cm&&cm.move.type==='atk'&&cm.move.trigger===c.lv&&f.phase==='idle'){
        startCmdAtk(f,cm.move,cm.idx);
      }else if(cm&&cm.move.type==='stance'&&cm.move.trigger===c.lv&&f.phase==='idle'){
        startCmdStance(f,cm.move,cm.idx);
      }else if(f.phase==='dodge'&&f.dodgeType==='crouch'&&f.pf>=1&&f.pf<=BAL.DODGE.crouchAtkWindow){
        startCrouchAtk(f); // しゃがみ中は高さに関わらずしゃがみ突きへキャンセル
      }else if(f.phase==='idle')startAtk(f,c.lv,false);
      else if(canChain(f,c.lv))startAtk(f,c.lv,true);
      else if(cm&&(cm.move.type==='atk'||cm.move.type==='stance')&&cm.move.trigger===c.lv&&stunRemaining(f)!=null&&stunRemaining(f)<=BAL.CMD.buffer){
        f.cmdBufMove=cm.move;f.cmdBufIdx=cm.idx; // コマンド先行入力(v0.11 §6.9)
      }else{f.buf={lv:c.lv};f.bufF=BAL.BUF;}
    }
  }
  if(f.phase==='idle'&&held){
    f.phase='guard';f.pf=0;f.guardLv=held;
  }else if(f.phase==='guard'&&!held){
    f.phase='idle';f.pf=0;f.guardLv=null;
  }
}
function tryBuf(f){
  if(!f.buf)return;
  f.bufF--;
  if(f.bufF<=0){f.buf=null;return;}
  if(f.ult>=BAL.ULT.stock){f.buf=null;return;}
  if(f.phase==='idle'){startAtk(f,f.buf.lv,false);f.buf=null;}
  else if(canChain(f,f.buf.lv)){startAtk(f,f.buf.lv,true);f.buf=null;}
}
function advance(f){
  f.pf++;
  if(f.phase==='attack'||f.phase==='cmdAtk'){
    const A=spec(f),t=f.pf,total=A.s+A.a+A.r;
    const maxLunge=(f.cmdMove&&f.cmdMove.fwd!=null)?f.cmdMove.fwd:142; // コマンド技の前進距離(§6.8。指定無しは通常技と同じ142)
    if(t<=A.s+A.a)f.lunge=maxLunge*Math.min(1,t/A.s);
    else f.lunge=maxLunge*Math.max(0,1-(t-A.s-A.a)/A.r);
    if(t>=total){
      if(!f.hasHit)gainS(f,'whiff');
      f.pf=0;f.atkLv=null;f.combo=0;f.lunge=0;f.cmdMove=null;f.cmdIdx=null;resolveToIdle(f);
    }
  }else if(f.phase==='cmdStance'){ // 巌の構え等: stanceF内は無敵(下記attackResolveで処理)。時間切れは空振り扱いで終了
    if(f.cmdMove&&f.pf>=f.cmdMove.stanceF){f.pf=0;f.cmdMove=null;f.cmdIdx=null;resolveToIdle(f);}
  }else if(f.phase==='roar'){
    const R=BAL.ROAR;
    if(f.pf>=R.s+R.a+R.r){f.pf=0;resolveToIdle(f);}
  }else if(f.phase==='grab'){
    if(f.pf>grabStartup(f)+BAL.GRAB.a+2){f.phase='grabrec';f.pf=0;}
  }else if(f.phase==='grabrec'){
    if(f.pf>=BAL.GRAB.rec){f.pf=0;f.cmdMove=null;f.cmdIdx=null;resolveToIdle(f);}
  }else if(f.phase==='grabHit'){
    const opp=B.p[1-f.side];
    if(f.pf===19&&opp.phase==='grabbed'){ // 叩きつけ
      const dmg=Math.round((f.cmdMove?f.cmdMove.d:BAL.GRAB.d)*f.c.dMul); // コマンド投げ(v0.10)はdmgをcmdMoveから取る
      opp.hp-=dmg;gainFocus(opp,dmg*BAL.FOCUS.gainDmgMul);
      opp.phase='hitstun';opp.pf=0;opp.stunDur=BAL.GRAB.stun;opp.kb=34;opp.cmdBufMove=null;opp.cmdBufIdx=null;
      fxDmg(opp,dmg,(f.cmdMove&&f.cmdMove.color)||'#ffb6ff');fxBurst(opp.baseX,opp.y-40);
      sfx((f.cmdMove&&f.cmdMove.se)||'slam');B.shake=11;B.hitstop=Math.max(B.hitstop,6);
      gainSAmt(f,10);
      if(opp.hp<=0){opp.hp=0;startKO(opp.side);}
    }
    if(f.pf>=BAL.GRAB.seq){f.pf=0;f.cmdMove=null;f.cmdIdx=null;resolveToIdle(f);}
  }else if(f.phase==='grabbed'){
    if(f.pf>40){f.pf=0;resolveToIdle(f);}
  }else if(f.phase==='hitstun'){
    if(f.pf>=f.stunDur){f.pf=0;resolveToIdle(f);}
  }else if(f.phase==='blockstun'){
    if(f.pf>=f.stunDur){
      f.pf=0;
      if(f.held){f.phase='guard';f.guardLv=f.held;f.cmdBufMove=null;f.cmdBufIdx=null;} // ガードへ復帰する場合は先行入力を破棄(idleからの発動ルールのため)
      else resolveToIdle(f);
    }
  }else if(f.phase==='mikiriRec'){ // 見切り空振り: ガード不能の硬直
    if(f.pf>=BAL.MIKIRI.whiff){f.pf=0;resolveToIdle(f);}
  }else if(f.phase==='dodge'){ // 回避: 1-10F判定 / 11-22F戻り。位置は変えない
    if(f.pf>=BAL.DODGE.totalF){f.pf=0;f.dodgeType=null;resolveToIdle(f);}
  }else if(f.phase==='down'){ // ダウン: 追撃1発を受けたら以後は無敵のまま起き上がりへ
    if(f.pf>=BAL.DOWN.downF){f.phase='wake';f.pf=0;}
  }else if(f.phase==='wake'){ // 起き上がり20F全身無敵→強制起き上がり(起き攻め不可)
    if(f.pf>=BAL.DOWN.wakeF){f.pf=0;f.downHitUsed=false;resolveToIdle(f);}
  }else if(f.phase==='dizzy'){
    if(f.pf>=BAL.DIZZY){f.pf=0;f.guard=BAL.GRECOVER;resolveToIdle(f);}
  }
}
function striking(f){
  if((f.phase!=='attack'&&f.phase!=='cmdAtk')||f.hasHit||!f.atkLv)return false;
  const A=spec(f);
  return f.pf>A.s&&f.pf<=A.s+A.a;
}
function roarStriking(f){return f.phase==='roar'&&f.pf===BAL.ROAR.s+1;}
function gainUltStock(f){f.ult=Math.min(BAL.ULT.stock,f.ult+1);f.ultFlash=40;} // 奥義ストック+1(ギュイーン勝利/咆哮クリーンヒット共通)
function resolveHits(){
  const a=B.p[0],b=B.p[1];
  const as=striking(a),bs=striking(b);
  if(as&&bs){
    a.hasHit=true;b.hasHit=true;
    if(a.atkLv===b.atkLv){startClash('trade');return;} // 同段相打ち→競り合い
    // 異段の同時ヒットは両者とも独立成立させる。先にatkLv(+コマンド技情報)を退避しておく
    // (1回目のhitApplyがdef.atkLv=nullで相手の攻撃情報を消してしまい、
    //  2回目の呼び出しでspec()が例外を投げていた既存バグの修正。挙動は変えない)
    const aLv=a.atkLv,bLv=b.atkLv;
    const aCm=(a.phase==='cmdAtk')?a.cmdMove:null,bCm=(b.phase==='cmdAtk')?b.cmdMove:null;
    hitApply(a,b,a.counterReadyF>0,aLv,aCm);if(B.flow!=='fight')return;
    hitApply(b,a,b.counterReadyF>0,bLv,bCm);return;
  }
  const ar=roarStriking(a),br=roarStriking(b);
  if(ar&&br){ // 咆哮相打ち: 双方クリーンヒット扱いで奥義ストック+1(v2.3)
    const d=BAL.ROAR.d;
    a.hp-=d;b.hp-=d;gainFocus(a,d*BAL.FOCUS.gainDmgMul);gainFocus(b,d*BAL.FOCUS.gainDmgMul);
    gainUltStock(a);gainUltStock(b);
    for(const f of B.p){f.phase='hitstun';f.pf=0;f.stunDur=BAL.ROAR.stun;f.kb=30;f.atkLv=null;f.cmdBufMove=null;f.cmdBufIdx=null;}
    fxDmg(a,d,'#ff8040');fxDmg(b,d,'#ff8040');sfx('roar');fxRoarImg(a.c.id);fxRoarImg(b.c.id);
    B.shake=10;B.hitstop=BAL.HITSTOP.roar;
    if(a.hp<=0)a.hp=0;if(b.hp<=0)b.hp=0;
    if(a.hp===0||b.hp===0)startKO(a.hp===0?0:1);
    return;
  }
  if(as){a.hasHit=true;attackResolve(a,b);if(B.flow!=='fight')return;}
  if(bs){b.hasHit=true;attackResolve(b,a);if(B.flow!=='fight')return;}
  if(ar){roarResolve(a,b);if(B.flow!=='fight')return;}
  if(br){roarResolve(b,a);if(B.flow!=='fight')return;}
  const ag=grabStriking(a),bg=grabStriking(b);
  if(ag&&bg){startClash('grab');return;} // つかみ合い→ギュイーン
  if(ag){grabResolve(a,b);if(B.flow!=='fight')return;}
  if(bg){grabResolve(b,a);}
}
function nearClash(att,def){ // 同段をほぼ同時に振り合ったらギュイーン（相殺緩和）
  if(def.phase!=='attack'||def.atkLv!==att.atkLv||def.hasHit)return false;
  return def.pf>=spec(def).s-BAL.CLASH.near;
}
function isDowned(f){return f.phase==='down'||f.phase==='wake';}
function handleIfDowned(att,def,dmgBase){ // ダウン連: 1発だけ×0.5で追撃可、以後(起き上がり含め)完全無敵
  if(!isDowned(def))return false;
  if(def.phase==='down'&&!def.downHitUsed){
    def.downHitUsed=true;
    const dmg=Math.round(dmgBase*BAL.DOWN.followupMul*att.c.dMul);
    def.hp-=dmg;gainFocus(def,dmg*BAL.FOCUS.gainDmgMul);
    fxDmg(def,dmg,'#ffb6ff');fxSpark(def,att.atkLv||'mid',0);sfx('hit');
    B.hitstop=Math.max(B.hitstop,BAL.HITSTOP.mid);B.shake=Math.max(B.shake,5);
    if(def.hp<=0){def.hp=0;startKO(def.side);}
  }
  return true;
}
const DODGE_TABLE={ // 03 §6.6の三すくみ(避ける/通常被弾/カウンター被弾)
  crouch:{beats:'high',normal:'mid',counter:'low'},
  sway:{beats:'mid',normal:'low',counter:'high'},
  lunge:{beats:'low',normal:'high',counter:'mid'}
};
function dodgeActive(f){return f.phase==='dodge'&&f.pf>=1&&f.pf<=BAL.DODGE.judgeF;}
function attackResolve(att,def){
  if(handleIfDowned(att,def,spec(att).d))return;
  if(def.phase==='cmdStance'&&def.cmdMove&&def.pf>=1&&def.pf<=def.cmdMove.stanceF){
    // 巌の構え等(v0.10): 構え成立中は相手の攻撃を無効化し、即座に反撃(construction技のcounterDmg)を与える
    const m=def.cmdMove,dmg=Math.round(m.counterDmg*def.c.dMul);
    att.hp-=dmg;gainFocus(att,dmg*BAL.FOCUS.gainDmgMul);
    att.phase='hitstun';att.pf=0;att.stunDur=BAL.HITSTUN[m.counterLv]||24;att.combo=0;att.kb=20;att.cmdBufMove=null;att.cmdBufIdx=null;
    att.atkLv=null;att.guardLv=null;att.buf=null;
    fxDmg(att,dmg,m.color||'#ffd23f');fxSpark(att,m.counterLv,0);
    B.fx.push({k:'counter',x:att.baseX,y:relY(att,1.005),f:0,dur:38});
    gainSAmt(def,BAL.CLASH.winS);gainUltStock(def);
    sfx(m.se||'hit2');B.shake=10;B.hitstop=BAL.HITSTOP[m.counterLv]||9;
    def.phase='idle';def.pf=0;def.cmdMove=null;def.cmdIdx=null;
    if(att.hp<=0){att.hp=0;startKO(att.side);}
    return;
  }
  if(dodgeActive(def)){
    const rule=DODGE_TABLE[def.dodgeType];
    if(rule.beats===att.atkLv){ // 回避成功: 攻撃側はスカ扱い、防御側はcounterReadyを獲得
      def.counterReadyF=BAL.DODGE.counterReadyF;
      if(def.dodgeType==='lunge')def.clinchF=BAL.DODGE.clinchF; // 踏み込み成功→追加で密着12F
      B.fx.push({k:'suki',x:fpos(att),y:relY(att,0.908),f:0,dur:20});
      sfx('whiffG');
      return;
    }
    if(rule.counter===att.atkLv){ // カウンター被弾(通常よりダメージが伸びる)
      hitApply(att,def,true);
      return;
    }
    // rule.normal===att.atkLv: 回避は機能せず通常ヒットへフォールスルー
  }
  if(nearClash(att,def)){att.hasHit=true;def.hasHit=true;startClash('trade');return;}
  const guarded=(def.phase==='guard')||(def.phase==='blockstun'&&def.held); // 統一ガード: 全段ふせぐ
  if(guarded){
    const cm2=(att.phase==='cmdAtk')?att.cmdMove:null; // コマンド技(v0.10): 表の「被ガードN」「削りN」が既定値と異なる技のみ上書き
    def.phase='blockstun';def.pf=0;def.stunDur=BAL.BLOCKSTUN[att.atkLv];def.kb=6;
    def.guard-=(cm2&&cm2.guardDmg!=null)?cm2.guardDmg:BAL.GDMG_A;
    if(att.atkLv==='low'){ // 下段は被ガードでも削り10(コマンド技は個別のguardChip優先)
      const chip=(cm2&&cm2.guardChip!=null)?cm2.guardChip:BAL.CHIP_LOW;
      def.hp-=chip;gainFocus(def,chip*BAL.FOCUS.gainDmgMul);
      if(def.hp<=0){def.hp=0;startKO(def.side);return;}
    }
    gainS(att,'aBlk');gainS(def,'gOk');gainFocus(def,BAL.FOCUS.gainGuard);
    const A2=spec(att),rem=A2.s+A2.a+A2.r-att.pf;
    if(rem>6)B.fx.push({k:'suki',x:fpos(att),y:relY(att,0.908),f:0,dur:rem});
    fxSpark(def,att.atkLv,1);sfx('guard');
    B.hitstop=Math.max(B.hitstop,2);
    if(def.guard<=0)doBreak(def);
    return;
  }
  hitApply(att,def,att.counterReadyF>0);
}
function hitApply(att,def,counterHit,lvOverride,cmdOverride){
  // lvOverride/cmdOverride: 異段の同時ヒット処理(resolveHits)専用。2回目の呼び出し時点でatt.atkLv/
  // att.cmdMoveが1回目の呼び出し(defとして被弾)によりnull化・phase変化している場合があるため、
  // 呼び出し側が事前に退避しておいた値を明示的に渡す。通常の単発ヒットではatt自身の状態がそのまま
  // 使われ、挙動は従来と同一。
  const lv=(lvOverride!=null)?lvOverride:att.atkLv;
  const cm=(cmdOverride!==undefined)?cmdOverride:((att.phase==='cmdAtk')?att.cmdMove:null); // コマンド技(v0.10)
  const A=cm?specForCmd(att,cm):specForLv(att,lv);
  // カウンター始動のコンボは、以後のチェーンも含めて[1,1,0.9]に緩和(§6.6コンボルートB)
  const scale=(counterHit||att.comboCounter)?BAL.DODGE.counterScale:BAL.SCALE;
  let dmg=Math.round(A.d*scale[Math.min(att.combo,2)]);
  if(counterHit){
    const counterMul=(cm&&cm.counterMul!=null)?cm.counterMul:BAL.DODGE.counterMul; // 昇撃等: 技専用の倍率(§6.8)
    dmg=Math.round(dmg*counterMul);att.comboCounter=true;
  }
  if(lv==='high'&&att.clinchF>0)dmg+=BAL.DODGE.clinchHighBonus; // 密着中は上段+15
  let counterFx=!!counterHit;
  if(def.phase==='grab'||def.phase==='grabrec'){ // 打撃はつかみに勝つ(既存の別カウンター)
    dmg=Math.round(dmg*BAL.GRAB.counterMul);
    counterFx=true;
  }
  if(counterFx)B.fx.push({k:'counter',x:def.baseX,y:relY(def,1.005),f:0,dur:38});
  const cmArmorF=(def.phase==='grab'&&def.cmdMove&&def.cmdMove.armor)?def.cmdMove.armor:0; // 山掴み等: 投げ側のアーマー(§6.8)
  if(def.phase==='roar'&&def.pf<=BAL.ROAR.armor){ // 咆哮アーマー
    dmg=Math.round(dmg*0.5);def.hp-=dmg;gainS(att,'aBlk');gainFocus(def,dmg*BAL.FOCUS.gainDmgMul);
    fxDmg(def,dmg,'#ffb020');fxSpark(def,lv,0);sfx('hit');
    B.hitstop=Math.max(B.hitstop,BAL.HITSTOP[lv]);B.shake=Math.max(B.shake,4);
  }else if(cmArmorF&&def.pf<=cmArmorF){ // コマンド投げのアーマー: 進行中の投げ自体は継続する
    dmg=Math.round(dmg*0.5);def.hp-=dmg;gainS(att,'aBlk');gainFocus(def,dmg*BAL.FOCUS.gainDmgMul);
    fxDmg(def,dmg,'#ffb020');fxSpark(def,lv,0);sfx('hit');
    B.hitstop=Math.max(B.hitstop,BAL.HITSTOP[lv]);B.shake=Math.max(B.shake,4);
  }else{
    def.hp-=dmg;gainFocus(def,dmg*BAL.FOCUS.gainDmgMul);
    def.atkLv=null;def.guardLv=null;def.buf=null;
    att.combo++;
    gainSAmt(att,BAL.SG.aHitC[Math.min(att.combo-1,2)]);gainS(def,'got');
    fxDmg(def,dmg,cm&&cm.color||'#ffffff');fxSpark(def,lv,0);
    if(A.down){ // 下段: ダウンを奪う大技（スマブラ式ダウン連へ）
      def.phase='down';def.pf=0;def.downHitUsed=false;def.combo=0;def.kb=20;def.cmdBufMove=null;def.cmdBufIdx=null;
      sfx(cm&&cm.se||'hit2');B.hitstop=Math.max(B.hitstop,BAL.HITSTOP.low);B.shake=Math.max(B.shake,8);
    }else{
      def.phase='hitstun';def.pf=0;def.stunDur=BAL.HITSTUN[lv]||22;def.combo=0;def.kb=11;def.cmdBufMove=null;def.cmdBufIdx=null;
      sfx(cm&&cm.se||(att.combo>=2?'hit2':'hit'));
      B.hitstop=Math.max(B.hitstop,BAL.HITSTOP[lv]);B.shake=Math.max(B.shake,5);
    }
  }
  if(def.hp<=0){def.hp=0;startKO(def.side);}
}
function roarResolve(att,def){
  const R=BAL.ROAR;
  if(handleIfDowned(att,def,R.d))return;
  sfx('roar');fxWave(att);fxRoarImg(att.c.id);
  if(def.phase==='guard'||(def.phase==='blockstun'&&def.held)){ // 全段ガード可・大削り
    def.guard-=BAL.GDMG_S;def.hp-=BAL.CHIP_S;gainFocus(def,BAL.CHIP_S*BAL.FOCUS.gainDmgMul+BAL.FOCUS.gainGuard);
    def.phase='blockstun';def.pf=0;def.stunDur=16;def.kb=20;
    gainS(att,'aBlk');fxSpark(def,'mid',1);
    B.shake=Math.max(B.shake,8);B.hitstop=Math.max(B.hitstop,BAL.HITSTOP.roar);
    if(def.guard<=0)doBreak(def);
  }else if(def.phase==='roar'&&def.pf<=R.armor){
    const d=Math.round(R.d*0.5);def.hp-=d;gainS(att,'aBlk');gainFocus(def,d*BAL.FOCUS.gainDmgMul);
    fxDmg(def,d,'#ffb020');B.shake=Math.max(B.shake,6);
  }else{ // 咆哮クリーンヒット(被ガード/アーマー減衰以外): 奥義ストック+1(v2.3)
    def.hp-=R.d;gainFocus(def,R.d*BAL.FOCUS.gainDmgMul);
    def.phase='hitstun';def.pf=0;def.stunDur=R.stun;def.cmdBufMove=null;def.cmdBufIdx=null;
    def.atkLv=null;def.guardLv=null;def.buf=null;def.combo=0;def.kb=34;
    gainS(att,'aHit');gainS(def,'got');gainUltStock(att);
    fxDmg(def,R.d,'#ff8040');fxSpark(def,'mid',0,true); // 咆哮ヒット=大スパーク
    B.shake=Math.max(B.shake,10);B.hitstop=Math.max(B.hitstop,BAL.HITSTOP.roar);
  }
  if(def.hp<=0){def.hp=0;startKO(def.side);}
}
function grabStartup(f){return f.grabS;} // 発生F値はつかみ開始時点でスナップショット済み(密着中は12→10)
function grabStriking(f){return f.phase==='grab'&&f.pf===grabStartup(f)+1;}
function grabResolve(att,def){
  if(handleIfDowned(att,def,att.cmdMove?att.cmdMove.d:BAL.GRAB.d))return; // コマンド投げ(v0.10)はdmgをcmdMoveから取る
  if(def.phase==='grab'){startClash('grab');return;} // つかみ同士→ギュイーン
  const ok=def.phase==='guard'||def.phase==='blockstun'||def.phase==='idle'
    ||def.phase==='dizzy'||def.phase==='mikiriRec'||def.phase==='dodge' // 回避はつかみを防げない
    ||(def.phase==='roar'&&def.pf<=BAL.ROAR.armor);
  if(ok){ // つかみ成立（ガードくずし）
    att.phase='grabHit';att.pf=0;
    def.phase='grabbed';def.pf=0;def.atkLv=null;def.guardLv=null;def.buf=null;def.combo=0;def.kb=0;
    sfx('grab');
  }else{ // 打撃・攻撃中の相手には潰される
    att.phase='grabrec';att.pf=0;
    B.fx.push({k:'suki',x:fpos(att),y:relY(att,0.908),f:0,dur:BAL.GRAB.rec});
    sfx('whiffG');
  }
}
function doBreak(def){
  def.guard=0;def.phase='dizzy';def.pf=0;def.guardLv=null;def.buf=null;
  announce('ガードブレイク!!',60,42,'#ff9500');sfx('break');
  B.shake=Math.max(B.shake,9);fxStars(def);
}

/* ================= 競り合い ================= */
function startClash(kind){
  B.flow='clash';B.flowF=0;
  for(const f of B.p){
    f.phase='clash';f.pf=0;f.atkLv=null;f.guardLv=null;f.buf=null;
    f.lunge=0;f.kb=0;f.combo=0;
  }
  B.clash={phase:'in',f:0,mg:pickMinigame(),pick:[null,null],cpuAt:25+((rng()*45)|0), // cpuAtはオフライン時のみ使用
    kind:kind,winner:-2,
    rendaP:0,rendaC:0,p0hits:0,p1hits:0,p0target:null,p1target:null,cpuNextAt:0};
  B.hitstop=0;
  sfx('guiin');
  announce(kind==='mikiri'?'見切った!!':(kind==='grab'?'つかみ合い!!':'競り合い!!'),46,44,'#ffe14d');
}
function pickMinigame(){ // BAL.MINIGAME.weightsに従って抽選
  const w=BAL.MINIGAME.weights;let acc=0,r=rng();
  for(const k of MINIGAME_ORDER){acc+=w[k];if(r<acc)return k;}
  return MINIGAME_ORDER[MINIGAME_ORDER.length-1];
}
function clashRouletteText(c){ // 突入26F中、高速切替→最後の6Fで確定表示
  const lockAt=BAL.CLASH.inF-6;
  if(c.f>=lockAt)return MINIGAME_NAME[c.mg];
  return MINIGAME_NAME[MINIGAME_ORDER[Math.floor(c.f/3)%MINIGAME_ORDER.length]];
}
function clashBtns(){return[ // 三角配置は現行のまま。中身をジャンケンに置き換え
  {c:'guu',x:W/2,y:PT+150,col:'#ffd23f',label:'グー'},
  {c:'choki',x:W-118,y:PT+352,col:'#ff5a5a',label:'チョキ'},
  {c:'paa',x:118,y:PT+352,col:'#5ab2ff',label:'パー'}];}
function clashHit(p){
  const bs=clashBtns();
  for(const b of bs)if(Math.hypot(p.x-b.x,p.y-b.y)<=96)return b.c;
  return null;
}
function clashStep(cmds0,cmds1){ // cmds0/cmds1: オンライン時のみ(ロックステップ入力バッファ経由のミニゲームコマンド)。オフラインはundefinedのまま無視される
  const c=B.clash;c.f++;
  if(c.phase==='in'){
    if(c.f>=BAL.CLASH.inF){
      c.phase='select';c.f=0;
      if(c.mg==='hayauchi'){
        c.p0target=randHayauchiTarget();
        if(onlineActive()){
          c.p1target=randHayauchiTarget(); // オンライン: 両者とも実タップで狙う的を個別に持つ(位置は共有rng生成で決定論)
        }else{
          const hf=curDiff().hayauchiF;
          c.cpuNextAt=hf[0]+((rng()*(hf[1]-hf[0]+1))|0);
        }
      }
    }
  }else if(c.phase==='select'){
    if(c.mg==='renda')stepRenda(c,cmds0,cmds1);
    else if(c.mg==='hayauchi')stepHayauchi(c,cmds0,cmds1);
    else stepJyanken(c,cmds0,cmds1);
  }else if(c.phase==='reveal'){
    if(c.f===BAL.CLASH.revealHitF){
      if(c.mg==='jyanken')resolveJyankenPicks(c);
      applyClashResult(c);
    }
    if(c.f>=BAL.CLASH.revealHitF+BAL.CLASH.revealF)endClash();
  }
}
function stepJyanken(c,cmds0,cmds1){
  if(onlineActive()){ // オンライン: 両者ともロックステップ入力バッファ経由の実タップ(mgPick)で決める
    if(c.pick[0]===null&&cmds0)for(const cm of cmds0)if(cm.t==='mgPick'){c.pick[0]=cm.choice;break;}
    if(c.pick[1]===null&&cmds1)for(const cm of cmds1)if(cm.t==='mgPick'){c.pick[1]=cm.choice;break;}
    if(c.f>=BAL.CLASH.sel){ // 〆切までに未選択ならランダム確定(両クライアントで同一)
      if(c.pick[0]===null)c.pick[0]=CHOICES[(rng()*3)|0];
      if(c.pick[1]===null)c.pick[1]=CHOICES[(rng()*3)|0];
    }
    if(c.pick[0]!==null&&c.pick[1]!==null){c.phase='reveal';c.f=0;}
    return;
  }
  if(c.pick[1]===null&&c.f>=c.cpuAt)c.pick[1]=CHOICES[(rng()*3)|0];
  if(c.f>=BAL.CLASH.sel){
    if(c.pick[0]===null)c.pick[0]=CHOICES[(rng()*3)|0];
    if(c.pick[1]===null)c.pick[1]=CHOICES[(rng()*3)|0];
  }
  if(c.pick[0]!==null&&c.pick[1]!==null){c.phase='reveal';c.f=0;}
}
function resolveJyankenPicks(c){ // 手の組み合わせ→勝者(あいこ=-1)を判定するだけ
  const x=c.pick[0],y=c.pick[1];
  c.winner=(x===y)?-1:(BEATS[x]===y?0:1);
}
function stepRenda(c,cmds0,cmds1){ // 120Fのタップ連打綱引き。オンラインは実タップ(ロックステップ入力)集計/オフラインはCPU自動加算(難易度別)
  const R=BAL.MINIGAME.RENDA;
  if(onlineActive()){ // 両者とも同期された入力列から同一計算(タップ自体の演出はpressRoute側で即時反映済み)
    if(cmds0)for(const cm of cmds0)if(cm.t==='mgTap')c.rendaP+=R.tapGain;
    if(cmds1)for(const cm of cmds1)if(cm.t==='mgTap')c.rendaC+=R.tapGain;
  }else{
    const D=curDiff();
    c.rendaC+=D.rendaCpuMin+rng()*D.rendaCpuRng;
  }
  if(c.f>=R.durationF){
    c.winner=(c.rendaP===c.rendaC)?-1:(c.rendaP>c.rendaC?0:1);
    c.phase='reveal';c.f=0;
  }
}
function randHayauchiTarget(){ // パッド内のランダム位置(端は避ける)
  return{x:70+rng()*(W-140),y:PT+110+rng()*(H-PT-160)};
}
function stepHayauchi(c,cmds0,cmds1){ // 的あて連続タップ。オンラインは実タップ(ロックステップ入力)判定/オフラインはCPU自動撃破(難易度別)
  const H2=BAL.MINIGAME.HAYAUCHI;
  if(onlineActive()){ // 「何Fに何個目を撃ったか」はmgHitコマンドの到着タイミング自体が表す。的の出現位置は共有rngで生成し両者一致
    if(cmds0)for(const cm of cmds0)if(cm.t==='mgHit'&&c.p0hits<H2.targets){c.p0hits++;c.p0target=(c.p0hits<H2.targets)?randHayauchiTarget():null;}
    if(cmds1)for(const cm of cmds1)if(cm.t==='mgHit'&&c.p1hits<H2.targets){c.p1hits++;c.p1target=(c.p1hits<H2.targets)?randHayauchiTarget():null;}
  }else{
    const hf=curDiff().hayauchiF;
    if(c.p1hits<H2.targets&&c.f>=c.cpuNextAt){
      c.p1hits++;
      c.cpuNextAt=c.f+hf[0]+((rng()*(hf[1]-hf[0]+1))|0);
    }
  }
  if(c.p0hits>=H2.targets||c.p1hits>=H2.targets||c.f>=H2.capF){
    c.winner=(c.p0hits===c.p1hits)?-1:(c.p0hits>c.p1hits?0:1);
    c.p0target=null;c.p1target=null;c.phase='reveal';c.f=0;
  }
}
function applyClashResult(c){ // 3ミニゲーム共通のリワード適用(旧resolveClashの後半を流用)
  if(c.winner===-1){
    announce('あいこ! しきりなおし',44,34,'#dddddd');
    for(const f of B.p)f.kb=14;
    sfx('guard');return;
  }
  const w=c.winner,win=B.p[w],lose=B.p[1-w];
  B.clashStreak[w]++;B.clashStreak[1-w]=0;
  const stk=B.clashStreak[w];
  const dmg=BAL.CLASH.d+BAL.CLASH.streakBonus*(stk-1); // 連勝で押し切り
  lose.hp-=dmg;lose.kb=44;gainFocus(lose,dmg*BAL.FOCUS.gainDmgMul);
  gainUltStock(win);
  gainSAmt(win,BAL.CLASH.winS);
  fxDmg(lose,dmg,'#ffe14d');
  fxBurst(W/2,336);
  sfx('hit2');B.shake=12;B.hitstop=BAL.HITSTOP.clash;
  announce(w===0?'せりかち!!':'まけた…',44,42,w===0?'#7CFC00':'#ff6b6b');
  if(stk>=2)announce(stk+'連勝!! おしきり!!',50,30,'#ff9e2c');
  if(lose.hp<=0){lose.hp=0;B.pendKO=lose.side;}
  else if(win.ult>=BAL.ULT.stock)announce('奥義スタンバイ!!',56,34,'#ff2d78');
}
function endClash(){
  const c=B.clash;B.clash=null;
  for(const f of B.p){if(f.phase==='clash'){f.phase='idle';f.pf=0;}}
  if(c.winner>=0){
    const lose=B.p[1-c.winner];
    lose.phase='hitstun';lose.pf=0;lose.stunDur=BAL.CLASH.loserStun;lose.cmdBufMove=null;lose.cmdBufIdx=null; // 勝者は追撃1発確定
    if(c.winner===0)announce('追撃チャンス!!',40,30,'#7CFC00');
  }
  B.flow='fight';
  if(B.pendKO>=0){const s2=B.pendKO;B.pendKO=-1;startKO(s2);}
  if(B.p[1].ult>=BAL.ULT.stock)ai.ultT=0;
}

/* ================= 奥義 ================= */
function fireUlt(side){
  B.flow='ultCine';B.flowF=0;B.ultUser=side;
  const att=B.p[side];
  att.phase='ultAtk';att.pf=0;att.lunge=0;
  sfx('ult');
}
function ultStep(){
  B.flowF++;
  const att=B.p[B.ultUser],def=B.p[1-B.ultUser];
  if(B.flowF===BAL.ULT.impact){
    const dmg=Math.round(BAL.ULT.d*att.c.dMul);
    def.hp-=dmg;att.ult=0;gainFocus(def,dmg*BAL.FOCUS.gainDmgMul);
    def.phase='hitstun';def.pf=0;def.stunDur=46;def.kb=46;def.cmdBufMove=null;def.cmdBufIdx=null;
    def.atkLv=null;def.guardLv=null;def.buf=null;def.combo=0;
    fxDmg(def,dmg,'#ff2d78');fxBurst(def.baseX,330);
    sfx('ultHit');B.shake=18;
    if(def.hp<=0){def.hp=0;B.pendKO=def.side;}
  }
  if(B.flowF>=BAL.ULT.total){
    att.phase='idle';att.pf=0;B.flow='fight';
    if(B.pendKO>=0){const s2=B.pendKO;B.pendKO=-1;startKO(s2);}
  }
}

/* ================= KO / タイムアップ ================= */
function startKO(side){
  B.flow='ko';B.flowF=0;B.koSide=side;B.clash=null;B.pendKO=-1;
  B.p[side].phase='ko';B.p[side].pf=0;
  B.p[1-side].phase='win';B.p[1-side].pf=0;
  announce('K.O.',96,84,'#ff3b30');sfx('ko');B.shake=14;
}
function finishRound(){
  const w=1-B.koSide;B.wins[w]++;
  if(B.wins[w]>=BAL.WINS){B.flow='matchEnd';B.flowF=0;B.result=(w===0)?'WIN':'LOSE';}
  else{B.flow='roundEnd';B.flowF=0;}
}
function timeUp(){
  announce('TIME UP',70,48,'#ffffff');sfx('ko');
  const a=B.p[0].hp,b=B.p[1].hp;
  if(a===b){
    B.wins[0]++;B.wins[1]++;
    if(B.wins[0]>=BAL.WINS&&B.wins[1]>=BAL.WINS){B.flow='matchEnd';B.flowF=0;B.result='DRAW';return;}
    if(B.wins[0]>=BAL.WINS){B.flow='matchEnd';B.flowF=0;B.result='WIN';return;}
    if(B.wins[1]>=BAL.WINS){B.flow='matchEnd';B.flowF=0;B.result='LOSE';return;}
    B.flow='roundEnd';B.flowF=0;return;
  }
  const w=(a>b)?0:1;
  B.wins[w]++;
  B.p[w].phase='win';B.p[w].pf=0;
  B.p[1-w].phase='ko';B.p[1-w].pf=0;
  if(B.wins[w]>=BAL.WINS){B.flow='matchEnd';B.flowF=0;B.result=(w===0)?'WIN':'LOSE';}
  else{B.flow='roundEnd';B.flowF=0;}
}

/* ================= CPU AI ================= */
const cpuEv=[];
let aiDifficulty='NORMAL'; // EASY/NORMAL/HARD。キャラ選択画面で変更・セッション中保持(明示的にリセットしない)
function curDiff(){return BAL.AIDIFF[onlineActive()?'NORMAL':aiDifficulty];} // オンライン中はローカルのaiDifficulty設定に関わらずNORMAL固定(両クライアントのrng消費を一致させ決定性を維持)
const LEVEL_TO_DODGE={high:'crouch',mid:'sway',low:'lunge'}; // その段を避ける回避(DODGE_TABLE.beatsの逆引き)
const DIR_TO_DODGE_KIND={left:'sway',down:'crouch',right:'lunge'}; // BAL.CMD.seqの方向文字列→dodgeコマンドのkind(DODGE_DIRの逆引き、v0.10 (3))
const ai={think:0,guardT:0,guardOn:false,react:null,ultT:0,hist:[],mash:0,pHoldF:0,mikiriAt:null,dodgeAt:null,dodgeKind:null,cmdQueue:[]};
function aiReset(){
  ai.think=30;ai.guardT=0;ai.guardOn=false;ai.react=null;ai.ultT=0;
  ai.hist=[];ai.mash=0;ai.pHoldF=0;ai.mikiriAt=null;ai.dodgeAt=null;ai.dodgeKind=null;ai.cmdQueue=[];
}
function aiQueueCommandMove(me){ // コマンド技(v0.10 (3)): 方向2つ+トリガーを予約し、人間の連続タップと同じ入力経路(cpuEv)で発火させる
  // 1つ目の方向入力は実際の回避(BAL.DODGE.totalF=22F)を伴うため、idleに復帰する直後(dir1から23F後、
  // 24Fバッファに収まる最終タイミング)でトリガーを送る。2つ目の方向は回避演技中でもdirBufには積まれる。
  const moves=BAL.CMD.moves[me.c.id];
  if(!moves||!moves.length)return;
  const idx=(rng()*moves.length)|0,mv=moves[idx],dir1At=B.f+1;
  ai.cmdQueue.push({at:dir1At,cmd:{t:'dodge',kind:DIR_TO_DODGE_KIND[mv.seq[0]]}});
  ai.cmdQueue.push({at:dir1At+1,cmd:{t:'dodge',kind:DIR_TO_DODGE_KIND[mv.seq[1]]}});
  ai.cmdQueue.push({at:dir1At+BAL.DODGE.totalF+1,cmd:(mv.type==='grab')?{t:'grab'}:{t:'atk',lv:mv.trigger}});
}
function aiStep(){
  const me=B.p[1],you=B.p[0];
  const D=curDiff();
  if(me.ult>=BAL.ULT.stock){
    ai.guardOn=false;ai.ultT++;
    if(ai.ultT>30&&actionable(me))cpuEv.push({t:'ult'});
    return;
  }
  // 観測: プレイヤーの攻撃を記録して反応 / テレグラフを見て差し込み or 見切りを狙う
  if(you.phase==='attack'&&you.pf===1){
    ai.hist.push({lv:you.atkLv,f:B.f});
    if(ai.hist.length>14)ai.hist.shift();
    ai.react={at:B.f+11+((rng()*6)|0),lv:you.atkLv};
    const tg=BAL.TELEGRAPH[you.atkLv]; // テレグラフが長い(=見てから対応しやすい)ほど差し込み精度が上がる
    const cw=(0.16+Math.min(0.3,ai.mash*0.05)+(tg-BAL.TELEGRAPH.mid)*0.012)*D.reactMul; // 難易度の反応正解率
    if(me.phase==='idle'&&rng()<cw){
      cpuEv.push({t:'atk',lv:you.atkLv});ai.react=null;
    }else if(me.phase==='idle'&&ai.mikiriAt==null&&rng()<D.mikiriRate){ // 見切り試行(完璧な精度ではない)
      const win=(me.hp<=BAL.PINCH_HP)?BAL.MIKIRI.windowPinch:BAL.MIKIRI.window;
      ai.mikiriAt=B.f+spec(you).s+Math.round((rng()*2-1)*win*2);
      ai.react=null;
    }else if(me.phase==='idle'&&ai.dodgeAt==null&&rng()<D.dodgeRate){ // 回避試行: テレグラフを見て正解の回避を狙うが、見切り同様タイミングにブレを入れる
      const contact=B.f+spec(you).s; // 接触(pf=s+1)までの残りF
      const jitter=Math.round((rng()*2-1)*BAL.DODGE.judgeF);
      ai.dodgeAt=contact-5+jitter; // 判定窓(1-10F)の中央付近を狙うが外すこともある
      ai.dodgeKind=LEVEL_TO_DODGE[you.atkLv];
      ai.react=null;
    }
  }
  if(ai.mikiriAt!=null&&B.f>=ai.mikiriAt){cpuEv.push({t:'mikiri'});ai.mikiriAt=null;}
  if(ai.dodgeAt!=null&&B.f>=ai.dodgeAt){cpuEv.push({t:'dodge',kind:ai.dodgeKind});ai.dodgeAt=null;}
  while(ai.cmdQueue.length&&B.f>=ai.cmdQueue[0].at)cpuEv.push(ai.cmdQueue.shift().cmd); // 予約済みコマンド技入力の発火(v0.10 (3))
  // ダウン連追撃: 難易度別の実行率で1発叩き込む(EASY=しない/NORMAL=50%/HARD=常に)
  if(you.phase==='down'&&!you.downHitUsed&&me.phase==='idle'&&rng()<D.downFollowup){
    cpuEv.push({t:'atk',lv:'mid'});
  }
  // つかみ返し: 相手のつかみを見たらつかみ合いへ
  if(you.phase==='grab'&&you.pf===1&&me.phase==='guard'&&rng()<0.3){
    ai.guardOn=false;ai.guardT=0;cpuEv.push({t:'grab'});
  }
  ai.mash=0;
  for(const h of ai.hist)if(B.f-h.f<100)ai.mash++;
  ai.pHoldF=(you.phase==='guard')?ai.pHoldF+1:0;
  // 被ガード確反
  if(me.phase==='blockstun'&&me.pf===Math.max(1,me.stunDur-4)&&rng()<0.9){
    ai.guardOn=false;ai.guardT=0;
    cpuEv.push({t:'atk',lv:rng()<0.7?'mid':LEVELS[(rng()*3)|0]});
  }
  // ガードブレイク追撃（打撃 or 投げ）
  if(you.phase==='dizzy'&&me.phase==='idle'&&you.pf<BAL.DIZZY-30){
    cpuEv.push(rng()<0.35?{t:'grab'}:{t:'atk',lv:'mid'});
  }
  // 咆哮バースト
  if(me.s>=BAL.SMAX&&me.phase==='hitstun'&&you.combo>=2&&rng()<0.08)cpuEv.push({t:'roar'});
  // 反応行動: 統一ガードで守りが機能する
  if(ai.react&&B.f>=ai.react.at){
    const r=ai.react;ai.react=null;
    if(me.phase==='idle'){
      const gp=(0.45+Math.min(0.35,ai.mash*0.05))*D.reactMul; // 難易度の反応正解率
      if(rng()<gp){ai.guardOn=true;ai.guardT=24+((rng()*20)|0);}
      else if(rng()<0.2)cpuEv.push({t:'atk',lv:LEVELS[(rng()*3)|0]});
    }
  }
  if(ai.guardT>0){ai.guardT--;if(ai.guardT<=0)ai.guardOn=false;}
  // ガードから崩し返し（たまに投げに切替）
  if(me.phase==='guard'&&rng()<0.006){ai.guardOn=false;ai.guardT=0;cpuEv.push({t:'grab'});}
  // チェーン継続（軽→重ルート準拠）
  if(me.phase==='attack'&&me.hasHit&&me.combo<BAL.CMAX&&me.atkLv){
    const A=spec(me);
    if(me.pf===A.s+A.a+2&&rng()<0.75){
      const nxt=LEVELS.filter(function(l){return BAL.ATK[l].w>BAL.ATK[me.atkLv].w;});
      if(nxt.length)cpuEv.push({t:'atk',lv:nxt[(rng()*nxt.length)|0]});
    }
  }
  // ガード硬め対策: つかみ本命 / S咆哮
  if(ai.pHoldF>30&&me.phase==='idle'){
    if(rng()<0.5){cpuEv.push({t:'grab'});ai.pHoldF=0;}
    else if(me.s>=BAL.SMAX&&rng()<0.5){cpuEv.push({t:'roar'});ai.pHoldF=0;}
  }
  // 通常思考
  if(me.phase==='idle'&&!ai.guardOn){
    ai.think--;
    if(ai.think<=0){
      ai.think=14+((rng()*12)|0);
      const roll=rng();
      const focusThreat=D.focusRestraint&&you.focus>=BAL.FOCUS.max; // 相手の集中が満タン→打撃を振ると即返される。攻めを控える(EASYは自重しない)
      const aggr=Math.max(0.1,0.36-ai.mash*0.03-(focusThreat?0.16:0))*D.atkFreqMul; // 難易度別の攻撃頻度
      const grabW=0.1+(focusThreat?0.14:0); // つかみは"発生"扱いされず集中を誘発しないため踏み込みやすい
      const gsel=0.24+Math.min(0.3,ai.mash*0.04);
      if(roll<aggr){
        if(ai.cmdQueue.length===0&&rng()<D.cmdMoveRate){ // 難易度別のコマンド技使用率(v0.10 (3): EASY=ほぼ不使用/NORMAL=たまに/HARD=積極的)
          aiQueueCommandMove(me);
        }else{
          const rw=rng();
          cpuEv.push({t:'atk',lv:rw<0.34?'high':(rw<0.72?'mid':'low')});
        }
      }else if(roll<aggr+grabW){
        cpuEv.push({t:'grab'});
      }else if(roll<aggr+grabW+gsel){
        ai.guardOn=true;ai.guardT=24+((rng()*24)|0);
      }
      if(me.s>=BAL.SMAX&&rng()<0.3)cpuEv.push({t:'roar'});
    }
  }
}

/* ================= ロジック ================= */
function logic(){
  if(onlineActive()){netLogicTick();return;}
  B.f++;stepFx();
  if(B.hitstop>0){B.hitstop--;return;}
  if(B.flow==='intro'){
    evq.length=0;B.flowF++;
    if(B.flowF===58){announce('FIGHT!',44,64,'#ff5a3c');sfx('fight');}
    if(B.flowF>=70){B.flow='fight';B.fightStartF=B.f;} // ラウンド開始時刻(YOUマーカーの強調2秒判定用、v0.10 (8))
  }else if(B.flow==='fight'){
    fightStep();
  }else if(B.flow==='clash'){
    evq.length=0;clashStep();
  }else if(B.flow==='ultCine'){
    evq.length=0;ultStep();
  }else if(B.flow==='ko'){
    evq.length=0;B.flowF++;
    if(B.flowF>=120)finishRound();
  }else if(B.flow==='roundEnd'){
    evq.length=0;B.flowF++;
    if(B.flowF>=80){B.round++;roundInit(false);}
  }else if(B.flow==='matchEnd'){
    evq.length=0;B.flowF++;
    if(B.flowF>=80){B.ann.length=0;game.screen='result';}
  }
}
/* ---- オンライン専用ロジック(ロックステップ) ----
 * B.flow全体(fight/clash/ultCine/ko/roundEnd/matchEnd)を、両者の入力コマンドが
 * 揃ったFのみ1F進める。揃わない間は"同期中…"としてB状態を一切変更しない
 * (競り合いミニゲームの内部乱数消費もこの1Fに紐づくため、両クライアントで完全に一致する)。
 */
function netCaptureAndSend(){ // 毎ロジック呼び出しで必ず1回だけ採取・送信する(待機中の再試行による二重送信を防ぐ)
  const cmds=evq.slice();evq.length=0;
  const held=currentP1Hold();
  const f=NET.capTick+NET.delayF;
  NET.localQ[f]={cmds:cmds,hold:held};
  netSend({t:'cmd',f:f,cmds:cmds,hold:held,matchSeq:NET.matchSeq});
  NET.capTick++;
}
function netLogicTick(){
  netCaptureAndSend();
  const f=NET.simF;
  const haveLocal=Object.prototype.hasOwnProperty.call(NET.localQ,f);
  const havePeer=Object.prototype.hasOwnProperty.call(NET.peerQ,f);
  if(!(haveLocal&&havePeer)){NET.waiting=true;NET.waitingF++;return;} // 相手の入力がまだ届いていない→このFは進めない(タイマーも減らさない)
  NET.waiting=false;NET.waitingF=0;
  const local=NET.localQ[f],peer=NET.peerQ[f];
  delete NET.localQ[f];delete NET.peerQ[f];
  const cmds0=online.slot===0?local.cmds:peer.cmds,hold0=online.slot===0?local.hold:peer.hold;
  const cmds1=online.slot===1?local.cmds:peer.cmds,hold1=online.slot===1?local.hold:peer.hold;
  NET.simF++;
  B.f++;stepFx();
  if(B.hitstop>0){B.hitstop--;return;}
  if(B.flow==='intro'){
    B.flowF++;
    if(B.flowF===58){announce('FIGHT!',44,64,'#ff5a3c');sfx('fight');}
    if(B.flowF>=70){B.flow='fight';B.fightStartF=B.f;} // ラウンド開始時刻(YOUマーカーの強調2秒判定用、v0.10 (8))
  }else if(B.flow==='fight'){
    netFightStep(cmds0,hold0,cmds1,hold1);
  }else if(B.flow==='clash'){
    clashStep(cmds0,cmds1);
  }else if(B.flow==='ultCine'){
    ultStep();
  }else if(B.flow==='ko'){
    B.flowF++;
    if(B.flowF>=120)finishRound();
  }else if(B.flow==='roundEnd'){
    B.flowF++;
    if(B.flowF>=80){B.round++;roundInit(false);}
  }else if(B.flow==='matchEnd'){
    B.flowF++;
    if(B.flowF>=80){
      B.ann.length=0;game.screen='result';NET.active=false;
      resultShownAt=performance.now();resultAdvanced=false; // v0.9.2: 勝敗表示を最低180F(3秒)保持してから次戦へ進める
    }
  }
}
function netFightStep(cmds0,hold0,cmds1,hold1){ // fightStep()のオンライン版(CPU AI/evq/cpuEvは使わない)
  B.timer--;
  const p1=B.p[0],p2=B.p[1];
  applyInputs(p1,p2,cmds0,hold0);
  if(B.flow!=='fight')return;
  applyInputs(p2,p1,cmds1,hold1);
  if(B.flow!=='fight')return;
  advance(p1);advance(p2);
  if(B.flow!=='fight')return;
  checkFocusTrigger(p1,p2);checkFocusTrigger(p2,p1);
  tryBuf(p1);tryBuf(p2);
  resolveHits();
  if(B.flow!=='fight')return;
  for(const f of B.p){
    if(f.phase!=='guard'&&f.phase!=='blockstun'&&f.phase!=='dizzy')
      f.guard=Math.min(f.c.gMax,f.guard+BAL.GREGEN);
    f.kb*=0.86;if(f.kb<0.5)f.kb=0;
    if(f.sNo>0)f.sNo--;
    if(f.phase!=='dodge'){
      if(f.counterReadyF>0)f.counterReadyF--;
      if(f.clinchF>0)f.clinchF--;
    }
  }
  if(B.timer<=0)timeUp();
}
function fightStep(){
  B.timer--;
  aiStep();
  const p1=B.p[0],p2=B.p[1];
  p1Hold=currentP1Hold();
  applyInputs(p1,p2,evq,p1Hold);
  if(B.flow!=='fight'){evq.length=0;cpuEv.length=0;return;}
  applyInputs(p2,p1,cpuEv,ai.guardOn?'mid':null);
  evq.length=0;cpuEv.length=0;
  if(B.flow!=='fight')return;
  advance(p1);advance(p2);
  if(B.flow!=='fight')return;
  checkFocusTrigger(p1,p2);checkFocusTrigger(p2,p1);
  tryBuf(p1);tryBuf(p2);
  resolveHits();
  if(B.flow!=='fight')return;
  for(const f of B.p){
    if(f.phase!=='guard'&&f.phase!=='blockstun'&&f.phase!=='dizzy')
      f.guard=Math.min(f.c.gMax,f.guard+BAL.GREGEN);
    f.kb*=0.86;if(f.kb<0.5)f.kb=0;
    if(f.sNo>0)f.sNo--;
    if(f.phase!=='dodge'){ // counterReady/密着は回避の戻りモーション中は消費せず、動けるようになってから起算
      if(f.counterReadyF>0)f.counterReadyF--;
      if(f.clinchF>0)f.clinchF--;
    }
  }
  if(B.timer<=0)timeUp();
}

/* ================= 入力（見合いと交差 v2.0） ================= */
const evq=[];
let p1Hold=null,padPress=null,tstate=null;
let dragRow=1,lastThrownRow=1; // 右ゾーン: 現在ドラッグ中の段 / 直前に投げた段（残像ガイド用）
let grabBtnFlashAt=0; // つかみボタン押下の一時ハイライト用タイムスタンプ
let dirBtnFlashAt=0,dirBtnFlashKind=null; // 方向ボタン押下の一時ハイライト用(§6.8 v2.5)
function toL(cx2,cy2){
  const r=cv.getBoundingClientRect();
  return{x:(cx2-r.left)/vScale,y:(cy2-r.top)/vScale};
}
const GRAB_BTN={r:55,cx:70,cy:PT+70}; // つかみボタン(直径110px・左上=Lトリガー位置イメージ、§6.8 v2.5)
function inGrabBtn(p){const dx=p.x-GRAB_BTN.cx,dy=p.y-GRAB_BTN.cy;return dx*dx+dy*dy<=GRAB_BTN.r*GRAB_BTN.r;}
const DIR_BTN_ARROW={sway:'←',crouch:'↓',lunge:'→'}; // 画像未読込時の図形フォールバック用
const DIR_BTN_ASSET={sway:'dirbtn_left',crouch:'dirbtn_down',lunge:'dirbtn_right'}; // 回避モーションの影絵アイコン(v0.11 §6.9)
function leftLowerRect(){ // 左ゾーン下半分(方向ボタン用の矩形)
  const y0=PT+(H-PT)/2;
  return{x:10,y:y0+8,w:W/2-20,h:(H-PT)/2-16};
}
function dirBtnRects(){ // ←↓→の3方向ボタン(上なし十字キー、§6.8 v2.5)
  const r=leftLowerRect(),bw=r.w/3;
  return[
    {dir:'sway',x:r.x,y:r.y,w:bw,h:r.h},
    {dir:'crouch',x:r.x+bw,y:r.y,w:bw,h:r.h},
    {dir:'lunge',x:r.x+bw*2,y:r.y,w:bw,h:r.h}
  ];
}
function inDirBtn(p){
  for(const b of dirBtnRects())if(inRect(p,b.x,b.y,b.w,b.h))return b;
  return null;
}
function rowAt(py,prevRow){ // 段境界±20pxスナップ（誤爆防止）
  const rh=(H-PT)/3;
  let r=Math.min(2,Math.max(0,Math.floor((py-PT)/rh)));
  if(prevRow!=null&&r!==prevRow){
    const b=PT+Math.max(r,prevRow)*rh;
    if(Math.abs(py-b)<20)r=prevRow;
  }
  return r;
}
function pressRoute(p){
  audioInit();
  if(game.screen==='title'){
    if(inRect(p,ONLINE_BTN.x,ONLINE_BTN.y,ONLINE_BTN.w,ONLINE_BTN.h)){sfx('tap');onlineReset();game.screen='onlineLobby';return null;}
    sfx('tap');game.screen='select';return null;
  }
  if(game.screen==='select'){selectPress(p);return null;}
  if(game.screen==='result'){resultPress(p);return null;}
  if(game.screen==='onlineLobby'){onlineLobbyPress(p);return null;}
  if(game.screen==='onlineSelect'){onlineSelectPress(p);return null;}
  if(game.screen==='onlineInterrupted'){onlineInterruptedPress(p);return null;}
  if(game.screen==='pause'){pausePress(p);return null;}
  if(game.screen==='movelist'){movelistPress(p);return null;}
  if(game.screen!=='battle'||!B)return null;
  if(inRect(p,PAUSE_BTN.x,PAUSE_BTN.y,PAUSE_BTN.w,PAUSE_BTN.h)){ // 右上「II」: 高さ別攻撃等より先に判定(§6.8 v2.5)
    sfx('tap');pauseConfirmingQuit=false;game.screen='pause';return null;
  }
  if(B.flow==='clash'&&B.clash&&B.clash.phase==='select'){
    // オンライン中は実際のタップをロックステップ入力バッファ(evq)経由のコマンドとして送信し、
    // 両クライアントが同一の同期入力列から決定論的に勝敗を計算する(v0.9.1)。
    // ローカル演出(sfx/fx)はここで即時反映してよいが、勝敗判定に使うカウント/選択自体は
    // netLogicTick→clashStep→stepRenda/stepHayauchi/stepJyankenが同期Fで両者同一に確定させる。
    const cl=B.clash,netOn=onlineActive(),myIdx=netOn?online.slot:0;
    if(cl.mg==='renda'){
      if(netOn)evq.push({t:'mgTap'});else cl.rendaP+=BAL.MINIGAME.RENDA.tapGain; // 連打はタップ位置を問わない
      B.fx.push({k:'burst',x:p.x,y:p.y,f:0,dur:14}); // タップごとの火花演出
      sfx('tap');
    }else if(cl.mg==='hayauchi'){
      const tgt=netOn?(myIdx===0?cl.p0target:cl.p1target):cl.p0target,H2=BAL.MINIGAME.HAYAUCHI;
      if(tgt&&Math.hypot(p.x-tgt.x,p.y-tgt.y)<=H2.radius){
        sfx('tap');
        B.fx.push({k:'burst',x:tgt.x,y:tgt.y,f:0,dur:16});
        if(netOn){evq.push({t:'mgHit'});}
        else if(cl.p0hits<H2.targets){
          cl.p0hits++;
          cl.p0target=(cl.p0hits<H2.targets)?randHayauchiTarget():null;
        }
      }
    }else{
      const c=clashHit(p);
      if(c){
        sfx('tap');
        if(netOn){if(cl.pick[myIdx]===null)evq.push({t:'mgPick',choice:c});}
        else if(cl.pick[0]===null)cl.pick[0]=c;
      }
    }
    return null;
  }
  if(p.y<PT)return null;
  const myF=onlineActive()?B.p[online.slot]:B.p[0]; // オンライン中は自分のスロット側の奥義ストックを見る
  if(myF.ult>=BAL.ULT.stock){
    if(B.flow==='fight'){evq.push({t:'ult'});sfx('tap');}
    return null;
  }
  if(B.flow!=='fight'&&B.flow!=='intro')return null;
  if(inGrabBtn(p)){ // つかみボタン: 左上(Lトリガー位置)。左ゾーン判定より先に判定(§6.8 v2.5)
    evq.push({t:'grab'});sfx('tap');grabBtnFlashAt=performance.now();
    return null;
  }
  if(p.x<W/2){ // 左ゾーン上半分: ホールド=ガード / ジャストタップ=見切り。下半分: ←↓→方向ボタン
    const db=inDirBtn(p);
    if(db){ // 方向ボタンは即時発火・24F入力バッファに積む(回避フリックは廃止、§6.8 v2.5)
      evq.push({t:'dodge',kind:db.dir});sfx('tap');dirBtnFlashAt=performance.now();dirBtnFlashKind=db.dir;
      return null;
    }
    padPress={zone:'L'};
    return 'L';
  }
  dragRow=rowAt(p.y,dragRow); // 右ゾーン: 高さ=段。発火はリリース時
  padPress={zone:'R',row:dragRow};
  return 'R';
}
function onDown(id,x,y){
  if(tstate)return;
  const p=toL(x,y);
  const zone=pressRoute(p);
  tstate=(zone==='L'||zone==='R')?{id:id,x0:p.x,y0:p.y,yNow:p.y,t0:performance.now(),zone:zone,resolved:false}:null;
}
function flickDir(dx,dy,ms){ // 有効なフリックの方向を1つ返す('left'/'right'/'up'/'down'/null)
  if(ms>BAL.FLICK_MS)return null;
  if(Math.abs(dx)>=BAL.FLICK_DX&&Math.abs(dx)>Math.abs(dy)*1.2)return dx>0?'right':'left';
  if(Math.abs(dy)>=BAL.FLICK_DX&&Math.abs(dy)>Math.abs(dx)*1.2)return dy>0?'down':'up';
  return null;
}
function onMove(id,x,y){
  if(!tstate||tstate.id!==id||tstate.resolved)return;
  const p=toL(x,y);
  tstate.yNow=p.y;
  const dx=p.x-tstate.x0,dy=p.y-tstate.y0;
  const ms=performance.now()-tstate.t0;
  const dir=flickDir(dx,dy,ms);
  if(tstate.zone==='R'){ // 右ゾーン: →フリック=咆哮（つかみ・方向は専用ボタンへ移動、§6.8 v2.5）
    dragRow=rowAt(p.y,dragRow);padPress={zone:'R',row:dragRow};
    if(dir==='right'){evq.push({t:'roar'});tstate.resolved=true;padPress=null;}
  }
}
function onUp(id){
  if(!tstate||tstate.id!==id){tstate=null;padPress=null;p1Hold=null;return;}
  if(!tstate.resolved){
    if(tstate.zone==='R'){
      const row=rowAt(tstate.yNow,dragRow);
      evq.push({t:'atk',lv:LEVELS[row]});
      lastThrownRow=row;
    }else if(tstate.zone==='L'){
      if(performance.now()-tstate.t0<=BAL.JUST_TAP_MS)evq.push({t:'mikiri'});
    }
  }
  p1Hold=null;tstate=null;padPress=null;
}
function currentP1Hold(){ // 左ゾーンを100ms超ホールド中＝ガード（未満はジャストタップ=見切り判定に回す）
  if(tstate&&tstate.zone==='L'&&!tstate.resolved&&performance.now()-tstate.t0>=BAL.JUST_TAP_MS)return 'guard';
  return null;
}

function fpos(f){
  const face=f.side===0?1:-1;
  if(B&&B.flow==='clash'&&B.clash){
    const c=B.clash,tgt=f.side===0?W/2-48:W/2+48;
    if(c.phase==='in'){const t=Math.min(1,c.f/BAL.CLASH.inF);return f.baseX+(tgt-f.baseX)*t;}
    if(c.phase==='select')return tgt+Math.sin(game.frame*0.9+f.side*3)*3;
    if(c.f<BAL.CLASH.revealHitF)return tgt+Math.sin(game.frame*1.3+f.side*3)*4;
    const t2=Math.min(1,(c.f-BAL.CLASH.revealHitF)/30);
    let x=tgt+(f.baseX-tgt)*t2;
    if(c.winner===f.side)x+=22*(1-t2)*face;
    else if(c.winner>=0)x-=f.kb*face*t2;
    return x;
  }
  return f.baseX+f.lunge*face-f.kb*face;
}
function rYouMarker(){ // オンライン: 自キャラの頭上に「YOU」+▼(§6.8 v2.5(8))。位置はSPRITE_Hに追従、開始2秒は強調
  const myF=B.p[online.slot];
  const [mx,my]=fighterXY(myF);
  const headY=my-BAL.SPRITE_H[myF.c.id]*1.02; // 表示身長基準の頭上オフセット(体格差に追従)
  const big=B.flow==='fight'&&(B.f-B.fightStartF)<120; // ラウンド開始2秒(120F)だけ大きく強調
  const scl=big?1.6:1;
  ctx.save();
  ctx.globalAlpha=big?1:0.82;
  ctx.fillStyle='#ffd23f';ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(mx,headY+12*scl);ctx.lineTo(mx-8*scl,headY);ctx.lineTo(mx+8*scl,headY);ctx.closePath();
  ctx.fill();ctx.stroke();
  ctx.restore();
  txt('YOU',mx,headY-13*scl,big?26:15,'#ffd23f');
}
function fighterXY(f){
  if(f.phase==='grabbed'){
    const g=B.p[1-f.side],face=g.side===0?1:-1;
    const gx0=fpos(g)+46*face,t=g.pf;
    let xx=f.baseX,yy=f.y;
    if(t<=8){const k=t/8;xx=f.baseX+(gx0-f.baseX)*k;}
    else if(t<=18){xx=gx0;yy=f.y-74*Math.min(1,(t-8)/10);}
    else{xx=gx0;yy=f.y-74+74*Math.min(1,(t-18)/2);}
    return[xx,yy];
  }
  return[fpos(f),f.y];
}

/* ================= ポーズ算出/描画の分離 =================
 * poseId(f)で現在ポーズを一意なIDに算出し、SPRITES[charId][poseId]（アセット
 * 読み込みセクションで登録）に画像があればdrawImage、無ければ現行の図形描画
 * (drawFighterShape)にフォールバックする。ギュイーン(競り合い)演出は専用の
 * スプライトを持たないため、意図的に図形描画のまま(変更しない)。
 */
function poseId(f){ // POSE_IDS(20種)の正準名を返す。該当スプライトが無い状態は
  const P=f.phase,t=f.pf;      // 意図的にPOSE_IDS外の文字列を返し図形描画へフォールバックさせる
  if(P==='attack'&&f.atkLv==='crouch')return 'crouch_atk'; // しゃがみ突き(§6.6)。crouchポーズが構え(テレグラフ)を兼ねる
  if((P==='attack'||P==='cmdAtk')&&f.atkLv){
    const tg=BAL.TELEGRAPH[f.atkLv];
    if(t<=tg)return 'tele_'+f.atkLv; // テレグラフ=tele_*(コマンド技も通常段のtele_*を流用、§6.8)
    return(P==='cmdAtk'&&f.cmdIdx!=null)?('cmd'+(f.cmdIdx+1)):('atk_'+f.atkLv); // コマンド技は発生後cmd1〜3(§6.8 v2.5.1)
  }
  if(P==='cmdStance')return(f.cmdIdx!=null)?('cmd'+(f.cmdIdx+1)):'guard'; // 巌の構え等: 構え中も専用ポーズを表示
  if(P==='dodge')return f.dodgeType; // 'crouch'|'sway'|'lunge'（画像未配置。図形フォールバックはdrawFighterShapeに実装済み）
  if(P==='roar'){
    const R=BAL.ROAR;
    return(t<=R.s)?'roar_charge':'roar';
  }
  if(P==='grab')return f.cmdMove&&f.cmdIdx!=null?('cmd'+(f.cmdIdx+1)):'grab_reach'; // コマンド投げの構え(§6.8)
  if(P==='grabHit')return f.cmdMove&&f.cmdIdx!=null?('cmd'+(f.cmdIdx+1)):'grab_lift';
  if(P==='grabbed')return 'grabbed';
  if(P==='grabrec')return 'hurt';          // つかみ空振り→hurtを流用
  if(P==='mikiriRec')return 'mikiri';      // 見切り=mikiri（成功時はclashへ即遷移するため空振りのみ表示対象）
  if(P==='down')return 'down';             // ダウン=down（追撃消化後の無敵も同一ポーズ）
  if(P==='wake')return 'getup';            // 起き上がり=getup
  if(P==='clash'){                         // ギュイーン(競り合い): ミニゲーム別にスプライトを流用
    if(B&&B.clash&&B.clash.mg==='renda')return 'grab_reach'; // レンダ中の両者=押し合い
    return 'idle';                         // ジャンケン・ハヤウチ中=idle
  }
  if(P==='ultAtk')return(B&&B.flowF<BAL.ULT.impact)?'ult_charge':'atk_high'; // 発動後はatk_highを流用
  if(P==='dizzy')return 'hurt';            // ふらつき→hurtを流用
  if(P==='ko')return 'ko';
  if(P==='win')return 'win';
  if(P==='guard'||P==='blockstun')return 'guard';
  if(P==='hitstun')return 'hurt';
  return 'idle';
}
function rFighter(f,ox,oy){ // ポーズ画像があればdrawImage、無ければ図形描画にフォールバック
  const sp=SPRITES[f.c.id]&&SPRITES[f.c.id][poseId(f)];
  if(sp&&sp.ready&&!sp.failed){drawSpriteFighter(f,ox,oy,sp);return;}
  drawFighterShape(f,ox,oy);
}
const SPRITE_IDLE_H_FALLBACK={moguzo:520,pisuke:352,godan:536}; // idle実測が不可(file://等でcanvas汚染)な場合のみ使うフォールバック値(v0.9 PR4: サイズ調整版idle差し替えに合わせ再実測)
function spriteScale(charId){ // 表示倍率=目標身長(BAL.SPRITE_H)/idle.pngの実測キャラ高(alpha bboxの高さ)。全ポーズ同倍率で統一
  const idleE=SPRITES[charId]&&SPRITES[charId].idle;
  const idleH=(idleE&&idleE.bboxH)||SPRITE_IDLE_H_FALLBACK[charId];
  return BAL.SPRITE_H[charId]/idleH;
}
function dodgeSpriteOffset(f){ // 回避スプライト用: 11-22Fの戻り区間だけ同画像を構え位置へ向けて位置補間する
  const D=BAL.DODGE,back=f.pf<=D.judgeF?0:Math.min(1,(f.pf-D.judgeF)/(D.totalF-D.judgeF));
  if(f.dodgeType==='crouch')return[0,10*back];   // しゃがみ→起き上がる分だけ上へ戻す
  if(f.dodgeType==='sway')return[-14*back,-4*back]; // スウェー→後傾を起こしつつ前へ戻す
  return[14*back,0];                                // lunge→前傾を起こしつつ後ろへ戻す
}
function drawStatusRings(f,bodyY,bw,bh){ // 無敵(ダウン連消化後〜起き上がり)/counterReady・密着リング

  const gf=game.frame;
  if((f.phase==='down'&&f.downHitUsed)||f.phase==='wake'){
    ctx.save();ctx.globalAlpha=0.4+0.3*Math.sin(gf*0.3);

    ctx.save();ctx.globalAlpha=0.4+0.3*Math.sin(gf*0.4);

function drawSpriteFighter(f,ox,oy,sp){

  // 集中スロー・ズームは呼び出し側(rBattle/fpos)の変換をそのまま受けるため追加対応不要
  const x=(ox!=null)?ox:fpos(f),gy=(oy!=null)?oy:f.y,face=f.side===0?1:-1;
  const img=sp.canvas||sp.img,iw=sp.img.naturalWidth,ih=sp.img.naturalHeight;
  const scale=spriteScale(f.c.id); // idle基準の実測倍率(動的計測。全ポーズ同倍率で統一)
  const w=iw*scale,h=ih*scale;

  ctx.beginPath();ctx.ellipse(x,gy+5,42,9,0,0,TAU);ctx.fill();

  if(f.phase==='dodge'){ // 回避: 1-10F判定はポーズ画像そのまま、11-22F戻りは同画像を構えへ向けて位置補間

    const A=spec(f),t=f.pf;

  const H2=BAL.SPRITE_H[f.c.id];

function rResult(){
  ctx.fillStyle='rgba(10,10,16,0.78)';ctx.fillRect(0,0,W,H);
  const r=B?B.result:'-';
  const winSide=(r==='WIN')?0:((r==='LOSE')?1:-1); // B.resultは常にB.p[0]視点(WIN=p0勝ち)。オンラインでは自分のslotと比較して表示を分ける
  const iWon=lastMatchOnline?(winSide===online.slot):(winSide===0);
  const col=(winSide<0)?'#ffd23f':(iWon?'#7CFC00':'#ff6b6b');
  const label=(winSide<0)?'DRAW':(iWon?'YOU WIN!!':'YOU LOSE...');
  if(winSide>=0){ // 勝者の立ち絵(画像が無ければ何も足さず現行のテキストのみ)
    const winnerId=(winSide===0)?CHARS[game.p1].id:CHARS[game.p2].id;
    drawStanding('standing_'+winnerId,W/2,522,308*BAL.PORTRAIT_RATIO[winnerId]); // 体格比を適用(§6.6 v2.4.1)
  }
  txt(label,W/2,280,62,col);
  txt(CHARS[game.p1].name+'  vs  '+CHARS[game.p2].name+(lastMatchOnline?'':'(CPU)'),W/2,362,22,'#cfd6e6');
  if(lastMatchOnline){
    // v0.9.2: 最低RESULT_HOLD_MIN_MS(180F/3秒)は保持し、以降タップで次戦へ(8秒で自動進行)
    const held=performance.now()-resultShownAt,ready=held>=RESULT_HOLD_MIN_MS;
    const rem=Math.max(0,Math.ceil((RESULT_HOLD_MAX_MS-held)/1000));
    txt(ready?'タップですすむ':('あと'+Math.ceil((RESULT_HOLD_MIN_MS-held)/1000)+'秒…'),W/2,600,22,ready?'#ffe14d':'#8891a6');
    txt(rem+'秒後に自動で次へ',W/2,632,14,'#8891a6');
  }else{
    btn(60,560,W-120,88,'もういちど たたかう');
    btn(60,676,W-120,88,'キャラをえらぶ');
  }
}
function btn(x,y,w,h,label){
  ctx.fillStyle='#2b3350';rr(x,y,w,h,20);ctx.fill();
  ctx.strokeStyle='#7fa2ff';ctx.lineWidth=3;rr(x,y,w,h,20);ctx.stroke();
  txt(label,x+w/2,y+h/2,28,'#fff');
}
function rPauseOverlay(){ // 戦闘中右上「II」→ポーズ画面(§6.8 v2.5)
  ctx.fillStyle='rgba(8,8,14,0.82)';ctx.fillRect(0,0,W,H);
  txt('ポーズ',W/2,220,40,'#ffd23f');
  if(pauseConfirmingQuit){
    txt(onlineActive()?'対戦を中断してタイトルへ戻りますか？':'タイトルへ戻りますか？',W/2,420,20,'#ffe6a3');
    btn(PAUSE_CONFIRM_RECT.yes.x,PAUSE_CONFIRM_RECT.yes.y,PAUSE_CONFIRM_RECT.yes.w,PAUSE_CONFIRM_RECT.yes.h,'はい');
    btn(PAUSE_CONFIRM_RECT.no.x,PAUSE_CONFIRM_RECT.no.y,PAUSE_CONFIRM_RECT.no.w,PAUSE_CONFIRM_RECT.no.h,'いいえ');
    return;
  }
  if(onlineActive()){ // オンライン中は「タイトルへ(切断)」のみ(§6.8 v2.5)
    btn(PAUSE_RECT.quit.x,PAUSE_RECT.quit.y,PAUSE_RECT.quit.w,PAUSE_RECT.quit.h,'タイトルへ（切断）');
    return;
  }
  btn(PAUSE_RECT.resume.x,PAUSE_RECT.resume.y,PAUSE_RECT.resume.w,PAUSE_RECT.resume.h,'つづける');
  btn(PAUSE_RECT.movelist.x,PAUSE_RECT.movelist.y,PAUSE_RECT.movelist.w,PAUSE_RECT.movelist.h,'わざ表');
  btn(PAUSE_RECT.quit.x,PAUSE_RECT.quit.y,PAUSE_RECT.quit.w,PAUSE_RECT.quit.h,'タイトルへ');
}
function rMovelistOverlay(){ // わざ表=使用キャラのコマンド技3種+基本コンボ4ルート(§6.8/§6.6)
  ctx.fillStyle='rgba(8,8,14,0.94)';ctx.fillRect(0,0,W,H);
  const myF=onlineActive()?B.p[online.slot]:B.p[0];
  txt('わざ表 - '+myF.c.name,W/2,52,28,'#ffd23f');
  txt('コマンド技',60,90,17,'#7fd8ff','left');
  const moves=BAL.CMD.moves[myF.c.id]||[];
  let y=104;
  for(let i=0;i<moves.length;i++){
    const m=moves[i];
    const seqStr=m.seq.map(function(d){return DIR_ARROW[d];}).join('')+'＋'+(m.type==='grab'?'つかみ':LV_LABEL[m.trigger]);
    ctx.fillStyle='#232a3d';rr(50,y,W-100,66,14);ctx.fill();
    ctx.strokeStyle='#3a4560';ctx.lineWidth=2;rr(50,y,W-100,66,14);ctx.stroke();
    txt(seqStr,74,y+26,19,'#ffd23f','left');
    txt(m.name,74,y+50,16,'#fff','left');
    txt('dmg'+Math.round(m.d),W-70,y+38,15,'#ffb6b6','right');
    y+=76;
  }
  y+=8;
  txt('基本コンボ 4ルート',60,y+18,17,'#7fd8ff','left');
  y+=32;
  for(const r of COMBO_ROUTES){
    ctx.fillStyle='#1c2233';rr(50,y,W-100,58,12);ctx.fill();
    ctx.strokeStyle='#33394f';ctx.lineWidth=2;rr(50,y,W-100,58,12);ctx.stroke();

    txt(r.note+' / dmg'+r.dmg,74,y+44,12,'#9aa2b8','left');
    y+=64;

  btn(MOVELIST_BACK_RECT.x,MOVELIST_BACK_RECT.y,MOVELIST_BACK_RECT.w,MOVELIST_BACK_RECT.h,'もどる');
}
function rOnlineLobby(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1d2436');g.addColorStop(1,'#171a22');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  }else if(online.state==='waiting'){
    txt('ルームコード',W/2,380,18,'#aab3c8');
    txt(online.code||'----',W/2,460,72,'#ffd23f');
    txt('このコードを相手に伝え、「コードで参加」してもらってください',W/2,540,14,'#cfd6e6');
    if(game.frame%60<38)txt('対戦相手を待っています…',W/2,580,18,'#ffe6a3');
  }else if(online.state==='ready'){
    txt('対戦相手が見つかりました！',W/2,420,26,'#7CFC00');
    txt('ルームコード: '+(online.code||'----'),W/2,470,18,'#ffd23f');
    txt('あなたは'+(online.slot<2?('P'+(online.slot+1)):'観戦者')+'です',W/2,506,16,'#cfd6e6');

function rOnlineSelect(){
  const g=ctx.createLinearGradient(0,0,0,H);

  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  txt('キャラクターをえらぶ(オンライン)',W/2,84,30,'#ffd23f');
  txt('ルームコード: '+(online.code||'----')+' / あなたはP'+(online.slot+1),W/2,124,15,'#aab3c8');
  for(let i=0;i<3;i++){
    const R2=selRect(i),picked=(online.myPick===i);
    ctx.fillStyle=picked?'#3a4560':'#232a3d';rr(R2.x,R2.y,R2.w,R2.h,18);ctx.fill();
    ctx.strokeStyle=picked?'#ffd23f':'#3a4560';ctx.lineWidth=picked?3:2;rr(R2.x,R2.y,R2.w,R2.h,18);ctx.stroke();
    demoF.c=CHARS[i];
    const pcx=R2.x+90,tx=R2.x+180,px2=R2.x+264;
    if(!drawStanding('standing_'+CHARS[i].id,pcx,R2.y+R2.h-4,140*BAL.PORTRAIT_RATIO[CHARS[i].id]))rFighter(demoF,pcx,R2.y+R2.h-22);
    txt(CHARS[i].name,tx,R2.y+46,31,'#fff','left');
    txt(CHARS[i].type,tx,R2.y+80,19,'#ffd23f','left');
    const st=[['ちから',CHARS[i].pips.p],['はやさ',CHARS[i].pips.s],['まもり',CHARS[i].pips.g]];
    for(let j=0;j<3;j++){
      txt(st[j][0],tx,R2.y+112+j*26,15,'#9aa2b8','left');
      for(let k=0;k<5;k++){
        ctx.fillStyle=(k<st[j][1])?'#ffd23f':'#39415a';
        ctx.beginPath();ctx.arc(px2+k*22,R2.y+112+j*26,6.5,0,TAU);ctx.fill();
      }
    }
  }
  if(online.myPick!=null&&online.peerPick==null){
    txt('相手の選択を待っています…',W/2,850,18,'#ffe6a3');
  }
}
function rOnlineInterrupted(){
  ctx.fillStyle='rgba(10,10,16,0.92)';ctx.fillRect(0,0,W,H);
  txt('通信が切断されました',W/2,420,30,'#ff6b6b');
  txt(online.errorMsg||'対戦が中断されました',W/2,466,16,'#ffb3b3');
  btn(ONLINE_INTERRUPTED_BACK_RECT.x,ONLINE_INTERRUPTED_BACK_RECT.y,ONLINE_INTERRUPTED_BACK_RECT.w,ONLINE_INTERRUPTED_BACK_RECT.h,'タイトルへ戻る');
}
function render(){
  if(game.screen==='result'&&lastMatchOnline&&!resultAdvanced&&performance.now()-resultShownAt>=RESULT_HOLD_MAX_MS){
    advanceOnlineResult(); // 8秒経過したら未タップでも自動的に次戦へ進める
  }
  ctx.clearRect(0,0,W,H);
  if(game.screen==='title')rTitle();
  else if(game.screen==='select')rSelect();
  else if(game.screen==='battle')rBattle();
  else if(game.screen==='result'){if(B)rBattle();rResult();}
  else if(game.screen==='onlineSelect')rOnlineSelect();
  else if(game.screen==='onlineInterrupted'){if(B)rBattle();rOnlineInterrupted();}
  else if(game.screen==='onlineLobby')rOnlineLobby();
  else if(game.screen==='pause'){if(B)rBattle();rPauseOverlay();}
  else if(game.screen==='movelist'){if(B)rBattle();rMovelistOverlay();}
}

/* ================= メインループ ================= */
let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=now-last;last=now;
  if(dt>120)dt=120;
  let simDt=dt;
  if(focusSlowMs>0){ // 集中: 実0.6秒の間ロジックを0.25倍速で進める（体感スロー）
    simDt=dt*BAL.FOCUS.slowMul;
    focusSlowMs=Math.max(0,focusSlowMs-dt);
  }
  acc+=simDt;
  while(acc>=1000/60){
    acc-=1000/60;
    game.frame++;
    if(game.screen==='battle')logic();
  }
  render();
}
requestAnimationFrame(frame);
</script>
