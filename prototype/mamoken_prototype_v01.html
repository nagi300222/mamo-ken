  // ここでB.clash.mgに応じて背景を差し替えるのは常に誤り(旧STAGE-ART-IMPORT #105のバグ)だった。
  // MINIGAME_BGの定義/preloadは将来の独立MINIGAMEモード実装のため削除せず維持し、ここでの参照のみ撤去する。
  rStage();
  if(B.flow==='clash'){
    ctx.fillStyle='rgba(10,5,20,0.3)';ctx.fillRect(-60,-60,W+120,PT+120);
    ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=3;
    for(let i=0;i<16;i++){
      const a=i*TAU/16+game.frame*0.01;
      ctx.beginPath();
      ctx.moveTo(W/2+Math.cos(a)*430,300+Math.sin(a)*430);
      ctx.lineTo(W/2+Math.cos(a)*180,300+Math.sin(a)*180);
      ctx.stroke();
    }
  }else if(B.roarImpact&&B.roarImpact.kind==='armor'){ // ROAR-R2(#98): armor-success(最強ケース)専用。「briefly darken background immediately around impact, then restore」
    // 真の desaturate はpixel操作が必要で過大なため、既存clash vignetteと同じ手法(半透明の暗色矩形)で近似する
    const a=0.34*Math.max(0,1-B.roarImpact.f/B.roarImpact.dur)*flashScale();
    if(a>0.01){ctx.fillStyle='rgba(6,4,10,'+a+')';ctx.fillRect(-60,-60,W+120,PT+120);}
  }
  const xyB=fighterXY(B.p[1]),xyA=fighterXY(B.p[0]);
  rFighter(B.p[1],xyB[0],xyB[1]);rFighter(B.p[0],xyA[0],xyA[1]);
  drawStatusDebuffs(B.p[1],xyB[0],xyB[1]);drawStatusDebuffs(B.p[0],xyA[0],xyA[1]); // ABILITY-R2-B (§12 POISON/BIND status UI)
  if(onlineActive()&&(B.flow==='fight'||B.flow==='intro'))rYouMarker();
  rFx();
  rClashPicks();
  inMirrorZone=false;
  ctx.restore();
  if(B.roarImpact&&B.roarImpact.kind!=='guard'){ // ROAR-R2(#98): 短い impact flash(white/orange radial)。shake/zoomのtransformは解除済みの絶対座標へ描く
    const fadeF=B.roarImpact.kind==='armor'?6:4;
    if(B.roarImpact.f<fadeF){
      const a=(B.roarImpact.kind==='armor'?0.55:0.35)*(1-B.roarImpact.f/fadeF)*flashScale();
      if(a>0.01){
        const fx=mirror?(W-B.roarImpact.x):B.roarImpact.x; // Codexレビュー指摘(PR#115): ctx.restore()後の絶対座標描画のため、オンラインslot1側の水平ミラーを自前で反映する
        ctx.save();ctx.globalAlpha=a;
        const g=ctx.createRadialGradient(fx,B.roarImpact.y,10,fx,B.roarImpact.y,260);
        g.addColorStop(0,B.roarImpact.kind==='armor'?'#fff3d0':'#ffe8c0');
        g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle=g;ctx.fillRect(0,0,W,PT);
        ctx.restore();
      }
    }
  }
  if(B.flow==='clash'&&B.clash&&B.clash.phase==='in'){
    const k=B.clash.f/BAL.CLASH.inF;
    if(assetReady('clash_guiin')){ // ギュイーン突入演出画(対戦カードと絵の不一致は演出カットとして許容)

      ctx.save();ctx.globalAlpha=Math.min(1,k*1.6);
      ctx.translate(W/2,PT/2);ctx.scale(scale,scale);
      ctx.drawImage(e.img,-iw/2,-ih/2);
      ctx.restore();
    }
    ctx.save();ctx.translate(W/2,116);ctx.scale(1+k*0.3,1+k*0.3);ctx.rotate(-0.05);
    txt('ギュイーン!!',0,0,52,'#ffe14d');
    ctx.restore();
    txt(clashRouletteText(B.clash),W/2,166,28,'#fff'); // ルーレットテロップ: どのミニゲームが始まるか予告
  }
  rHUD();
  rPad();
  rCutin();
  rAnn();
  if(onlineActive()&&NET.waiting&&NET.waitingF>=BAL.NET.waitingShowF){ // 相手の入力待ち: 一定F以上続いた場合のみ明示的に知らせる(瞬間的な待機はちらつかせない)
    ctx.save();ctx.globalAlpha=0.55;ctx.fillStyle='#000';ctx.fillRect(0,PT/2-40,W,80);ctx.restore();
    txt('同期中…',W/2,PT/2,26,'#ffe6a3');
  }
  if(DEBUG_BAL)rDebugBal(); // BAL-R1: ?debug=bal時のみ。通常プレイUIには常設しない
  if(DEBUG_CPU&&!onlineActive())rDebugCpu(); // CPU-R2 PR1: ?debug=cpu時のみ。オンラインはaiStep()自体が動かないため対象外
}

function rDebugBal(){ // BAL-R1新設: 開発用の数値パネル(charId/HP・Guard最大/現在行動のs・a・r/damage・GuardDamage/

    const x=side===0?8:W-8,align=side===0?'left':'right';

  }
}

let MG=null;
const MINI_ACTION_BTN={x:W/2-140,y:640,w:280,h:120};

// 座標系のため使わず、この画面の安全領域(y:260〜780、backボタン帯y844+と重ならない)専用に別途定義する
function miniHandBtns(){return[
  {c:'guu',x:W/2,y:440,col:'#ffd23f',label:'グー'},

function miniHandHit(p){for(const b of miniHandBtns())if(Math.hypot(p.x-b.x,p.y-b.y)<=76)return b.c;return null;}
function miniRandTarget(){return{x:70+Math.random()*(W-140),y:260+Math.random()*(780-260)};}

function miniPracticePress(p){
  if(menuBackHit(p)){sfx('tap');MG=null;game.screen='menuMinigame';return;}
  if(MG.phase==='pick'&&MG.kind==='jyanken'){
    const choice=miniHandHit(p);
    if(choice){
      MG.pick=choice;MG.cpuPick=CHOICES[(Math.random()*3)|0];
      MG.winner=(MG.pick===MG.cpuPick)?-1:(BEATS[MG.pick]===MG.cpuPick?0:1);
      if(MG.winner===0){MG.wins++;sfx('hit2');vibrate(30);}
      else if(MG.winner===1){MG.losses++;sfx('guard');}
      else{MG.draws++;sfx('tap');}
      MG.phase='result';
    }
    return;
  }
  if(MG.phase==='play'&&MG.kind==='hayauchi'){
    if(Math.hypot(p.x-MG.target.x,p.y-MG.target.y)<=52){
      MG.hits++;sfx('hit');vibrate(20);
      if(MG.hits>=5){
        MG.elapsedMs=performance.now()-MG.startedAt;MG.phase='result';
        MG.best=(MG.best==null)?MG.elapsedMs:Math.min(MG.best,MG.elapsedMs);
      }else MG.target=miniRandTarget();
    }
    return;
  }
  if(MG.phase==='play'&&MG.kind==='renda'){
    if(performance.now()<MG.deadline&&inRect(p,MINI_ACTION_BTN.x,MINI_ACTION_BTN.y,MINI_ACTION_BTN.w,MINI_ACTION_BTN.h)){MG.taps++;sfx('tap');}
    return;
  }
  if(MG.phase==='result'&&inRect(p,MINI_RETRY_BTN.x,MINI_RETRY_BTN.y,MINI_RETRY_BTN.w,MINI_RETRY_BTN.h)){startMiniPractice(MG.kind);return;}
}

      if(p.y>=r.y+40&&p.y<=r.y+76){
        let t=(p.x-barX)/barW;t=Math.max(0,Math.min(1,t));

        else SE_VOLUME=stepped;

      return;

    const segCount=row.values.length;
    for(let s=0;s<segCount;s++){

      if(inRect(p,sr.x,sr.y,sr.w,sr.h)){OPTIONS[row.key]=row.values[s];sfx('tap');return;}

function cpuLvColor(lv){

function drawLockIcon(x,y,s){ // 未実装枠の鍵アイコン(簡易図形、§6.9 v2.6)
  ctx.save();ctx.translate(x,y);

  ctx.beginPath();ctx.arc(0,-s*0.35,s*0.55,Math.PI,0);ctx.stroke();

function detailWrapped(text,x,y,maxW,size,color,maxLines){
  const value=String(text||'—'),lineH=Math.ceil(size*1.45),lines=[];
  ctx.save();ctx.font=size+'px sans-serif';
  let line='';
  for(const ch of value){
    const candidate=line+ch;
    if(line&&ctx.measureText(candidate).width>maxW){lines.push(line);line=ch;}
    else line=candidate;
  }
  if(line)lines.push(line);
  const limit=maxLines||lines.length;
  for(let i=0;i<Math.min(lines.length,limit);i++){
    let shown=lines[i];
    if(i===limit-1&&lines.length>limit)shown=shown.slice(0,Math.max(1,shown.length-1))+'…';
    txt(shown,x,y+i*lineH,size,color||'#e7ebf4','left');
  }
  ctx.restore();
  return Math.min(lines.length,limit)*lineH;
}

// 数値を読んでバッジ文字列化する(新しい数値・仕様は一切足さない。既存tagsの内部向け注記(例:
// "小Pushback(未結線)")はプレイヤー向け表示としては読みにくいため、フィールドを個別に見て

function moveBadges(m){
  const badges=[];
  if(m.modern)badges.push({t:'MODERN対応',c:'#7fd8ff'});
  if(m.cost)badges.push({t:(m.cost.res==='armorStock'?'アーマーストック':'チャージ')+'×'+m.cost.amt+' 消費',c:'#ffb84d'});
  if(m.armorStartF!=null)badges.push({t:(m.hyperArmor?'ハイパーアーマー':'アーマー')+' '+m.armorStartF+'-'+m.armorEndF+'F(被弾時ダメージ'+Math.round(m.armorDmgMul*100)+'%)',c:'#ffd23f'});
  if(m.ironWallAlt)badges.push({t:'IRON WALL消費で強化版に切替',c:'#a7d9c9'});
  // ABILITY-R2-B (Issue #97 §7): FEINT/DELAY/POISONはmove自体の属性(m.feint/m.delay/m.poison)として表現
  if(m.feint)badges.push({t:'FEINT: HIT/BLOCKで18F後に追撃予約',c:'#caa6d9'});
  if(m.delay)badges.push({t:'DELAY: 相手Guard/Dodge中はActive開始を最大+12F遅延',c:'#caa6d9'});
  if(m.poison)badges.push({t:'POISON: HITで300F毒(10hit×21、計210)',c:'#8fd98f'});
  if(m.unblockable)badges.push({t:'ガード不能',c:'#ff8b8b'});
  if(m.pressureOnly)badges.push({t:'PRESSURE専用(直接入力不可)',c:'#c9a24d'});
  if(m.chargeGain)badges.push({t:'成功でCHARGE+1',c:'#ffb84d'});
  if(m.selfGuardRestore)badges.push({t:'成功でガード+'+m.selfGuardRestore,c:'#6fd3ff'});
  if(m.comboEnd)badges.push({t:'コンボ終着(Finisher)',c:'#ffd23f'});
  if(m.hits>1)badges.push({t:m.hits+'ヒット技',c:'#9adfff'});
  return badges;
}
function drawMoveBadges(badges,x,y,maxW){
  let bx=x,by=y,rowH=22;
  ctx.save();ctx.font='11px sans-serif';
  for(const b of badges){
    const w=ctx.measureText(b.t).width+16;
    if(bx+w>x+maxW){bx=x;by+=rowH;}
    ctx.fillStyle=b.c+'33';rr(bx,by,w,18,9);ctx.fill();
    ctx.strokeStyle=b.c;ctx.lineWidth=1.2;rr(bx,by,w,18,9);ctx.stroke();
    txt(b.t,bx+w/2,by+13,11,b.c);
    bx+=w+6;
  }
  ctx.restore();
  return by+rowH;
}

    txt(pid,x+cell/2,y+cell-6,8,'#cfd6e6');
  }
  txt('読み込み済み: '+ready+'/'+POSE_IDS.length,W/2,y0+4*(cell+gap)+16,13,ready===POSE_IDS.length?'#7CFC00':'#ffcf66');
}

/* ================= メインループ ================= */
let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=now-last;last=now;
  if(dt>120)dt=120;
  acc+=dt;
  while(acc>=1000/60){
    acc-=1000/60;
    game.frame++;
    if(game.screen==='battle')logic();
  }
  bgmSyncToScreen();
  render();
}
requestAnimationFrame(frame);
</script>
