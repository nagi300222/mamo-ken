<script>
(async function(){
  try{
    const b64=window.__MAMOKEN_WIKI_GZ||'';
    const bin=atob(b64);
    const bytes=Uint8Array.from(bin,function(c){return c.charCodeAt(0);});
    if(!('DecompressionStream' in window))throw new Error('このブラウザは圧縮ページ展開に対応していません');
    const ds=new DecompressionStream('gzip');
    const stream=new Blob([bytes]).stream().pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<p style="font-family:\'MS Gothic\',\'ＭＳ ゴシック\',monospace;padding:20px">サイトの読み込みに失敗しました。ブラウザを最新版に更新してください。<br>'+String(e)+'</p>';
  }
})();
</script>
</body>
</html>
