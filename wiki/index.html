<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#2a211a">
<title>マモ拳 攻略Wiki</title>
</head>
<body>
<p id="loading" style="font-family:'MS Gothic','ＭＳ ゴシック','Osaka-Mono','Hiragino Kaku Gothic ProN','Yu Gothic UI',monospace;padding:20px">読み込み中…</p>
<script src="r00.js"></script>
<script src="r01.js"></script>
<script src="r02.js"></script>
<script src="r03.js"></script>
<script src="r04.js"></script>
<script src="r05.js"></script>
<script src="r06.js"></script>
<script src="r07.js"></script>
<script>
(function(){
  try{
    var b64=window.__MAMOKEN_WIKI_RAW||'';
    if(!b64)throw new Error('Wikiデータを読み込めませんでした');
    var bin=atob(b64);
    var bytes=Uint8Array.from(bin,function(c){return c.charCodeAt(0);});
    var html=new TextDecoder('utf-8').decode(bytes);
    if(!/^<!doctype html>/i.test(html))throw new Error('Wikiデータの形式が正しくありません');
    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<p style="font-family:\'MS Gothic\',\'ＭＳ ゴシック\',\'Osaka-Mono\',\'Hiragino Kaku Gothic ProN\',monospace;padding:20px">サイトの読み込みに失敗しました。<br>'+String(e)+'</p>';
  }
})();
</script>
</body>
</html>
