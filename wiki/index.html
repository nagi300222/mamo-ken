function jpTag(s){return String(s??'')
 .replace(/Modern Grab/g,'モダンつかみ').replace(/Modern/g,'モダン').replace(/Classic-only/g,'クラシック限定').replace(/Classic/g,'クラシック')
 .replace(/Finisher/g,'フィニッシャー').replace(/comboEnd/g,'コンボ終了').replace(/Reach/g,'リーチ')

 .replace(/Unblockable/g,'ガード不能').replace(/Charge gain/g,'チャージ獲得').replace(/Charge(\d+)/g,'チャージ$1消費').replace(/Charge/g,'チャージ')
 .replace(/Return Grab/g,'返しつかみ').replace(/Return/g,'返し').replace(/Just/g,'ジャスト').replace(/Dark Chain/g,'暗連')
 .replace(/Pressure starter/g,'プレッシャー起点').replace(/Pressure-only/g,'プレッシャー中限定').replace(/Pressure/g,'プレッシャー')
 .replace(/LUNGE success only/g,'→踏み込み成功時限定').replace(/Grab/g,'つかみ').replace(/stance counter/g,'構えカウンター')
 .replace(/lightDown/g,'軽ダウン').replace(/hardDown/g,'強ダウン').replace(/throwDown/g,'投げダウン').replace(/whiff\+?(\d+)/g,'空振り追加硬直$1F')
 .replace(/small push/gi,'小押し出し').replace(/no armor/gi,'アーマーなし').replace(/no chain/gi,'暗連不可')
 .replace(/Iron Wall/g,'アイアンウォール').replace(/dmg/g,'ダメージ').replace(/GD/g,'ガード削り').replace(/CC(\d+)/g,'クラシックキャンセル受付$1F')
 .replace(/HIT-BLOCK Guard\+15/g,'ヒット・ガード時 ガード+15').replace(/Guard\+15/g,'ガード+15').replace(/chip(\d+)/g,'削り$1')
 .replace(/Quick/g,'クイック').replace(/Heavy/g,'ヘビー').replace(/Standard/g,'スタンダード');}
function jpResult(s){const x=String(s??'');return x.replace(/^Down$/,'ダウン').replace(/hardDown/g,'強ダウン').replace(/lightDown/g,'軽ダウン').replace(/throwDown/g,'投げダウン').replace(/New seq/g,'新ダメージ列');}
function frameText(s){const x=String(s??'');if(/^S\d+/.test(x))return '発生'+x.slice(1)+'F';return x+(x.includes('/')?'F':'');}

function currentRoute(){const q=new URLSearchParams(location.search);return{char:q.get('char'),page:q.get('page')||'home'}}
function portraitUrl(c){return `${REPO_ASSET_ROOT}/assets/roster3d/${c.asset||c.id}.webp`}
function portraitStyle(c,card=false){const p=c.wikiCrop||{x:.5,y:.42,z:1.4};const z=card?p.z*1.18:p.z*1.06;return `object-position:${p.x*100}% ${p.y*100}%;transform:scale(${z});`}
function imgTag(c,card=false){return `<img src="${portraitUrl(c)}" alt="${esc(c.name)}" style="${portraitStyle(c,card)}" onerror="this.style.display='none'">`}
function controlImg(key,label=''){return `<span class="control-wrap"><img class="control-img" src="${CONTROL_DATA[key]||''}" alt="${esc(label||key)}"><span>${esc(label)}</span></span>`}
function abilityAssetUrl(path){const rel=String(path).replace(/^icons\//,'icon/');return `${REPO_ASSET_ROOT}/assets/art/ability_ui/${rel}`}
function normalLabel(k){return {high:'上段',mid:'中段',low:'下段',crouch:'しゃがみ突き'}[k]||k}
function comboToken(t){return ['high','mid','low'].includes(t)?controlImg(t,normalLabel(t)):`<span class="copy-chip">${esc(t)}</span>`}
function comboIcons(combo){return `<div class="input-line">${combo.sequence.map((t,i)=>`${i?'<span class="input-arrow">→</span>':''}${comboToken(t)}`).join('')}</div>`}
function comboCards(c){return `<div class="combo-list">${(c.combos||[]).map(x=>`<article class="combo-card"><div class="combo-head"><div><span class="combo-route">ルート ${esc(x.route)}</span><h3>${esc(x.text)}</h3></div><span class="combo-class">${esc(x.class)}</span></div>${comboIcons(x)}<div><span class="combo-dmg">実測 ${x.damage} dmg</span><span class="combo-kind">${esc(x.kind)}</span></div><p class="combo-note">${esc(x.note)}</p></article>`).join('')}</div>`}
function padDemo(){return `<div class="pad-demo"><div class="pad-half"><h3>左側：防御・回避</h3><div class="pad-zone">${controlImg('guard','ガード')}${controlImg('mikiri','見切り')}</div><div class="pad-dir-row"><div class="pad-zone">${controlImg('left','←')}</div><div class="pad-zone">${controlImg('down','↓')}</div><div class="pad-zone">${controlImg('right','→')}</div></div><p class="small">←スウェー / ↓しゃがみ / →踏み込み</p></div><div class="pad-half"><h3>右側：攻撃・つかみ</h3><div class="pad-attack-row"><div class="pad-zone">${controlImg('high','上段')}</div><div class="pad-zone">${controlImg('mid','中段')}</div><div class="pad-zone">${controlImg('low','下段')}</div></div><div class="pad-grab">${controlImg('grab','つかみ')}</div></div></div>`}

function inputIcons(detail){const dirs=detail.dirs.map(d=>controlImg(d,'')).join('<span class="input-gap"></span>');const trigLabel={high:'上段',mid:'中段',low:'下段',grab:'つかみ'}[detail.trigger];return `<div class="input-line">${dirs}<span class="input-plus">＋</span>${controlImg(detail.trigger,trigLabel)}</div>`}
function modernIcons(route){return `<div class="input-line modern-line">${route.seq.map((x,i)=>`${i?'<span class="input-arrow">→</span>':''}${controlImg(x,{high:'上段',mid:'中段',low:'下段'}[x])}`).join('')}<span class="input-arrow">⇒</span><b>${esc(route.move)}</b></div>`}
function paramPanel(c){return `<div class="param-panel">${PARAMS.map(([k,n])=>{let v=c.params[k];return `<div class="param-row"><div class="param-name">${n}</div><div class="param-track">${[1,2,3,4,5].map(i=>`<span class="param-pip ${i<=v?'on':''}"></span>`).join('')}</div><div class="param-num">${v}/5</div></div>`}).join('')}</div>`}
function rosterParams(c){return `<div class="roster-params">${PARAMS.map(([k,n])=>`<div class="roster-param">${n}<b>${c.params[k]}</b></div>`).join('')}</div>`}

 const b=$('#searchBtn'),i=$('#search'),mc=$('#mobileChar');if(b){b.onclick=()=>search(i.value);i.addEventListener('keydown',e=>{if(e.key==='Enter')search(i.value)})}if(mc){mc.onchange=()=>{if(mc.value)location.href='?char='+mc.value};const cr=currentRoute();if(cr.char)mc.value=cr.char;}
}
function search(q){q=q.trim();if(!q)return;for(const id of order){const c=DB.characters[id];const hay=[c.name,c.type,c.species,c.ult,c.tagline,c.ability.title,...c.commands.flat(),...c.command_details.map(x=>x.explanation)].join(' ');if(hay.toLowerCase().includes(q.toLowerCase())){location.href=`?char=${id}#commands`;return}}alert('該当データが見つかりませんでした。')}

function system(){

 const limits=order.map(id=>`<tr><td><a href="?char=${id}">${esc(DB.characters[id].name)}</a></td><td>${DB.characters[id].chain}</td></tr>`).join('');
 const tips=DB.system.tips.map(x=>`<li>${esc(x)}</li>`).join('');
 shell(`<div class="breadcrumb"><a href="?page=home">ホーム</a> &gt; ゲームシステム</div><h1>ゲームシステム</h1><div class="lastmod">更新：${DB.updated}</div><section id="controls"><h2>操作</h2>${padDemo()}<div class="control-legend"><div>${controlImg('left','← スウェー')}</div><div>${controlImg('down','↓ しゃがみ')}</div><div>${controlImg('right','→ 踏み込み')}</div><div>${controlImg('high','上段')}</div><div>${controlImg('mid','中段')}</div><div>${controlImg('low','下段')}</div><div>${controlImg('grab','つかみ')}</div></div></section><section id="common-vfx"><h2>共通UI・演出</h2><p>複数キャラで共通利用する警告・アーマー表現。実ゲーム側の素材と同じものを掲載しています。</p>${uiGallery({ui_assets:DB.system.common_vfx})}</section><section id="dodge"><h2>3種類の回避</h2><p>${esc(DB.system.explanations.dodge)}</p><div class="dodge-grid"><div class="guide-box"><h3>← スウェー</h3><p><b>上段・下段</b>を避け、中段に負ける。</p></div><div class="guide-box"><h3>↓ しゃがみ</h3><p><b>上段・中段</b>を避け、下段に負ける。</p></div><div class="guide-box"><h3>→ 踏み込み</h3><p><b>中段・下段</b>を避け、上段に負ける。</p></div></div></section><section id="chain"><h2>通常チェーン</h2><p>上段・中段・下段は自由な順番でつなげられ、同じ段の連続も可能。ヒット時だけ真のチェーンが続き、ガード・空振りで終了する。</p><div class="table-scroll"><table><tr><th>キャラ</th><th>通常チェーン上限</th></tr>${limits}</table></div></section><section id="op"><h2>OP相殺</h2><p>${esc(DB.system.explanations.op)}</p></section><section id="scaling"><h2>コンボ補正</h2><p>${esc(DB.system.explanations.scaling)}</p><div class="scale-strip">${DB.system.combo_scaling.map((v,i)=>`<span><b>${i+1}${i===8?'手目〜':'手目'}</b>${v}%</span>`).join('')}</div></section><section id="modern"><h2>モダン（Modern）</h2><p>${esc(DB.system.explanations.modern)}</p></section><section id="classic"><h2>クラシック（Classic）</h2><p>${esc(DB.system.explanations.classic)}</p></section><section id="combo"><h2>確定コンボ（TRUE COMBO）</h2><div class="verification-note"><b>27ルートを実ゲーム処理で検証済み</b><p>${esc(DB.system.explanations.true_combo)}</p></div><div class="warning-box"><b>咆哮割り込み（Roar Escape）</b><p>${esc(DB.system.explanations.roar_escape)}</p></div></section><section id="resource"><h2>S・咆哮・奥義</h2><div class="control-legend"><div>${controlImg('roar','咆哮')}</div><div>${controlImg('ult','奥義')}</div></div>${Object.entries(DB.system.resources).map(([k,v])=>`<div class="system-card"><h3>${k==='Roar'?'咆哮（Roar）':k==='Ult'?'奥義ゲージ（Ult）':k}</h3><p>${esc(v)}</p></div>`).join('')}</section><section id="tips"><h2>小ネタ・覚えておきたいこと</h2><ul class="tips">${tips}</ul></section>`, `<li><a href="#controls">操作</a></li><li><a href="#common-vfx">共通UI</a></li><li><a href="#dodge">回避</a></li><li><a href="#chain">通常チェーン</a></li><li><a href="#op">OP相殺</a></li><li><a href="#scaling">補正</a></li><li><a href="#modern">モダン</a></li><li><a href="#classic">クラシック</a></li><li><a href="#combo">TRUE COMBO</a></li><li><a href="#resource">S・咆哮・奥義</a></li><li><a href="#tips">小ネタ</a></li>`)

function charFacts(c){const ns=c.normals,fastest=Math.min(...ns.map(n=>n[0])),maxN=Math.max(...ns.map(n=>n[3]));const cmdDam=c.commands.map(m=>Number(m[2])).filter(Number.isFinite),maxC=Math.max(...cmdDam);return `<div class="fact-grid"><div class="fact"><span>最速通常技</span><strong>${fastest}F</strong></div><div class="fact"><span>最大通常技ダメージ</span><strong>${maxN}</strong></div><div class="fact"><span>最大コマンド技ダメージ</span><strong>${maxC}</strong></div><div class="fact"><span>通常チェーン上限</span><strong>${c.chain}</strong></div><div class="fact"><span>HP / ガード</span><strong>${c.hp} / ${c.guard}</strong></div><div class="fact"><span>正式身長比</span><strong>${c.height}</strong></div></div>`}

function commandCards(c){return c.commands.map((m,i)=>{const d=c.command_details[i];return `<article class="move-card"><div class="move-top"><div><span class="move-no">技 ${i+1}</span><h3>${esc(m[0])}</h3></div><span class="motion-badge">専用モーション</span></div>${inputIcons(d)}<div class="mini-stats"><span><b>発生/持続/硬直</b>${esc(frameText(m[1]))}</span><span><b>ダメージ</b>${esc(m[2])}</span><span><b>ガード削り</b>${esc(m[3])}</span><span><b>ヒット/ガード</b>${esc(jpResult(m[4]))} / ${esc(jpResult(m[5]))}</span></div><p class="move-desc">${esc(d.explanation)}</p>${m[6]?`<div class="tags">${esc(jpTag(m[6]))}</div>`:''}</article>`}).join('')}

→1、2→2、3→2。"},"explanations":{"dodge":"回避は←（スウェー）・↓（しゃがみ）・→（踏み込み）の3種類。どれかが上位互換ではなく、それぞれ2つの段を避け、1つの段に負ける。正解回避はF18、空振り回避はF22で行動可能になる。","modern":"モダン（Modern）は、通常技の段を決められた順番で入力すると、最後の通常技が対応コマンド技へ置き換わる方式。ヒットだけでなくガードでも履歴は残る。技が弱くなるモードではなく、入力方法が違う。","classic":"クラシック（Classic）は方向入力＋攻撃／つかみでコマンド技を直接出す方式。コマンド技ヒット後は、次の正式クラシック入力で硬直をキャンセルできる。クラシックの報酬は火力ボーナスではなく、ルートの自由度。","op":"同じ通常技を直接繰り返すとOP相殺がかかり、Damage・Guard Damageが100%→90%→80%→70%へ低下する。違う通常技を挟むと100%へ戻る。","scaling":"コンボが長くなるほどCombo Scalingが強くなる。1手目100%から段階的に下がり、9手目以降は25%。Dark ChainやClassic CancelでNormal Chainを伸ばしても、Damage Scaling自体はリセットされない。","true_combo":"TRUE COMBO（確定コンボ）は、次の攻撃までに相手が通常のガード・しゃがみ・スウェー・踏み込みへ戻れない連続攻撃を指す。Sが100ならヒット硬直中でも咆哮を開始できるため、TRUE COMBO＝絶対に脱出不能という意味ではない。ABILITY-R2/ROAR-R2以降のバランス変更を受けて全ルートをlive engineで再実測し、TRUE COMBOでなくなったルートは差し替え・削除している（詳細は各キャラのコンボ表を参照）。","roar_escape":"咆哮割り込み（Roar Escape）：Sが100なら、ヒット硬直・ガード硬直中でも咆哮を開始できる。S100を全消費する最後の防御択だが、咆哮の出始めを次の攻撃に潰されることもあるため、必ず脱出できるバーストではない。"},"tips":["BLOCKするとNormal Chainはそこで終わるが、モダン履歴は45F以内なら残る。ガードされた後に次の通常技からModernを完成させる展開もある。","モダンで最後の通常技がコマンド技へ置換された場合、その最後の通常技はNormal Chain回数として数えない。","クラシックキャンセルはCommand HIT時だけ。ガードされた技から自由にキャンセルできるわけではない。","Wrong Dodgeで攻撃を受けるとCounter×1.20。回避は「押せば得」ではなく、段読みを外すと通常より痛い。","Sはラウンド開始0。コンボ1・2・3手目のHITで+12/+7/+4、4手目以降は+0。長いコンボだけでSを大量回収はできない。","Ult Stockは3MAX。ラウンド終了時3だけは次ラウンド2へ減るが、1や2ならそのまま持ち越す。","TRUE COMBOでも、Sが100なら咆哮割り込みを試せる。咆哮の発生・アーマーに次の攻撃が重なると潰されることもある。","コマンド技63技は専用モーションのruntime監査が完了しており、通常技モーションへのfallbackなしを確認済み。","固有能力UI・ゲージ・VFXは9キャラともbattle HUDへ接続済み。"],"common_vfx":[{"path":"vfx/VFX-01_UNBLOCKABLE_TELEGRAPH_COMMON.png","name":"ガード不能予告","desc":"ガード不能攻撃が来ることを共通記号で知らせる。"},{"path":"vfx/VFX-02_ARMOR_NORMAL_COMMON.png","name":"通常アーマー","desc":"1ヒットアーマーなど、通常のアーマー状態を示す共通演出。"},{"path":"vfx/VFX-03_ARMOR_HYPER_COMMON.png","name":"ハイパーアーマー","desc":"複数ヒットを耐える強いアーマー状態を区別する共通演出。"}],"verified":{"command_motion":"63/63 コマンド技専用モーションをruntime監査済み","ability_ui":"9キャラの固有能力UI・ゲージ・VFXをlive接続済み","combos":"各キャラ2〜4本・計24ルートをfinal live engineで再実測・成立確認済み（旧27ルートから、ABILITY-R2/ROAR-R2以降のバランス変更でTRUE COMBOでなくなったものを差し替え・整理）。","offline":"72/72 ordered-pair offline regression clean","determinism":"pre-PRESENTATION-R1とのper-tick gameplay-state hash非回帰を確認済み","online":"実機2台での最終オンライン回帰のみ未完了"},"modes":{"cpu":{"intro":"CPU Lv1-9が唯一の難易度軸。旧EASY/NORMAL/HARDは廃止され、VS CPU・ARCADE・SURVIVAL・TRAININGすべてで共通のLv1-9テーブルを使う。","table":[{"lv":1,"think":"28-44F","react":"20-28F","reactRate":"25%","advDef":"5%","atkFreq":"0.50","down":"しない"},{"lv":2,"think":"24-38F","react":"18-25F","reactRate":"35%","advDef":"8%","atkFreq":"0.60","down":"しない"},{"lv":3,"think":"20-32F","react":"16-22F","reactRate":"45%","advDef":"12%","atkFreq":"0.80","down":"たまに(50%)"},{"lv":4,"think":"16-28F","react":"13-20F","reactRate":"58%","advDef":"18%","atkFreq":"0.90","down":"たまに(75%)"},{"lv":5,"think":"14-25F","react":"11-16F","reactRate":"68%","advDef":"27%","atkFreq":"1.00","down":"常にする"},{"lv":6,"think":"12-22F","react":"10-15F","reactRate":"75%","advDef":"34%","atkFreq":"1.05","down":"常にする"},{"lv":7,"think":"10-20F","react":"9-14F","reactRate":"82%","advDef":"42%","atkFreq":"1.10","down":"常にする"},{"lv":8,"think":"9-18F","react":"8-13F","reactRate":"88%","advDef":"50%","atkFreq":"1.15","down":"常にする"},{"lv":9,"think":"8-16F","react":"8-12F","reactRate":"92%","advDef":"58%","atkFreq":"1.20","down":"常にする"}],"columns":["Lv","思考間隔","反応遅延","防御反応率","高度防御(回避/見切り)率","攻撃頻度倍率","ダウン追撃"],"note":"Lvが上がるほど反応が速く正確になり、見切り・回避などの高度な防御選択も増える。Lv3-4はダウン追撃を時々行い、Lv5以上は必ず行う。咆哮割り込みの使用率・SPECIAL/奥義の使いどころの精度・プレイヤーの癖への適応度もLvに応じて段階的に上がる。"},"arcade":{"format":"全8戦。各戦は通常対戦と同じ2ラウンド先取（3本先取ではなく2本先取）のマッチ形式。","route":"Stage1-7の対戦相手は自分以外の8キャラから7体を順不同で割り当て。Stage8=FINAL。ダークモグゾーを選んだ場合FINALは通常モグゾー、それ以外を選んだ場合FINALはダークモグゾー。","stages":"Stage1-7の背景は集落の闘技場／昼・アルプス草原アリーナ・岩壁の峡谷・雪解けの渓流・地下巣穴闘技場から自動抽選（隣接する戦での連続再抽選は回避）。FINALはダークモグゾーが絡む場合のみ新月の闇闘技場、それ以外は通常プールから抽選。","dialogue":"各戦開始前に、相手側の挑戦の台詞→プレイヤー側の応戦の台詞という1往復の掛け合いが入る。ダークモグゾーが絡む対戦は専用の台詞セットを持たないため掛け合いをスキップする。","darkNarration":"ダークモグゾーが絡む対戦のVS画面では、掛け合いの代わりに「闇の力が高まっている……！」という地の文のみが表示される。","continueRule":"敗北または引き分けはCONTINUE対象。同じ相手・同じステージへフルHPで再挑戦でき、続行回数が加算される。CONTINUE回数に上限はない。","win":"8戦目に勝利するとARCADE CLEARへ進む。"},"survival":{"format":"1ラウンド1本勝負（通常対戦の2本先取ではない）。引き分けは敗北として扱われ、その場でSURVIVAL ENDになる。CONTINUEは存在しない。","carryover":"HPのみ次の戦いへ持ち越される。SPECIALのクールダウン、Ability由来の状態（チャージ・毒・拘束・アーマーストック等）は毎戦フルリセットされる。","healTable":[{"range":"1〜15戦クリア後","amount":"最大HPの1/2 回復"},{"range":"16〜30戦クリア後","amount":"最大HPの1/3 回復"},{"range":"31戦クリア後〜","amount":"最大HPの1/4 回復"}],"cpuTable":[{"range":"1〜15戦目","lv":"CPU Lv1"},{"range":"16〜30戦目","lv":"CPU Lv3"},{"range":"31〜45戦目","lv":"CPU Lv5"},{"range":"46〜60戦目","lv":"CPU Lv7"},{"range":"61戦目〜","lv":"CPU Lv9"}],"note":"対戦相手・ステージはブロック単位（通常キャラは15戦、ダークモグゾー選択時は8戦）でシャッフルされ、各ブロックの最終戦は自キャラのミラー（ダークモグゾー選択時のみ）またはダークモグゾー戦になる。"},"minigame":{"intro":"JYANKEN・HAYAUCHI・RENDAはメインメニューのMINIGAMEから直接遊べる独立エンドレスモード。対戦中に発生するギュイーンとは実装が完全に分離しており、互いに影響しない。","jyanken":"勝利でHP+300、敗北でHP-400、あいこは変動なし。HPが尽きるまでエンドレスで対戦相手が入れ替わる。","hayauchi":"1本ごとの制限時間は開始3.0秒。10本ごとに制限時間が3.0秒→2.0秒→1.0秒→0.5秒と短縮されていく（0.5秒が最短）。","renda":"中央0.5を基準に上下する綱引きゲージをタップで押し返す。何もしなければゲージは常に減少方向へ流れ、その基礎速度は対戦内ギュイーンのCPU Lv9相当を初期値とする（開始直後からLv9相当のペースでの連打が要求される）。さらに時間経過で減少速度が線形に増加し、10秒地点で1.10倍・30秒地点で1.30倍・60秒地点で1.60倍・120秒地点で2.20倍に達する。危険境界も5秒ごとに中央へ迫る。"},"training":{"intro":"通常対戦と同じbattle engineをそのまま使うモード。別ルール・別の当たり判定処理は存在せず、対戦相手をダミーとして観察・練習する形になる。","dummyModes":"STAND(棒立ち) / GUARD ALL(常時ガード) / GUARD後(被弾後40Fガード) / DODGE(見てから回避) / MIKIRI(見切り) / REVERSAL(起き上がりに通常技・つかみ・咆哮・SPECIAL・コマンド技のいずれかで反撃) / CPU Lv(Lv1-9のAIをそのまま使用)。","resources":"HP・ガードのフル回復、S100%、奥義MAXを片側ずつ即座に適用できる。","abilityPresets":"キャラごとの固有状態（GUTS発動・チャージ充填・毒付与・拘束付与など）をワンタップで注入できるプリセットを用意。","controls":"+1F/+5Fのフレーム送りと、現在の設定を保ったままの再戦リセットに対応。"},"stage":{"battle":[{"name":"集落の闘技場／昼","note":"ステージ選択に現れない既定背景。ステージ未指定時のフォールバックであり、ARCADEの通常抽選プールにも含まれる。"},{"name":"アルプス草原アリーナ"},{"name":"岩壁の峡谷"},{"name":"雪解けの渓流"},{"name":"地下巣穴闘技場"},{"name":"新月の闇闘技場","note":"ダークモグゾーが絡むARCADE FINAL等で選ばれやすい。"}],"minigame":[{"name":"集落の広場","mode":"JYANKEN"},{"name":"草原の的場","mode":"HAYAUCHI"},{"name":"山道ランコース","mode":"RENDA"}],"note":"対戦中に発生するギュイーンは、その試合の対戦背景をそのまま維持する。MINIGAME専用背景に切り替わることはない。"},"options":{"fields":[{"key":"BGM音量","values":"5段階(0〜100%)"},{"key":"SE音量","values":"5段階(0〜100%)"},{"key":"バイブ","values":"ON / OFF"},{"key":"画面シェイク","values":"強 / 標準 / OFF"},{"key":"フラッシュ","values":"標準 / 低減"},{"key":"せっていをリセット","values":"上記すべてを初期値へ戻す"}],"note":"操作方式（Modern／Classic）を選ぶ項目は存在しない。Modern入力とClassic入力は常に同時に有効な、同じコマンド技への2つの入力経路であり、選択するモードという概念自体がない。"},"vs":{"menu":"タイトル画面の下部にBATTLE／MINIGAME／OPTIONSの3カテゴリボタン。BATTLE配下にARCADE・SURVIVAL・VS CPU・ONLINE・TRAINING、MINIGAME配下にJYANKEN・HAYAUCHI・RENDA。","presentation":"BATTLE・ONLINE・ARCADE・SURVIVALで共通利用するVS演出。対角線で左右に分割し、左にP1、右にP2/CPUの3Dロスター立ち絵（P2側は左右反転）をスライドインさせ、背景に稲妻を走らせながら中央へ大きく「VS」がスラム演出で入る。ダークモグゾーが絡む対戦は演出色を紫系へ統一する。ARCADEのみ掛け合い→VS→対戦の順、SURVIVALはVS演出そのものが短縮版になる。"}}},"updated":"2026-08-11","version":"WEB-R2 完了 / 攻略Wiki v5","terms":{"high":"上段","mid":"中段","low":"下段","crouch":"しゃがみ突き","sway":"←（スウェー）","crouch_dodge":"↓（しゃがみ）","lunge":"→（踏み込み）","grab":"つかみ","guard":"ガード","roar":"咆哮","modern":"モダン（Modern）","classic":"クラシック（Classic）"}};const r=currentRoute();if(r.char)charPage(r.char);else if(r.page==='system')system();else if(r.page==='modes')modes();else home();</script></body></html>
