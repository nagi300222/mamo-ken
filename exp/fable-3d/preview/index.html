<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マモ拳 3D プレビュー</title>
<style>
  :root { color-scheme: dark; --bg:#14161b; --panel:#1d2027; --line:#31353f; --text:#e6e8ec; --mute:#9aa1ad; --acc:#e0a13a; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.5 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #app { display:grid; grid-template-columns: 1fr 300px; height:100%; }
  #view { position:relative; min-width:0; min-height:0; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; left:12px; top:10px; font-variant-numeric: tabular-nums; color:var(--mute); pointer-events:none; white-space:pre; }
  #panel { background:var(--panel); border-left:1px solid var(--line); padding:12px; overflow:auto; }
  h1 { font-size:14px; margin:0 0 8px; } h2 { font-size:11px; letter-spacing:.06em; color:var(--mute); margin:14px 0 6px; font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:4px; }
  button { background:#2a2e38; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:5px 8px; font:inherit; cursor:pointer; }
  button:hover { border-color:#566; } button.on { background:var(--acc); color:#1b1400; border-color:var(--acc); }
  label { display:flex; align-items:center; gap:6px; padding:2px 0; } input[type=range] { width:100%; }
  #err { color:#ff8a7a; white-space:pre-wrap; }
  @media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: 55% 45%; } #panel { border-left:0; border-top:1px solid var(--line); } }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }</script>
</head>
<body>
<div id="app">
  <div id="view"><canvas id="c"></canvas><div id="hud"></div></div>
  <div id="panel">
    <h1>マモ拳 3D プレビュー</h1>
    <h2>キャラクター</h2><div class="row" id="chars"></div>
    <h2>アニメーション</h2><div class="row" id="clips"></div>
    <h2>再生</h2>
    <div class="row"><button id="bPlay">一時停止</button><button id="bPrev">◀ 1F</button><button id="bNext">1F ▶</button></div>
    <div class="row" id="speeds" style="margin-top:4px"></div>
    <input type="range" id="seek" min="0" max="1" step="0.0001" value="0">
    <label>クロスフェード <input type="range" id="fade" min="0" max="0.4" step="0.01" value="0.10"><span id="fadeV">0.10s</span></label>
    <label><input type="checkbox" id="oReturn" checked> 単発モーションの後は idle へ戻る</label>
    <label><input type="checkbox" id="oRoot"> 移動量を適用（歩き・ダッシュ・ジャンプ）</label>
    <h2>表示</h2>
    <label><input type="checkbox" id="oBones"> ボーン</label>
    <label><input type="checkbox" id="oWire"> ワイヤーフレーム</label>
    <label><input type="checkbox" id="oToon"> トゥーン（段階シェーディング＋輪郭線）</label>
    <label><input type="checkbox" id="oGrid" checked> 床グリッド</label>
    <h2>向き</h2><div class="row" id="facing"></div>
    <h2>カメラ</h2><div class="row" id="cams"></div>
    <h2>情報</h2><div id="info" style="color:var(--mute); white-space:pre-wrap"></div><div id="err"></div>
  </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
