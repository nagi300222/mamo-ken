<!doctype html><html><head><meta charset="utf-8"><title>marmot cutout renderer</title><link rel="icon" href="data:,">
<script type="importmap">{"imports":{"three":"../../../preview/vendor/three.module.min.js","three/addons/":"../../../preview/vendor/addons/"}}</script>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style></head><body><script type="module">
// UI イラスト用の切り抜き素材を、元の 9 体の GLB（chars/<id>/<id>.glb。読むだけ）から描く。背景は透明。制作ツールで、ゲームの実行時コードではない。
//   ?id=moguzo&clip=idle&t=0.3&yaw=60&pitch=8&w=480&h=480&fit=1.05&mode=color|silhouette&tint=1b2a26
import * as THREE from 'three'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search), W = +q.get('w') || 480, H = +q.get('h') || 480;
const r = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true}); r.setPixelRatio(1); r.setSize(W, H); r.setClearColor(0, 0); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xfff4e0, 0x4a5a66, 1.55)); const key = new THREE.DirectionalLight(0xfff0d8, 2.4); key.position.set(-1.6, 2.4, 2.6); scene.add(key); const rim = new THREE.DirectionalLight(0xbfe0ff, 1.3); rim.position.set(2.2, 1.6, -2.2); scene.add(rim);
window.cut = {ready: false};
try {
  const g = await new Promise((a, b) => new GLTFLoader().load(`../../../chars/${q.get('id')}/${q.get('id')}.glb`, a, undefined, b)); const pivot = new THREE.Group(); pivot.add(g.scene); scene.add(pivot); pivot.rotation.y = THREE.MathUtils.degToRad(+q.get('yaw') || 0);
  const mixer = new THREE.AnimationMixer(g.scene), clip = g.animations.find(c => c.name === (q.get('clip') || 'idle')); if (clip) { const a = mixer.clipAction(clip); a.play(); a.paused = true; a.time = Math.min(clip.duration - 1e-4, +q.get('t') || 0); mixer.update(0); }
  const meshes = []; g.scene.traverse(o => { if (o.isSkinnedMesh) { o.frustumCulled = false; meshes.push(o); } });
  if (q.get('mode') === 'silhouette') for (const o of meshes) o.material = new THREE.MeshBasicMaterial({color: new THREE.Color('#' + (q.get('tint') || '14211d'))});
  scene.updateMatrixWorld(true);
  // スキニング後の頂点から外接箱を取り、画面いっぱいに収まる正投影カメラを置く
  const box = new THREE.Box3(), v = new THREE.Vector3(); for (const o of meshes) { const p = o.geometry.attributes.position; for (let i = 0; i < p.count; i += 3) { o.getVertexPosition(i, v); v.applyMatrix4(o.matrixWorld); box.expandByPoint(v); } }
  const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3()), pitch = THREE.MathUtils.degToRad(+q.get('pitch') || 6), fit = +q.get('fit') || 1.08, half = Math.max(s.y, Math.hypot(s.x, s.z) * H / W) * fit / 2;
  const cam = new THREE.OrthographicCamera(-half * W / H, half * W / H, half, -half, .01, 20); cam.position.set(c.x, c.y + Math.sin(pitch) * 4, c.z + Math.cos(pitch) * 4); cam.lookAt(c); r.render(scene, cam);
  window.cut = {ready: true, clips: g.animations.map(a => a.name), height: s.y};
} catch (e) { window.cut = {ready: true, error: String(e)}; }
</script></body></html>
