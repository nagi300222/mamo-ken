<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141c23">
<title>マモ拳 3D｜山岳道場</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"../preview/vendor/three.module.min.js","three/addons/":"../preview/vendor/addons/"}}</script>
</head>
<body>
<main id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">拳</span><div><strong>マモ拳 <span>3D</span></strong><small>山岳道場 · 対戦試作 v0.1</small></div></div>
    <div class="header-actions">
      <span class="draft">仮バランス</span>
      <button id="pause" class="ghost" title="一時停止">一時停止</button>
      <button id="select-back" class="ghost">キャラ選択</button>
    </div>
  </header>
  <section id="arena" aria-label="対戦画面">
    <canvas id="stage"></canvas>
    <div class="hud">
      <div class="hud-side">
        <div class="hud-name"><span id="name-0">モグゾー</span><span id="ability-0">根性</span></div>
        <div class="hp-track"><div id="hp-0" class="hp-fill"></div></div>
        <div class="meter-track"><div id="meter-0" class="meter-fill"></div></div>
      </div>
      <div class="round-center"><span id="timer">75</span><small id="round-message">ROUND 1</small></div>
      <div class="hud-side mirrored">
        <div class="hud-name"><span id="name-1">ゴダン</span><span id="ability-1">装甲</span></div>
        <div class="hp-track"><div id="hp-1" class="hp-fill"></div></div>
        <div class="meter-track"><div id="meter-1" class="meter-fill"></div></div>
      </div>
    </div>
    <div id="note" class="note" aria-live="polite">キャラクターを選んで対戦開始</div>
    <div id="game-over" class="modal hidden">
      <div class="result-panel">
        <small class="eyebrow">ROUND FINISHED</small><h2 id="result-title">決着！</h2>
        <p id="result-description"></p>
        <div class="result-actions"><button id="rematch" class="primary">もう一戦</button><button id="result-select" class="ghost">キャラ選択</button></div>
      </div>
    </div>
    <div id="selection" class="selection">
      <div class="selection-inner">
        <div class="selection-top"><div><small class="eyebrow">SELECT YOUR FIGHTER</small><h1>参戦するマーモットを選ぶ</h1></div><span class="select-info">全9キャラ · CPU対戦</span></div>
        <div id="roster" class="roster" aria-label="キャラクター選択"></div>
        <div class="selection-footer">
          <div class="chosen"><strong id="chosen-name">モグゾー</strong><span id="chosen-role">万能・根性</span></div>
          <label class="opponent">対戦相手 <select id="cpu-choice" aria-label="CPUキャラクター"></select></label>
          <label class="opponent">CPU <select id="difficulty"><option value="1">やさしい</option><option value="2" selected>ふつう</option><option value="3">強い</option></select></label>
          <button id="start" class="primary">対戦開始 <span>FIGHT</span></button>
        </div>
      </div>
    </div>
    <div id="rotate" class="rotate-hint">スマホを横向きにすると遊びやすくなるよ</div>
  </section>
  <section id="controls" aria-label="タッチ操作">
    <div class="direction-pad">
      <button data-control="left" class="direction" aria-label="左">◀</button>
      <button data-control="down" class="direction" aria-label="しゃがむ">▼</button>
      <button data-control="right" class="direction" aria-label="右">▶</button>
      <button data-control="up" class="direction" aria-label="ジャンプ">▲</button>
      <button data-control="dash" class="direction dash">前ステップ</button>
    </div>
    <div class="attack-pad">
      <button data-control="weak" class="attack weak">弱</button>
      <button data-control="strong" class="attack heavy">強</button>
      <button data-control="throw" class="attack throw">投げ</button>
      <button data-control="special1" class="attack special" id="special-1">必1</button>
      <button data-control="special2" class="attack special" id="special-2">必2</button>
      <button data-control="special3" class="attack special" id="special-3">必3</button>
      <button data-control="super" class="attack ultimate">奥義</button>
    </div>
  </section>
  <footer class="footnote">
    <span>PC：← → ↑ ↓／弱Z・強X／必殺1・2・3／投V／奥義Q／ステップC</span>
    <span id="loading-status">3Dモデル待機中</span>
  </footer>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
