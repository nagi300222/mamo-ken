name: G01 RNG and combo schema fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/v2-types/battle-state-v2.ts'
      - 'src/core/v2-validation/battle-state-v2-validation.ts'
      - 'test/battle-state-v2.test.mjs'
      - 'design/combat/contracts/MAMOKEN_BATTLE_STATE_AND_MOVESPEC_V2_v0.1.md'
      - 'reports/combat/G01_COMPLETION.md'
      - 'tools/apply_g01_rng_combo_fix.mjs'
      - '.github/workflows/g01-rng-combo-fix.yml'

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.head_ref == 'fix/battle-state-v2-rng-combo' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/battle-state-v2-rng-combo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tools/apply_g01_rng_combo_fix.mjs
      - run: npm run check:battle-state-v2
      - name: Commit generated correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/v2-types/battle-state-v2.ts src/core/v2-validation/battle-state-v2-validation.ts test/battle-state-v2.test.mjs design/combat/contracts/MAMOKEN_BATTLE_STATE_AND_MOVESPEC_V2_v0.1.md reports/combat/G01_COMPLETION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[g01-fix] preserve seed aiSeed and combo in generated contract"
          git push origin HEAD:fix/battle-state-v2-rng-combo
