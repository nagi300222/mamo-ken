name: Core contract check

on:
  pull_request:
    paths:
      - 'src/core/**'
      - 'runtime/**'
      - 'prototype/mamoken_prototype_v01.html'
      - 'dist/mamoken_mobile.html'
      - 'assets/roster3d/**'
      - 'design/**'
      - 'tools/build_mobile.mjs'
      - 'tools/build_character_catalog_browser.mjs'
      - 'tools/apply_t15_runtime_shadow_hook.mjs'
      - 'tools/apply_t17_runtime_command_canary.mjs'
      - 'tools/apply_t18_runtime_canary_audit.mjs'
      - 'tools/apply_t19_offline_core_default.mjs'
      - 'tools/apply_t20_full_roster_art_select.mjs'
      - 'tools/apply_t22_character_detail_panel.mjs'
      - 'tools/apply_t22_ui_contract.mjs'
      - 'tools/apply_t24_extended_command_shadow.mjs'
      - 'tools/apply_t26_browser_command_contract.mjs'
      - 'tools/apply_t28_roster_trial_select_ui.mjs'
      - 'tools/compare_runtime_shadow_reports.mjs'
      - 'test/core-spec.test.mjs'
      - 'test/command-parser.test.mjs'
      - 'test/command-catalog.test.mjs'
      - 'test/browser-command-contract.test.mjs'
      - 'test/additional-move-readiness.test.mjs'
      - 'test/combat-moves.test.mjs'
      - 'test/defense.test.mjs'
      - 'test/gauge-gyuiin.test.mjs'
      - 'test/ability-hooks.test.mjs'
      - 'test/sprite-pipeline.test.mjs'
      - 'test/cpu-persona.test.mjs'
      - 'test/ui-contract.test.mjs'
      - 'test/roster-core3.test.mjs'
      - 'test/full-roster-art.test.mjs'
      - 'test/roster-trial-select-ui.test.mjs'
      - 'test/character-catalog.test.mjs'
      - 'test/character-catalog-browser.test.mjs'
      - 'test/character-detail-panel.test.mjs'
      - 'test/runtime-adapter.test.mjs'
      - 'test/runtime-input-bridge.test.mjs'
      - 'test/runtime-command-shadow.test.mjs'
      - 'test/runtime-extended-command-shadow.test.mjs'
      - 'test/runtime-shadow-hook.test.mjs'
      - 'test/runtime-shadow-export.test.mjs'
      - 'test/runtime-command-canary.test.mjs'
      - 'test/runtime-canary-audit.test.mjs'
      - 'test/runtime-command-authority.test.mjs'
      - 'reports/T*_COMPLETION.md'
      - 'reports/current_impl_*.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/core-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  t28-generate:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/roster-trial-select-ui-v1' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/roster-trial-select-ui-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Normalize patcher replacements
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/apply_t28_roster_trial_select_ui.mjs')
          text=path.read_text()
          remove_lines=[
            "source=replaceOnce(source,'    const moves=BAL.CMD.moves[f.c.id];','    const moves=commandMovesFor(f.c);','canary command helper');\n",
            "source=replaceOnce(source,'  const moves=BAL.CMD.moves[myF.c.id]||[];','  const moves=commandMovesFor(myF.c);','move list command helper');\n",
          ]
          old="source=replaceOnce(source,'  const moves=BAL.CMD.moves[f.c.id];','  const moves=commandMovesFor(f.c);','command detection helper');\n"
          new="source=source.replaceAll('  const moves=BAL.CMD.moves[f.c.id];','  const moves=commandMovesFor(f.c);');\n"
          if text.count(old)!=1:
              raise SystemExit(f'command helper anchor count={text.count(old)}')
          text=text.replace(old,new)
          for needle in remove_lines:
              if text.count(needle)!=1:
                  raise SystemExit(f'cleanup anchor count={text.count(needle)}: {needle}')
              text=text.replace(needle,'')
          path.write_text(text)
          PY
      - name: Apply T28 runtime and UI integration
        run: node tools/apply_t28_roster_trial_select_ui.mjs
      - name: Remove superseded detail constant and persist fix
        run: |
          python - <<'PY'
          from pathlib import Path
          prototype=Path('prototype/mamoken_prototype_v01.html')
          old="const SELECT_DETAIL_BTN={x:60,y:638,w:W-120,h:74};\n"
          text=prototype.read_text()
          if text.count(old)!=1:
              raise SystemExit(f'old detail constant count={text.count(old)}')
          prototype.write_text(text.replace(old,''))
          patcher=Path('tools/apply_t28_roster_trial_select_ui.mjs')
          source=patcher.read_text()
          anchor="writeFileSync(TARGET,source,'utf8');\n"
          fix="source=replaceOnce(source,'const SELECT_DETAIL_BTN={x:60,y:638,w:W-120,h:74};\\n','','remove superseded T22 detail button');\n"
          if source.count(anchor)!=1:
              raise SystemExit('patcher write anchor missing')
          if fix not in source:
              source=source.replace(anchor,fix+anchor)
          patcher.write_text(source)
          PY
      - name: Build mobile distribution
        run: npm run build:mobile
      - name: Run T28 focused tests
        run: |
          npm run check:ui
          npm run check:roster-full
          npm run check:roster-trial-ui
          npm run check:character-detail
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/apply_t28_roster_trial_select_ui.mjs prototype/mamoken_prototype_v01.html dist/mamoken_mobile.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[t28] integrate offline trial roster and select UI"
          git fetch origin feature/roster-trial-select-ui-v1
          git rebase origin/feature/roster-trial-select-ui-v1
          git push origin HEAD:feature/roster-trial-select-ui-v1

  core-check:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'feature/roster-trial-select-ui-v1' || github.actor == 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and core tests
        run: npm run check:core
      - name: Command parser tests
        run: npm run check:command
      - name: Core3 command catalog overlap tests
        run: npm run check:command-catalog
      - name: Additional move readiness gate tests
        run: npm run check:additional-move-readiness
      - name: Combat MoveSpec and combo tests
        run: npm run check:combat
      - name: Defense and step tests
        run: npm run check:defense
      - name: Gauge, roar and Gyuiin tests
        run: npm run check:gauge
      - name: Ability hook tests
        run: npm run check:ability
      - name: Sprite pipeline tests
        run: npm run check:sprite
      - name: CPU persona and determinism tests
        run: npm run check:cpu
      - name: UI contract tests
        run: npm run check:ui
      - name: Core-three roster tests
        run: npm run check:roster
      - name: Full roster art and selection tests
        run: npm run check:roster-full
      - name: Offline trial roster UI tests
        run: npm run check:roster-trial-ui
      - name: Full character catalog tests
        run: npm run check:character-catalog
      - name: Generate browser character catalog
        run: npm run build:character-catalog-browser
      - name: Verify browser character catalog is reproducible
        run: git diff --exit-code -- runtime/character-catalog-browser.js
      - name: Browser character catalog tests
        run: npm run check:character-catalog-browser
      - name: Browser Core3 command contract tests
        run: npm run check:browser-command-contract
      - name: Legacy runtime adapter tests
        run: npm run check:runtime
      - name: Legacy runtime input bridge tests
        run: npm run check:runtime-input
      - name: Runtime command shadow tests
        run: npm run check:runtime-shadow
      - name: Extended 21-command shadow tests
        run: npm run check:runtime-extended-shadow
      - name: Runtime shadow hook tests
        run: npm run check:runtime-hook
      - name: Runtime shadow export and comparison tests
        run: npm run check:runtime-export
      - name: Runtime command canary tests
        run: npm run check:runtime-canary
      - name: Runtime canary audit tests
        run: npm run check:runtime-canary-audit
      - name: Offline default Core command authority tests
        run: npm run check:runtime-authority
      - name: Audit current implementation before build
        run: node tools/audit_current_impl.mjs
      - name: Build mobile distribution
        run: npm run build:mobile
      - name: Verify committed mobile distribution is reproducible
        run: git diff --exit-code -- dist/mamoken_mobile.html
      - name: Character detail panel tests
        run: npm run check:character-detail
      - name: Audit current implementation after build
        run: node tools/audit_current_impl.mjs
      - name: Restore generated audit outputs
        run: |
          git restore reports/current_impl_constants.json
          git restore reports/current_impl_phases.json
          git restore reports/current_impl_sync_scope.md
      - name: Verify scoped working tree
        run: |
          git diff --check
          git diff --exit-code -- index.html server assets
