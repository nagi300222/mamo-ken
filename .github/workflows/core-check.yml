name: Core contract check

on:
  pull_request:
    paths:
      - 'src/core/**'
      - 'runtime/**'
      - 'prototype/mamoken_prototype_v01.html'
      - 'dist/mamoken_mobile.html'
      - 'tools/build_mobile.mjs'
      - 'tools/apply_t15_runtime_shadow_hook.mjs'
      - 'tools/apply_t17_runtime_command_canary.mjs'
      - 'tools/apply_t18_runtime_canary_audit.mjs'
      - 'tools/apply_t19_offline_core_default.mjs'
      - 'tools/repair_and_apply_t19.mjs'
      - 'tools/compare_runtime_shadow_reports.mjs'
      - 'test/core-spec.test.mjs'
      - 'test/command-parser.test.mjs'
      - 'test/combat-moves.test.mjs'
      - 'test/defense.test.mjs'
      - 'test/gauge-gyuiin.test.mjs'
      - 'test/ability-hooks.test.mjs'
      - 'test/sprite-pipeline.test.mjs'
      - 'test/cpu-persona.test.mjs'
      - 'test/ui-contract.test.mjs'
      - 'test/roster-core3.test.mjs'
      - 'test/runtime-adapter.test.mjs'
      - 'test/runtime-input-bridge.test.mjs'
      - 'test/runtime-command-shadow.test.mjs'
      - 'test/runtime-shadow-hook.test.mjs'
      - 'test/runtime-shadow-export.test.mjs'
      - 'test/runtime-command-canary.test.mjs'
      - 'test/runtime-canary-audit.test.mjs'
      - 'test/runtime-command-authority.test.mjs'
      - 'reports/T*_COMPLETION.md'
      - 'reports/current_impl_*.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/core-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-t19:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/offline-core-command-default-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.generate.outputs.changed }}
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/offline-core-command-default-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate T19 sources
        id: generate
        run: |
          if grep -q "runtime-command-shadow-browser-v5" runtime/runtime-command-shadow-browser.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node tools/repair_and_apply_t19.mjs
          npm run build:mobile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A runtime/runtime-command-shadow-browser.js tools/apply_t19_offline_core_default.mjs tools/repair_and_apply_t19.mjs tools/compare_runtime_shadow_reports.mjs test/runtime-command-canary.test.mjs test/runtime-shadow-hook.test.mjs test/runtime-shadow-export.test.mjs test/runtime-canary-audit.test.mjs test/runtime-command-authority.test.mjs dist/mamoken_mobile.html
          git commit -m "[t19-generated] enable offline Core command authority by default"
          git push origin HEAD:feature/offline-core-command-default-v1
          echo "changed=true" >> "$GITHUB_OUTPUT"

  core-check:
    needs: generate-t19
    if: ${{ always() && (needs.generate-t19.result == 'skipped' || (needs.generate-t19.result == 'success' && needs.generate-t19.outputs.changed == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and core tests
        run: npm run check:core

      - name: Command parser tests
        run: npm run check:command

      - name: Combat MoveSpec and combo tests
        run: npm run check:combat

      - name: Defense and step tests
        run: npm run check:defense

      - name: Gauge, roar and Gyuiin tests
        run: npm run check:gauge

      - name: Ability hook tests
        run: npm run check:ability

      - name: Sprite pipeline tests
        run: npm run check:sprite

      - name: CPU persona and determinism tests
        run: npm run check:cpu

      - name: UI contract tests
        run: npm run check:ui

      - name: Core-three roster tests
        run: npm run check:roster

      - name: Legacy runtime adapter tests
        run: npm run check:runtime

      - name: Legacy runtime input bridge tests
        run: npm run check:runtime-input

      - name: Runtime command shadow tests
        run: npm run check:runtime-shadow

      - name: Runtime shadow hook tests
        run: npm run check:runtime-hook

      - name: Runtime shadow export and comparison tests
        run: npm run check:runtime-export

      - name: Runtime command canary tests
        run: npm run check:runtime-canary

      - name: Runtime canary audit tests
        run: npm run check:runtime-canary-audit

      - name: Offline default Core command authority tests
        run: npm run check:runtime-authority

      - name: Audit current implementation before build
        run: node tools/audit_current_impl.mjs

      - name: Build mobile distribution
        run: npm run build:mobile

      - name: Verify committed mobile distribution is reproducible
        run: git diff --exit-code -- dist/mamoken_mobile.html

      - name: Audit current implementation after build
        run: node tools/audit_current_impl.mjs

      - name: Restore generated audit outputs
        run: |
          git restore reports/current_impl_constants.json
          git restore reports/current_impl_phases.json
          git restore reports/current_impl_sync_scope.md

      - name: Verify scoped working tree
        run: |
          git diff --check
          git diff --exit-code -- index.html server assets
