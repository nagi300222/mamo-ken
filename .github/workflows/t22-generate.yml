name: T22 generate character detail panel

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t22-character-detail-panel
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/character-detail-panel-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/character-detail-panel-v1
          fetch-depth: 0

      - name: Detect generated integration
        id: state
        run: |
          if [[ -f runtime/character-catalog-browser.js ]] && grep -q 'T22 character detail panel' prototype/mamoken_prototype_v01.html; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.state.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.needed == 'true'
        run: npm ci

      - name: Generate browser catalog and apply T22
        if: steps.state.outputs.needed == 'true'
        run: |
          npm run build:character-catalog-browser
          node tools/apply_t22_ui_contract.mjs
          node tools/apply_t22_character_detail_panel.mjs
          npm run build:mobile
          npm run check:ui
          npm run check:character-catalog-browser
          npm run check:character-detail
          git diff --check

      - name: Commit generated integration
        if: steps.state.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/character-catalog-browser.js prototype/mamoken_prototype_v01.html dist/mamoken_mobile.html tools/build_mobile.mjs src/core/ui-contract.ts
          git commit -m "[t22-generated] integrate character detail panel"
          git push origin HEAD:feature/character-detail-panel-v1
