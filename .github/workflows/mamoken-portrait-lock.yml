name: MamoKen v14 fixed-landscape iPhone test

on:
  push:
    branches:
      - fix/mamoken-v14-landscape-locked-ui
  pull_request:
    branches:
      - feat/mamoken-v14-device-ready
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portrait-locked-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing game and portrait-axis unit tests
        run: npm --prefix exp/fable-3d/dojo test
      - name: Validate and build the actual shipped WebGL assets
        run: npm --prefix exp/fable-3d/dojo run build:pages
      - name: Install Chromium driver
        run: npm install --prefix "$RUNNER_TEMP/mamoken-browser" playwright-core@1.65.1
      - name: Exercise CSS-rotated touch, menu, 3D and orientation transitions
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          node exp/fable-3d/dojo/server.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/exp/fable-3d/dojo/ > /dev/null; then break; fi
            sleep 1
          done
          export NODE_PATH="$RUNNER_TEMP/mamoken-browser/node_modules"
          export MAMOKEN_EVIDENCE="$RUNNER_TEMP/landscape-evidence"
          node exp/fable-3d/dojo/acceptance/portrait-lock-browser.mjs
      - name: Screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mamoken-v14-portrait-landscape
          path: ${{ runner.temp }}/landscape-evidence/
          retention-days: 14
