name: Wiki integrity check

on:
  pull_request:
    paths:
      - 'wiki/**'
      - 'tools/check_wiki_entry.mjs'
      - '.github/workflows/wiki-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify direct Wiki entry
        run: node tools/check_wiki_entry.mjs
