name: Wiki integrity check

on:
  pull_request:
    paths:
      - 'wiki/**'
      - 'tools/check_wiki_entry.mjs'
      - '.github/workflows/wiki-check.yml'
      - 'assets/roster3d/**'
      - 'assets/art/ability_ui/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wiki-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify direct Wiki entry
        run: node tools/check_wiki_entry.mjs
      - name: Verify v15.1 move reference snapshot
        run: node --test wiki/check-v151.test.mjs
      - name: Install Japanese fonts and Chromium automation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix "$RUNNER_TEMP/mamoken-wiki-browser" playwright-core@1.65.1
      - name: Real Chromium desktop and mobile Wiki acceptance
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          python3 -m http.server 4174 --bind 127.0.0.1 --directory . > "$RUNNER_TEMP/wiki-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4174/wiki/ > /dev/null; then break; fi
            sleep 1
          done
          export NODE_PATH="$RUNNER_TEMP/mamoken-wiki-browser/node_modules"
          export MAMOKEN_WIKI_EVIDENCE="$RUNNER_TEMP/wiki-v151-evidence"
          node wiki/acceptance/v151-browser.mjs
      - name: Upload Wiki acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mamoken-wiki-v151-browser
          path: ${{ runner.temp }}/wiki-v151-evidence/
          retention-days: 14
      - name: Package v15.1 Wiki and locally playable sample movies
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mamoken-wiki-v151-website
          path: |
            wiki/
            assets/roster3d/
          retention-days: 14


