name: Combat v2 contract closure

on:
  pull_request:
    paths:
      - 'design/combat/contracts/**'
      - 'src/core/v2-types/**'
      - 'src/core/v2-validation/**'
      - 'src/core/legacy-adapter-v2.ts'
      - 'src/core/legacy-adapter-v2-types.ts'
      - 'src/core/index.ts'
      - 'test/combat-v2-contract.test.mjs'
      - 'test/legacy-adapter-v2.test.mjs'
      - 'reports/combat/**'
      - 'package.json'
      - '.github/workflows/combat-v2-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate integrated v0.2 contract
        run: npm run check:combat-v2
      - name: Validate G02 read-only legacy adapter
        run: npm run check:legacy-adapter-v2
      - name: Enforce G00 scoped diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- prototype dist runtime server assets
