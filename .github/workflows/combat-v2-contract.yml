name: Combat v2 contract closure

on:
  pull_request:
    paths:
      - 'design/combat/contracts/**'
      - 'src/core/v2-types/**'
      - 'src/core/v2-validation/**'
      - 'src/core/index.ts'
      - 'test/combat-v2-contract.test.mjs'
      - 'reports/combat/**'
      - 'package.json'
      - '.github/workflows/combat-v2-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate integrated v0.2 contract
        run: npm run check:combat-v2
      - name: Enforce G00 scoped diff
        run: |
          git diff --check
          git diff --exit-code origin/${{ github.base_ref }}...HEAD -- prototype dist runtime server assets
