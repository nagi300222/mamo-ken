name: T20 generate full roster art select

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t20-full-roster-art-select
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/full-roster-art-select-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-roster-art-select-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore T20 source payload
        run: |
          cat .github/t20_payload/chunk_*.b64 > /tmp/t20_payload.b64
          base64 --decode /tmp/t20_payload.b64 > /tmp/t20_payload.tar.gz
          tar -xzf /tmp/t20_payload.tar.gz -C .

      - name: Apply corrected T20 integration sources
        run: |
          tar -xzf .github/t20_override.tar.gz -C .
          python - <<'PY'
          from pathlib import Path
          path=Path('design/2D_ART_RESUME_PLAN_2026-08-06.md')
          text=path.read_text()
          text=text.replace('既存9画像のみ','既存画像のみ（正式な9画像）')
          path.write_text(text)
          PY

      - name: Apply full roster integration
        run: |
          node tools/apply_t20_full_roster_art_select.mjs
          npm run build:mobile
          npm run check:roster-full
          npm run check:ui
          node tools/audit_current_impl.mjs
          git diff --check

      - name: Commit generated integration
        run: |
          rm -rf .github/t20_payload .github/t20_override.tar.gz .github/t20_override_v2
          git rm .github/workflows/t20-generate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[t20-generated] integrate full roster art selection"
          git push origin HEAD:feature/full-roster-art-select-v1
