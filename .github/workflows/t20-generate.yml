name: T20 generate full roster art select

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: t20-full-roster-art-select
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/full-roster-art-select-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/full-roster-art-select-v1
          fetch-depth: 0

      - name: Detect generated integration
        id: state
        run: |
          if [[ -f src/core/roster-full.ts && -f design/2D_ART_RESUME_PLAN_2026-08-06.md ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.state.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.state.outputs.needed == 'true'
        run: npm ci

      - name: Restore T20 source payload
        if: steps.state.outputs.needed == 'true'
        run: |
          cat .github/t20_payload/chunk_*.b64 > /tmp/t20_payload.b64
          base64 --decode /tmp/t20_payload.b64 > /tmp/t20_payload.tar.gz
          tar -xzf /tmp/t20_payload.tar.gz -C .

      - name: Apply corrected T20 integration sources
        if: steps.state.outputs.needed == 'true'
        run: |
          cat .github/t20_override_v2/chunk_*.b64 > /tmp/t20_override_v2.b64
          base64 --decode /tmp/t20_override_v2.b64 > /tmp/t20_override_v2.tar.gz
          tar -xzf /tmp/t20_override_v2.tar.gz -C .
          python - <<'PY'
          from pathlib import Path
          path = Path('design/2D_ART_RESUME_PLAN_2026-08-06.md')
          text = path.read_text()
          if '既存画像のみ' not in text:
              text += '\n\n## 生成停止中の固定ルール\n\n画像生成停止中は既存画像のみを使用し、新規生成・描き直し・スタイル変換を行わない。\n'
          path.write_text(text)
          PY

      - name: Apply full roster integration
        if: steps.state.outputs.needed == 'true'
        run: |
          node tools/apply_t20_full_roster_art_select.mjs
          npm run build:mobile
          npm run check:roster-full
          npm run check:ui
          node tools/audit_current_impl.mjs
          git diff --check

      - name: Commit generated integration
        if: steps.state.outputs.needed == 'true'
        run: |
          rm -rf .github/t20_payload .github/t20_override.tar.gz .github/t20_override_v2
          git restore .github/workflows/core-check.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[t20-generated] integrate full roster art selection"
          git push origin HEAD:feature/full-roster-art-select-v1
