name: MamoKen v15 Practice + Cancel regression

on:
  push:
    paths-ignore:
      - docs/**
      - exp/fable-3d/normal-art/**
    branches:
      - feat/mamoken-v151-normal-balance
      - feat/mamoken-v151-reviewed-integration
      - feat/mamoken-v15-combat-cancels
      - feat/mamoken-v15-practice-mode
  pull_request:
    branches:
      - feat/mamoken-v15-practice-mode
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combat-practice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All pure game and UI tests
        run: npm --prefix exp/fable-3d/dojo test
      - name: Measure 54 normals and repeated 9 by 9 CPU patterns
        env:
          MAMOKEN_AUDIT_DIR: ${{ runner.temp }}/mamoken-v15-evidence/balance
        run: node exp/fable-3d/dojo/normal-audit-v151.mjs
      - name: Build actual WebGL game assets
        run: npm --prefix exp/fable-3d/dojo run build:pages
      - name: Install Playwright Chromium bridge
        run: npm install --prefix "$RUNNER_TEMP/v15-browser" playwright-core@1.65.1
      - name: Real mobile browser Practice / cinematic and rotation
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          node exp/fable-3d/dojo/server.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/exp/fable-3d/dojo/ > /dev/null; then break; fi
            sleep 1
          done
          export NODE_PATH="$RUNNER_TEMP/v15-browser/node_modules"
          export MAMOKEN_EVIDENCE="$RUNNER_TEMP/mamoken-v15-evidence"
          node exp/fable-3d/dojo/acceptance/portrait-lock-browser.mjs
          node exp/fable-3d/dojo/acceptance/v15-practice-browser.mjs
      - name: Capture screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v15-practice-combat-chromium
          path: ${{ runner.temp }}/mamoken-v15-evidence/
          retention-days: 14
