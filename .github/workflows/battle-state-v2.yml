name: BattleState v2 schema

on:
  pull_request:
    paths:
      - 'design/combat/contracts/MAMOKEN_BATTLE_STATE_AND_MOVESPEC_V2_v0.1.md'
      - 'src/core/v2-types/battle-state-v2.ts'
      - 'src/core/v2-types/move-spec-v2.ts'
      - 'src/core/v2-validation/battle-state-v2-validation.ts'
      - 'src/core/index.ts'
      - 'test/battle-state-v2.test.mjs'
      - 'reports/combat/G01_COMPLETION.md'
      - 'reports/combat/G01_2_COMPLETION.md'
      - 'tools/apply_g01_rng_combo_fix.mjs'
      - 'package.json'
      - '.github/workflows/battle-state-v2.yml'
  workflow_dispatch:

concurrency:
  group: battle-state-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate BattleState and MoveSpec V2 schemas
        run: npm run check:battle-state-v2
      - name: Verify generated G01.2 contract is reproducible
        run: |
          node tools/apply_g01_rng_combo_fix.mjs
          git diff --exit-code -- src/core/v2-types/battle-state-v2.ts src/core/v2-validation/battle-state-v2-validation.ts test/battle-state-v2.test.mjs design/combat/contracts/MAMOKEN_BATTLE_STATE_AND_MOVESPEC_V2_v0.1.md reports/combat/G01_COMPLETION.md
      - name: Enforce G01 scoped diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          # このワークフローはpackage.json変更だけでも起動する(npm ci整合のためtrigger pathsに含む)。
          # G01が実際に所有するスキーマ/コントラクト本体が変更されていない場合、このPRはG01と無関係な
          # 変更(例: package.jsonへのスクリプト追加のみ)がpathsにマッチしただけなので、
          # shadow-only scope enforcementの対象外とする。G01所有ファイルが変更されている場合は
          # 従来どおりprototype/dist/runtime等への漏れを検出する(shadow-only契約の保護は維持する)。
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            design/combat/contracts/MAMOKEN_BATTLE_STATE_AND_MOVESPEC_V2_v0.1.md \
            src/core/v2-types/battle-state-v2.ts \
            src/core/v2-types/move-spec-v2.ts \
            src/core/v2-validation/battle-state-v2-validation.ts \
            src/core/index.ts \
            test/battle-state-v2.test.mjs \
            reports/combat/G01_COMPLETION.md \
            reports/combat/G01_2_COMPLETION.md \
            tools/apply_g01_rng_combo_fix.mjs; then
            echo "G01所有ファイルの変更なし(package.json等の付随trigger pathのみ)。scoped-diff enforcementは対象外。"
            exit 0
          fi
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- prototype dist runtime server assets src/product design/product
