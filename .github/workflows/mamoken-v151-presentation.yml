name: MamoKen v15.1 Presentation (VS / face intro / KO / victory)

on:
  push:
    paths-ignore:
      - docs/**
    branches:
      - feat/mamoken-v151-ko-victory-intro
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All pure game and UI tests
        run: npm --prefix exp/fable-3d/dojo test
      - name: Build actual WebGL game assets (Pages output)
        run: npm --prefix exp/fable-3d/dojo run build:pages
      - name: Install Playwright Chromium bridge
        run: npm install --prefix "$RUNNER_TEMP/v151-browser" playwright-core@1.65.1
      - name: Real WebGL Chromium - presentation flow plus practice and rotation regressions
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          node exp/fable-3d/dojo/server.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/exp/fable-3d/dojo/ > /dev/null; then break; fi
            sleep 1
          done
          export NODE_PATH="$RUNNER_TEMP/v151-browser/node_modules"
          export MAMOKEN_EVIDENCE="$RUNNER_TEMP/mamoken-v151-evidence"
          node exp/fable-3d/dojo/acceptance/v151-presentation-browser.mjs
          node exp/fable-3d/dojo/acceptance/portrait-lock-browser.mjs
          node exp/fable-3d/dojo/acceptance/v15-practice-browser.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v151-presentation-chromium
          path: ${{ runner.temp }}/mamoken-v151-evidence/
          retention-days: 14
