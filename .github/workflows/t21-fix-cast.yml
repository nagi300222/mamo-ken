name: T21 fix catalog cast

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/character-catalog-v1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/character-catalog-v1
          fetch-depth: 0
      - name: Apply safe catalog map cast
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/core/character-catalog.ts')
          text = path.read_text()
          old = ') as Readonly<Record<CharacterId, CharacterCatalogEntry>>;'
          new = ') as unknown as Readonly<Record<CharacterId, CharacterCatalogEntry>>;'
          if old in text:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit('expected cast not found')
          PY
      - name: Commit fix when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/character-catalog.ts
          git commit -m "[t21] make catalog lookup cast explicit"
          git push origin HEAD:feature/character-catalog-v1
