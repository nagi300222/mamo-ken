name: T19 generate offline Core command default

on:
  push:
    branches:
      - 'feature/offline-core-command-default-v1'

permissions:
  contents: write

concurrency:
  group: t19-offline-core-command-default
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[t19-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/offline-core-command-default-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply T19 authority patch
        run: node tools/apply_t19_offline_core_default.mjs

      - name: Build mobile distribution
        run: npm run build:mobile

      - name: Verify focused runtime contracts
        run: |
          npm run check:runtime-hook
          npm run check:runtime-export
          npm run check:runtime-canary
          npm run check:runtime-canary-audit
          npm run check:runtime-authority

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/runtime-command-shadow-browser.js tools/compare_runtime_shadow_reports.mjs test/runtime-command-canary.test.mjs test/runtime-shadow-hook.test.mjs test/runtime-shadow-export.test.mjs test/runtime-canary-audit.test.mjs test/runtime-command-authority.test.mjs dist/mamoken_mobile.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "[t19-generated] enable offline Core command authority by default"
            git push origin HEAD:feature/offline-core-command-default-v1
          fi
