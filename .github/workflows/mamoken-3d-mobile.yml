name: MamoKen 3D Mobile Dojo

on:
  push:
    branches:
      - feat/mamoken-3d-mobile-fight
      - feat/mamoken-3d-motion-live-v04
      - feat/mamoken-balance-v05
      - feat/mamoken-step-buttons-v06
      - feat/mamoken-direction-special-v07
      - feat/mamoken-showtime-v08
      - feat/mamoken-y-illusion-v09
      - feat/mamoken-codex-audio-v10
      - feat/mamoken-astra-hud-v11
      - feat/mamoken-super-hit-cinematic-v13
      - feat/mamoken-matte-battle-ui
  pull_request:
    branches:
      - feat/mamoken-3d-mobile-fight
      - feat/mamoken-step-buttons-v06
    paths:
      - .github/workflows/mamoken-3d-mobile.yml
      - exp/fable-3d/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TOKEN: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_API_TOKEN || '' }}
      CF_ACCOUNT: ${{ github.event_name != 'pull_request' && secrets.CLOUDFLARE_ACCOUNT_ID || '' }}
      CF_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - name: Checkout 3D models and dojo
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check exp/fable-3d/dojo/balance.js
          node --check exp/fable-3d/dojo/battle.js
          node --check exp/fable-3d/dojo/commands.js
          node --check exp/fable-3d/dojo/cpu.js
          node --check exp/fable-3d/dojo/models.js
          node --check exp/fable-3d/dojo/camera-frame.js
          node --check exp/fable-3d/dojo/main.js
          node --check exp/fable-3d/dojo/build-pages.mjs
          node --check exp/fable-3d/dojo/server.mjs
      - name: Combat simulation tests
        run: npm --prefix exp/fable-3d/dojo test
      - name: Build static Cloudflare Pages assets
        run: npm --prefix exp/fable-3d/dojo run build:pages
      - name: Archive Pages preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: mamoken-3d-pages
          path: exp/fable-3d/_pages/
          retention-days: 14
      - name: Deploy Cloudflare Pages preview (only when configured)
        if: ${{ github.event_name != 'pull_request' && env.CF_TOKEN != '' && env.CF_ACCOUNT != '' && env.CF_PROJECT != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT }}
        run: >
          npx --yes wrangler@4 pages deploy exp/fable-3d/_pages
          --project-name "$CF_PROJECT"
          --branch "$GITHUB_REF_NAME"
          --commit-hash "$GITHUB_SHA"
      - name: Test the deployed Issue 150 preview in Chromium
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/mobile-v2-acceptance-150' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          MAMOKEN_URL: https://fix-mobile-v2-acceptance-150.mamoken-3d.pages.dev/
        run: |
          set -euo pipefail
          files=(index.html style.css main.js battle.js commands.js models.js)
          ready=false
          for attempt in {1..24}; do
            ready=true
            for file in "${files[@]}"; do
              remote="$RUNNER_TEMP/mamoken-$file"
              url="${MAMOKEN_URL}dojo/$file?audit=$GITHUB_SHA"
              if ! curl -fsSL --max-time 10 "$url" -o "$remote" ||
                ! cmp -s "exp/fable-3d/_pages/dojo/$file" "$remote"; then
                ready=false
                break
              fi
            done
            if "$ready"; then break; fi
            sleep 10
          done
          if ! "$ready"; then
            echo "Cloudflare preview did not serve the files from this commit."
            exit 1
          fi
          npm install --prefix "$RUNNER_TEMP/mamoken-browser" playwright-core@1.65.1
          export NODE_PATH="$RUNNER_TEMP/mamoken-browser/node_modules"
          export CHROMIUM_PATH="$(command -v google-chrome)"
          export MAMOKEN_EVIDENCE="$RUNNER_TEMP/mamoken-evidence"
          mkdir -p "$MAMOKEN_EVIDENCE"
          node exp/fable-3d/dojo/acceptance/browser.mjs | tee "$MAMOKEN_EVIDENCE/browser.txt"
      - name: Archive Cloudflare browser evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'fix/mobile-v2-acceptance-150' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@v4
        with:
          name: mamoken-3d-browser
          path: ${{ runner.temp }}/mamoken-evidence/
          retention-days: 14
