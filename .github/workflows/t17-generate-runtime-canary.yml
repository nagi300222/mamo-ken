name: T17 generate runtime command canary

on:
  push:
    branches:
      - 'feature/runtime-command-canary-v1'

permissions:
  contents: write

concurrency:
  group: t17-runtime-command-canary
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[t17-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/runtime-command-canary-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply runtime canary hook
        run: node tools/apply_t17_runtime_command_canary.mjs

      - name: Build mobile distribution
        run: npm run build:mobile

      - name: Commit generated runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/mamoken_prototype_v01.html dist/mamoken_mobile.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "[t17-generated] apply offline command canary"
            git push origin HEAD:feature/runtime-command-canary-v1
          fi
