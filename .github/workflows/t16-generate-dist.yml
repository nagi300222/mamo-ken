name: T16 generate runtime shadow export distribution

on:
  push:
    branches:
      - 'feature/runtime-shadow-export-v1'

permissions:
  contents: write

concurrency:
  group: t16-runtime-shadow-export-dist
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[t16-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/runtime-shadow-export-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime shadow export
        run: npm run check:runtime-export

      - name: Build mobile distribution
        run: npm run build:mobile

      - name: Commit generated distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/mamoken_mobile.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "[t16-generated] update mobile shadow export"
            git push origin HEAD:feature/runtime-shadow-export-v1
          fi
