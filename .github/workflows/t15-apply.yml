name: T15 apply runtime shadow hook

on:
  push:
    branches:
      - 'feature/runtime-shadow-hook-v1'

permissions:
  contents: write

concurrency:
  group: t15-runtime-shadow-hook
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[t15-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/runtime-shadow-hook-v1
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply runtime hook
        run: node tools/apply_t15_runtime_shadow_hook.mjs

      - name: Build mobile distribution
        run: npm run build:mobile

      - name: Verify generated hook
        run: npm run check:runtime-hook

      - name: Commit generated runtime files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype/mamoken_prototype_v01.html dist/mamoken_mobile.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "[t15-generated] apply runtime shadow hook"
            git push origin HEAD:feature/runtime-shadow-hook-v1
          fi
